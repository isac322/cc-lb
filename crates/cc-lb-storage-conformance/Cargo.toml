[package]
name = "cc-lb-storage-conformance"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[test]]
name = "integration"
path = "tests/all.rs"

[features]
default = ["sqlite"]
postgres = ["dep:cc-lb-storage-postgres", "dep:sqlx"]
sqlite = ["dep:sqlx"]

[dependencies]
cc-lb-domain.workspace = true
cc-lb-clock = { path = "../cc-lb-clock" }
cc-lb-storage-api = { path = "../cc-lb-storage-api" }
cc-lb-plugin-wire = { path = "../cc-lb-plugin-wire", features = ["std"] }
cc-lb-engine = { path = "../cc-lb-engine" }
cc-lb-aead = { path = "../cc-lb-aead" }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
futures = "0.3"
proptest = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
cc-lb-storage-postgres = { path = "../cc-lb-storage-postgres", optional = true }
cc-lb-storage-sqlite = { path = "../cc-lb-storage-sqlite" }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-ring"], optional = true }
tokio-util = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
cc-lb-testkit = { path = "../cc-lb-testkit" }
tempfile = { workspace = true }
