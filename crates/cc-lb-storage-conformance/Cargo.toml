[package]
name = "cc-lb-storage-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
redb = ["dep:cc-lb-storage-redb"]
postgres = ["dep:cc-lb-storage-postgres", "dep:sqlx"]

[dependencies]
cc-lb-storage-api = { path = "../cc-lb-storage-api" }
cc-lb-aead = { path = "../cc-lb-aead" }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
futures = "0.3"
anyhow = { workspace = true }
serde_json = { workspace = true }
cc-lb-storage-redb = { path = "../cc-lb-storage-redb", optional = true }
cc-lb-storage-postgres = { path = "../cc-lb-storage-postgres", optional = true }
sqlx = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
