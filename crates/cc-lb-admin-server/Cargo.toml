[package]
name = "cc-lb-admin-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
autotests = false

[features]
default = ["sqlite", "embed-spa"]
embed-spa = ["cc-lb-admin/embed-spa"]
sqlite = [
    "cc-lb-admin/sqlite",
    "cc-lb-runtime-sync/default",
    "cc-lb-runtime-sync/sqlite",
    "cc-lb-scheduler/default",
    "cc-lb-scheduler/sqlite",
]
postgres = [
    "cc-lb-admin/postgres",
    "cc-lb-runtime-sync/postgres",
    "cc-lb-scheduler/postgres",
]

[[bin]]
name = "cc-lb-admin"
path = "src/main.rs"
test = false

[[test]]
name = "integration"
path = "tests/all.rs"

[dependencies]
async-trait.workspace = true
axum.workspace = true
cc-lb-aead = { path = "../cc-lb-aead" }
cc-lb-admin = { path = "../cc-lb-admin", default-features = false }
cc-lb-clock = { path = "../cc-lb-clock" }
cc-lb-config = { path = "../cc-lb-config" }
cc-lb-control = { path = "../cc-lb-control" }
cc-lb-domain.workspace = true
cc-lb-observability = { path = "../cc-lb-observability" }
cc-lb-providers.workspace = true
cc-lb-runtime-sync = { workspace = true, default-features = false }
cc-lb-scheduler = { path = "../cc-lb-scheduler", default-features = false }
cc-lb-storage-api = { path = "../cc-lb-storage-api" }
cc-lb-upstream.workspace = true
clap = { workspace = true, features = ["derive"] }
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true, features = ["http1", "http2", "server-auto", "service", "tokio"] }
rustls.workspace = true
thiserror.workspace = true
tikv-jemallocator = "0.7"
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tower = { workspace = true, features = ["util"] }
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
cc-lb-storage-sqlite = { path = "../cc-lb-storage-sqlite" }
cc-lb-workspace-hack.workspace = true
http-body-util.workspace = true
serde_json.workspace = true
tempfile.workspace = true
