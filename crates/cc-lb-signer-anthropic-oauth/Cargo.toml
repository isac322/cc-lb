[package]
name = "cc-lb-signer-anthropic-oauth"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[test]]
name = "integration"
path = "tests/all.rs"

[dependencies]
async-trait.workspace = true
bytes.workspace = true
cc-lb-aead = { path = "../cc-lb-aead" }
cc-lb-clock = { path = "../cc-lb-clock" }
cc-lb-domain.workspace = true
cc-lb-oauth-protocol = { path = "../cc-lb-oauth-protocol" }
cc-lb-storage-api = { path = "../cc-lb-storage-api" }
cc-lb-upstream.workspace = true
dashmap.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client", "client-legacy", "http1", "tokio"] }
oauth2.workspace = true
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
