[package]
name = "cc-lb-signer-anthropic-oauth"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
sqlite = []
postgres = []

[dependencies]
async-trait.workspace = true
bytes.workspace = true
cc-lb-aead = { path = "../cc-lb-aead" }
cc-lb-plugin-api = { path = "../cc-lb-plugin-api" }
cc-lb-storage-api = { path = "../cc-lb-storage-api" }
dashmap.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client", "client-legacy", "http1", "tokio"] }
metrics.workspace = true
oauth2.workspace = true
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
chrono.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
