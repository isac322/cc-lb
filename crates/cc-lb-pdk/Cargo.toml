[package]
name = "cc-lb-pdk"
# Plugin trio runs on its own SemVer line, decoupled from workspace version.
# Lockstep with cc-lb-plugin-wire / cc-lb-plugin-api via `=` pin in
# workspace.dependencies.
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "cc-lb Plugin Development Kit — proc-macros for authoring Extism plugins targeting the cc-lb host."
repository = "https://github.com/isac322/cc-lb"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
cc-lb-plugin-wire.workspace = true
serde_json = "1"
