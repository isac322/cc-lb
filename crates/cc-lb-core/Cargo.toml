[package]
name = "cc-lb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
redb = []
postgres = []

[dependencies]
arc-swap.workspace = true
async-stream.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
bincode = "1"
cc-lb-aead = { path = "../cc-lb-aead" }
cc-lb-storage-api = { path = "../cc-lb-storage-api" }
cc-lb-observability = { path = "../cc-lb-observability" }
cc-lb-pricing = { path = "../cc-lb-pricing" }
cc-lb-storage-redb = { path = "../cc-lb-storage-redb" }
cc-lb-plugin-api = { path = "../cc-lb-plugin-api" }
cc-lb-dialect-bedrock = { path = "../cc-lb-dialect-bedrock" }
cc-lb-dialect-vertex = { path = "../cc-lb-dialect-vertex" }
dashmap.workspace = true
eventsource-stream.workspace = true
futures-core = "0.3"
hickory-resolver = { workspace = true, features = ["tokio"] }
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "tokio"] }
metrics.workspace = true
rand = "0.8.6"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
ulid = "1"
url.workspace = true
tower-service.workspace = true
tower.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
