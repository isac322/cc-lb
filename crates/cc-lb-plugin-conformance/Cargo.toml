[package]
name = "cc-lb-plugin-conformance"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "In-process conformance harness for cc-lb wasmtime plugins. Plugin authors add this as a dev-dependency and call `ConformanceSuite::for_shape(&wasm).run()` from a single #[test] to prove their compiled wasm passes every admission check and ABI round-trip the production cc-lb host runs."
repository = "https://github.com/isac322/cc-lb"

[lib]
crate-type = ["rlib"]

[dependencies]
cc-lb-plugin-api = { workspace = true }
cc-lb-plugin-types = { workspace = true, features = ["std"] }
cc-lb-runtime-wasmtime = { workspace = true }
rkyv = { workspace = true, features = ["std", "bytecheck"] }
blake3 = { workspace = true, features = ["std"] }
