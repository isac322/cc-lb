[package]
name = "cc-lb-plugin-conformance"
version = "0.2.4"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "In-process conformance harness for cc-lb wasmtime plugin authors. Verifies plugin ABI and wire fingerprint matches host."
repository = "https://github.com/isac322/cc-lb"
readme = "README.md"
keywords = ["cc-lb", "plugin", "wasm", "conformance", "testing"]
categories = ["wasm", "development-tools::testing"]

[lib]
crate-type = ["rlib"]

[dependencies]
cc-lb-plugin-wire = { workspace = true, features = ["std"] }
cc-lb-runtime-wasmtime = { workspace = true }
rkyv = { workspace = true, features = ["std", "bytecheck"] }
blake3 = { workspace = true, features = ["std"] }
