[package]
name = "cc-lb-plugin-conformance"
# Public crates.io surface — independent SemVer line, decoupled from workspace
# version. Lockstep with workspace.dependencies `=` pin in root Cargo.toml.
version = "0.1.3"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "cc-lb plugin conformance suite — in-process protocol verification helpers for external plugin authors."
repository = "https://github.com/isac322/cc-lb"
readme = "README.md"
keywords = ["cc-lb", "plugin", "conformance", "wasm", "testing"]
categories = ["wasm", "development-tools::testing"]
exclude = [
    "build.rs",
    "tests/**",
    "public-api.txt",
]

[features]
default = ["dispatch"]
dispatch = []

[dependencies]
cc-lb-runtime-protocol = { workspace = true }
cc-lb-plugin-wire = { workspace = true }
cc-lb-plugin-api  = { workspace = true }
extism.workspace = true        # PluginSession (Task 22) stores extism::Plugin
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
base64.workspace = true
thiserror.workspace = true
wasmparser = "0.252.0"

[dev-dependencies]
anyhow.workspace = true
