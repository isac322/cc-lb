[package]
name = "cc-lb-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"
autotests = false

[features]
default = ["sqlite"]
sqlite = [
    "cc-lb-scheduler/sqlite",
    "cc-lb-admin/sqlite",
    "cc-lb-engine/sqlite",
    "cc-lb-signer-anthropic-key/sqlite",
    "cc-lb-signer-anthropic-oauth/sqlite",
    "dep:apalis-codec",
    "dep:apalis-sqlite",
    "dep:cc-lb-scheduler",
    "dep:scheduler-sqlx",
    "scheduler-sqlx/sqlite",
]
postgres = [
    "cc-lb-scheduler/postgres",
    "cc-lb-admin/postgres",
    "cc-lb-engine/postgres",
    "cc-lb-signer-anthropic-key/postgres",
    "cc-lb-signer-anthropic-oauth/postgres",
    "dep:apalis-postgres",
    "dep:cc-lb-scheduler",
    "dep:cc-lb-storage-postgres",
    "dep:scheduler-sqlx",
    "dep:sqlx",
    "scheduler-sqlx/postgres",
]

[[bin]]
name = "cc-lb"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/all.rs"

[dependencies]
anyhow.workspace = true
apalis-codec = { version = "0.1.0-rc.9", optional = true, default-features = false, features = ["json"] }
apalis-postgres = { version = "^1.0.0-rc.8", optional = true }
apalis-sqlite = { version = "^1.0.0-rc.8", optional = true }
async-stream.workspace = true
async-trait.workspace = true
arc-swap.workspace = true
axum = { workspace = true, features = ["multipart"] }
bytes.workspace = true
chrono.workspace = true
cc-lb-aead = { path = "../cc-lb-aead" }
cc-lb-admin = { path = "../cc-lb-admin", default-features = false }
cc-lb-config = { path = "../cc-lb-config" }
cc-lb-clock = { path = "../cc-lb-clock" }
cc-lb-request-log.workspace = true
cc-lb-control = { path = "../cc-lb-control" }
cc-lb-domain.workspace = true
cc-lb-engine = { path = "../cc-lb-engine" }
cc-lb-dialect-anthropic = { path = "../cc-lb-dialect-anthropic" }
cc-lb-lifecycle.workspace = true
cc-lb-observability = { path = "../cc-lb-observability" }
cc-lb-oauth-protocol = { path = "../cc-lb-oauth-protocol" }
cc-lb-plugin-wire = { workspace = true, features = ["std"] }
cc-lb-routing.workspace = true
cc-lb-pricing = { path = "../cc-lb-pricing" }
cc-lb-runtime-wasmtime = { workspace = true }
cc-lb-scheduler = { path = "../cc-lb-scheduler", optional = true, default-features = false }
cc-lb-signer-anthropic-key = { path = "../cc-lb-signer-anthropic-key" }
cc-lb-signer-anthropic-oauth = { path = "../cc-lb-signer-anthropic-oauth" }
cc-lb-storage-api = { path = "../cc-lb-storage-api" }
cc-lb-storage-postgres = { path = "../cc-lb-storage-postgres", optional = true }
cc-lb-storage-sqlite = { path = "../cc-lb-storage-sqlite" }
cc-lb-upstream.workspace = true
clap = { workspace = true, features = ["derive"] }
futures-util = "0.3"
http.workspace = true
http-body-util.workspace = true
hex.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "tokio"] }
metrics.workspace = true
notify.workspace = true
oauth2.workspace = true
parking_lot = "0.12"
nix = { version = "0.31.3", features = ["resource"] }
rand = { version = "0.10", features = ["std", "std_rng"] }
rkyv = { workspace = true, features = ["std", "bytecheck"] }
reqwest.workspace = true
rustls = { workspace = true, default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sonic-rs.workspace = true
sha2.workspace = true
siphasher = "1"
scheduler-sqlx = { package = "sqlx", version = "=0.8.6", optional = true, default-features = false, features = ["chrono", "json", "migrate", "runtime-tokio", "tls-rustls-ring", "uuid"] }
sqlx = { workspace = true, optional = true }
tempfile.workspace = true
thiserror.workspace = true
tikv-jemallocator = "0.7"
tokio = { workspace = true, features = ["fs", "io-util", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time", "test-util"] }
tokio-util.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { workspace = true, features = ["timeout", "util"] }
tower-http = { workspace = true, features = ["compression-br", "compression-gzip", "set-header"] }
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
xxhash-rust.workspace = true
toml.workspace = true

[dev-dependencies]
base64.workspace = true
cc-lb-storage-postgres = { path = "../cc-lb-storage-postgres" }
metrics-exporter-prometheus.workspace = true
fake-anthropic = { path = "../../tests/fixtures/fake-anthropic", features = ["debug-endpoints"] }
jemalloc_ctl = { package = "tikv-jemalloc-ctl", version = "0.7", features = ["stats"] }
sqlx.workspace = true
tracing-subscriber.workspace = true
wat.workspace = true
