[package]
name = "cc-lb-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[features]
default = ["sqlite"]
sqlite = [
    "cc-lb-admin/sqlite",
    "cc-lb-core/sqlite",
    "cc-lb-signer-anthropic-key/sqlite",
    "cc-lb-signer-anthropic-oauth/sqlite",
]
postgres = [
    "cc-lb-admin/postgres",
    "cc-lb-core/postgres",
    "cc-lb-signer-anthropic-key/postgres",
    "cc-lb-signer-anthropic-oauth/postgres",
    "dep:cc-lb-storage-postgres",
    "dep:sqlx",
]
wasmtime = []

[[bin]]
name = "cc-lb"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-stream.workspace = true
async-trait.workspace = true
arc-swap.workspace = true
axum = { workspace = true, features = ["multipart"] }
bytes.workspace = true
chrono.workspace = true
cc-lb-aead = { path = "../cc-lb-aead" }
cc-lb-admin = { version = "0.1.0", path = "../cc-lb-admin" }
cc-lb-config = { path = "../cc-lb-config" }
cc-lb-core = { path = "../cc-lb-core" }
cc-lb-dialect-anthropic = { path = "../cc-lb-dialect-anthropic" }
cc-lb-observability = { path = "../cc-lb-observability" }
cc-lb-plugin-api = { path = "../cc-lb-plugin-api" }
cc-lb-plugin-wire = { path = "../cc-lb-plugin-wire" }
cc-lb-pricing = { path = "../cc-lb-pricing" }
cc-lb-runtime-extism = { path = "../cc-lb-runtime-extism" }
cc-lb-signer-anthropic-key = { path = "../cc-lb-signer-anthropic-key" }
cc-lb-signer-anthropic-oauth = { path = "../cc-lb-signer-anthropic-oauth" }
cc-lb-storage-api = { path = "../cc-lb-storage-api" }
cc-lb-storage-postgres = { path = "../cc-lb-storage-postgres", optional = true }
cc-lb-storage-sqlite = { path = "../cc-lb-storage-sqlite" }
clap = { workspace = true, features = ["derive"] }
http.workspace = true
http-body-util.workspace = true
hex.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "tokio"] }
metrics.workspace = true
notify.workspace = true
oauth2.workspace = true
parking_lot = "0.12"
nix = { version = "0.31.3", features = ["resource"] }
rand = { version = "0.10", features = ["std", "std_rng"] }
rustls = { workspace = true, default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
siphasher = "1"
sqlx = { workspace = true, optional = true }
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time", "test-util"] }
tokio-util.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { workspace = true, features = ["timeout", "util"] }
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
xxhash-rust.workspace = true
toml.workspace = true

[dev-dependencies]
base64.workspace = true
cc-lb-storage-postgres = { path = "../cc-lb-storage-postgres" }
metrics-exporter-prometheus.workspace = true
fake-anthropic = { path = "../../tests/fixtures/fake-anthropic", features = ["debug-endpoints"] }
jemalloc_ctl = { package = "tikv-jemalloc-ctl", version = "0.7", features = ["stats"] }
sqlx.workspace = true
tikv-jemallocator = "0.7"
tracing-subscriber.workspace = true
wat.workspace = true
