[package]
name = "cc-lb-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
autotests = false

[features]
default = ["sqlite", "embed-spa", "cc-lb-admin?/default"]
admin = ["dep:cc-lb-admin"]
embed-spa = ["admin", "cc-lb-admin?/embed-spa"]
storage-sqlite = [
    "cc-lb-runtime-sync/default",
    "cc-lb-runtime-sync/sqlite",
    "cc-lb-scheduler/default",
    "cc-lb-scheduler/sqlite",
    "dep:cc-lb-scheduler",
]
storage-postgres = [
    "cc-lb-runtime-sync/postgres",
    "cc-lb-scheduler/postgres",
    "cc-lb-event-pipeline/postgres",
    "dep:cc-lb-scheduler",
]
sqlite = ["storage-sqlite", "admin", "cc-lb-admin?/sqlite"]
postgres = ["storage-postgres", "admin", "cc-lb-admin?/postgres"]

[[bin]]
name = "cc-lb"
path = "src/main.rs"
test = false
required-features = ["admin"]

[[test]]
name = "integration"
path = "tests/all.rs"
required-features = ["admin"]

[dependencies]
anyhow.workspace = true
async-stream.workspace = true
async-trait.workspace = true
arc-swap.workspace = true
axum = { workspace = true, features = ["multipart", "ws"] }
backon = { workspace = true }
bytes.workspace = true
chrono.workspace = true
cc-lb-aead = { path = "../cc-lb-aead" }
cc-lb-admin = { path = "../cc-lb-admin", default-features = false, optional = true }
cc-lb-config = { path = "../cc-lb-config" }
cc-lb-clock = { path = "../cc-lb-clock" }
cc-lb-request-log.workspace = true
cc-lb-control = { path = "../cc-lb-control" }
cc-lb-domain.workspace = true
cc-lb-engine = { path = "../cc-lb-engine" }
cc-lb-event-pipeline.workspace = true
cc-lb-lifecycle.workspace = true
cc-lb-observability = { path = "../cc-lb-observability" }
cc-lb-oauth-protocol = { path = "../cc-lb-oauth-protocol" }
cc-lb-plugin-wire = { workspace = true, features = ["std"] }
cc-lb-routing.workspace = true
cc-lb-routing-eval.workspace = true
cc-lb-runtime-sync = { workspace = true, default-features = false }
cc-lb-quota.workspace = true
cc-lb-pricing = { path = "../cc-lb-pricing" }
cc-lb-providers.workspace = true
cc-lb-runtime-wasmtime = { workspace = true }
cc-lb-scheduler = { path = "../cc-lb-scheduler", optional = true, default-features = false }
cc-lb-signer-anthropic-key = { path = "../cc-lb-signer-anthropic-key" }
cc-lb-signer-anthropic-oauth = { path = "../cc-lb-signer-anthropic-oauth" }
cc-lb-signer-vertex = { path = "../cc-lb-signer-vertex" }
cc-lb-storage-api = { path = "../cc-lb-storage-api" }
cc-lb-upstream.workspace = true
cc-lb-vertex-auth.workspace = true
clap = { workspace = true, features = ["derive"] }
futures-util = "0.3"
http.workspace = true
http-body-util.workspace = true
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "tokio"] }
metrics.workspace = true
parking_lot = "0.13"
rand = { workspace = true, features = ["std", "std_rng"] }
rkyv = { workspace = true, features = ["std", "bytecheck"] }
reqwest.workspace = true
rustls = { workspace = true, default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sonic-rs.workspace = true
zstd.workspace = true
sha2.workspace = true
siphasher = "1"
thiserror.workspace = true
tikv-jemallocator = "0.7"
tokio = { workspace = true, features = ["fs", "io-util", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite.workspace = true
tower = { workspace = true, features = ["timeout", "util"] }
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
xxhash-rust.workspace = true
zeroize = { workspace = true }

[dev-dependencies]
cc-lb-workspace-hack.workspace = true
apalis-postgres = "1.0.0"
apalis-sqlite = "1.0.0"
base64.workspace = true
cc-lb-storage-postgres = { path = "../cc-lb-storage-postgres" }
cc-lb-storage-sqlite = { path = "../cc-lb-storage-sqlite" }
metrics-exporter-prometheus.workspace = true
fake-anthropic = { path = "../../tests/fixtures/fake-anthropic", features = ["debug-endpoints"] }
flate2.workspace = true
hex.workspace = true
nix = { version = "0.31.3", features = ["resource"] }
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
reqwest = { workspace = true, features = ["multipart"] }
sqlx = { workspace = true, features = ["sqlite", "postgres"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
wat.workspace = true
