[package]
name = "cc-lb-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[features]
default = ["redb"]
redb = [
    "cc-lb-admin/redb",
    "cc-lb-core/redb",
    "cc-lb-signer-anthropic-key/redb",
    "cc-lb-signer-anthropic-oauth/redb",
]
postgres = [
    "cc-lb-admin/postgres",
    "cc-lb-core/postgres",
    "cc-lb-signer-anthropic-key/postgres",
    "cc-lb-signer-anthropic-oauth/postgres",
    "dep:cc-lb-storage-postgres",
    "dep:sqlx",
]
wasmtime = []

[[bin]]
name = "cc-lb"
path = "src/main.rs"

[dependencies]
async-stream.workspace = true
async-trait.workspace = true
arc-swap.workspace = true
axum.workspace = true
bytes.workspace = true
cc-lb-aead = { path = "../cc-lb-aead" }
cc-lb-admin = { version = "0.1.0", path = "../cc-lb-admin" }
cc-lb-config = { path = "../cc-lb-config" }
cc-lb-core = { path = "../cc-lb-core" }
cc-lb-dialect-anthropic = { path = "../cc-lb-dialect-anthropic" }
cc-lb-dialect-bedrock = { path = "../cc-lb-dialect-bedrock" }
cc-lb-dialect-vertex = { path = "../cc-lb-dialect-vertex" }
cc-lb-observability = { path = "../cc-lb-observability" }
cc-lb-plugin-api = { path = "../cc-lb-plugin-api" }
cc-lb-runtime-extism = { path = "../cc-lb-runtime-extism" }
cc-lb-signer-anthropic-key = { path = "../cc-lb-signer-anthropic-key" }
cc-lb-signer-anthropic-oauth = { path = "../cc-lb-signer-anthropic-oauth" }
cc-lb-signer-aws = { path = "../cc-lb-signer-aws" }
cc-lb-signer-gcp = { path = "../cc-lb-signer-gcp" }
cc-lb-storage-api = { path = "../cc-lb-storage-api" }
cc-lb-storage-redb = { path = "../cc-lb-storage-redb" }
cc-lb-storage-postgres = { path = "../cc-lb-storage-postgres", optional = true }
clap = { workspace = true, features = ["derive"] }
http.workspace = true
http-body-util.workspace = true
metrics.workspace = true
notify.workspace = true
oauth2.workspace = true
nix = { version = "0.31.3", features = ["resource"] }
rand = { version = "0.8.6", features = ["std", "std_rng"] }
rustls = { workspace = true, default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx = { workspace = true, optional = true }
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { workspace = true, features = ["timeout", "util"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
metrics-exporter-prometheus.workspace = true
fake-anthropic = { path = "../../tests/fixtures/fake-anthropic" }
tracing-subscriber.workspace = true
