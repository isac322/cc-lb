[package]
name = "cc-lb-storage-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
dto-roundtrip = []

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
cc-lb-aead = { version = "0.1.0", path = "../cc-lb-aead" }
cc-lb-plugin-api = { version = "0.3.0", path = "../cc-lb-plugin-api" }
cc-lb-plugin-wire = { path = "../cc-lb-plugin-wire", features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true }

[dev-dependencies]
cc-lb-core = { path = "../cc-lb-core" }
cc-lb-storage-sqlite = { path = "../cc-lb-storage-sqlite" }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
