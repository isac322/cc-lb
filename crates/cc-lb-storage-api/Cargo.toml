[package]
name = "cc-lb-storage-api"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[test]]
name = "integration"
path = "tests/all.rs"

[features]
dto-roundtrip = []

[dependencies]
async-trait = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
cc-lb-aead = { path = "../cc-lb-aead" }
cc-lb-clock = { path = "../cc-lb-clock" }
cc-lb-request-log.workspace = true
cc-lb-domain.workspace = true
cc-lb-plugin-wire = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tokio-util = { workspace = true }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true }
tracing.workspace = true

[dev-dependencies]
cc-lb-engine = { path = "../cc-lb-engine" }
cc-lb-storage-sqlite = { path = "../cc-lb-storage-sqlite" }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
