[package]
name = "cc-lb-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
autotests = false

[[test]]
name = "integration"
path = "tests/all.rs"

[features]
sqlite = []
postgres = []

[dependencies]
cc-lb-clock = { path = "../cc-lb-clock" }
cc-lb-config = { path = "../cc-lb-config" }
cc-lb-control = { path = "../cc-lb-control" }
cc-lb-domain.workspace = true
cc-lb-quota.workspace = true
cc-lb-request-log.workspace = true
cc-lb-routing.workspace = true
cc-lb-upstream.workspace = true
globset.workspace = true
serde = { workspace = true, features = ["derive"] }

[target.'cfg(not(loom))'.dependencies]
arc-swap.workspace = true
async-stream.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
bincode.workspace = true
cc-lb-aead = { path = "../cc-lb-aead" }
cc-lb-lifecycle = { workspace = true }
cc-lb-pricing = { path = "../cc-lb-pricing" }
cc-lb-storage-api = { path = "../cc-lb-storage-api" }
cc-lb-observability = { path = "../cc-lb-observability" }
brotli.workspace = true
dashmap.workspace = true
eventsource-stream.workspace = true
flate2.workspace = true
futures-core = "0.3"
hickory-resolver = { workspace = true, features = ["tokio", "system-config"] }
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "tokio"] }
chrono.workspace = true
metrics.workspace = true
parking_lot = "0.12"
rand = "0.10"
reqwest.workspace = true
secrecy.workspace = true
serde_json.workspace = true
sonic-rs.workspace = true
sha2 = "0.11"
blake3.workspace = true
sqlx.workspace = true
subtle = "2.6.1"
thiserror.workspace = true
tiktoken-rs = "0.12"
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
ulid = "3"
url.workspace = true
uuid.workspace = true
tower-service.workspace = true
tower.workspace = true
zstd.workspace = true

[dev-dependencies]
cc-lb-storage-sqlite = { path = "../cc-lb-storage-sqlite" }
insta.workspace = true
metrics-exporter-prometheus.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }

[target.'cfg(loom)'.dependencies]
arc-swap.workspace = true
bytes.workspace = true
http.workspace = true
loom = "0.7"
serde_json.workspace = true
url.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
