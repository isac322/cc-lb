[package]
name = "cc-lb-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
autotests = false

[[test]]
name = "integration"
path = "tests/all.rs"

[[test]]
name = "typestate_contracts"
path = "tests/typestate_contracts/main.rs"

[dependencies]
cc-lb-clock = { path = "../cc-lb-clock" }
cc-lb-config = { path = "../cc-lb-config" }
cc-lb-control = { path = "../cc-lb-control" }
cc-lb-domain.workspace = true
cc-lb-quota.workspace = true
cc-lb-request-log.workspace = true
cc-lb-routing.workspace = true
cc-lb-upstream.workspace = true
cc-lb-signer-vertex.workspace = true
serde = { workspace = true, features = ["derive"] }

[target.'cfg(not(loom))'.dependencies]
arc-swap.workspace = true
async-stream.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
cc-lb-aead = { path = "../cc-lb-aead" }
cc-lb-lifecycle = { workspace = true }
cc-lb-oauth-protocol = { path = "../cc-lb-oauth-protocol" }
cc-lb-pricing = { path = "../cc-lb-pricing" }
cc-lb-proxy-telemetry.workspace = true
cc-lb-routing-eval.workspace = true
cc-lb-storage-api = { path = "../cc-lb-storage-api" }
cc-lb-observability = { path = "../cc-lb-observability" }
brotli.workspace = true
dashmap.workspace = true
flate2.workspace = true
futures-core = "0.3"
h2.workspace = true
hickory-resolver = { workspace = true, features = ["tokio", "system-config"] }
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "tokio"] }
chrono.workspace = true
metrics.workspace = true
multer = "3.1"
rand = "0.10"
rustls.workspace = true
serde_json.workspace = true
sonic-rs.workspace = true
sha2 = "0.11"
blake3.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true
tower-service.workspace = true
tower.workspace = true
zstd.workspace = true

[dev-dependencies]
trybuild = "1"

[target.'cfg(not(trybuild))'.dev-dependencies]
cc-lb-workspace-hack.workspace = true
cc-lb-event-pipeline.workspace = true
cc-lb-routing-eval = { path = "../cc-lb-routing-eval", features = ["test-utils"] }
cc-lb-signer-anthropic-key = { path = "../cc-lb-signer-anthropic-key" }
cc-lb-storage-sqlite = { path = "../cc-lb-storage-sqlite" }
fake-anthropic = { path = "../../tests/fixtures/fake-anthropic", features = ["debug-endpoints"] }
insta.workspace = true
metrics-exporter-prometheus.workspace = true
metrics-util.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
parking_lot = "0.13"
proptest.workspace = true
sqlx.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
tower = { workspace = true, features = ["util"] }
syn = { version = "3.0.9", features = ["full", "visit"] }

[target.'cfg(loom)'.dependencies]
arc-swap.workspace = true
bytes.workspace = true
http.workspace = true
loom = "0.7"
serde_json.workspace = true
url.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(trybuild)'] }
