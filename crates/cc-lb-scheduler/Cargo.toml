[package]
name = "cc-lb-scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["sqlite"]
sqlite = [
    "sqlx/sqlite",
    "apalis-sqlite",
    "cc-lb-server/sqlite",
    "cc-lb-signer-anthropic-oauth/sqlite",
]
postgres = [
    "sqlx/postgres",
    "apalis-postgres",
    "cc-lb-server/postgres",
    "cc-lb-signer-anthropic-oauth/postgres",
]

[dependencies]
anyhow = { workspace = true }
apalis = { version = "=1.0.0-rc.9", features = ["catch-panic", "limit", "prometheus", "timeout"], default-features = false }
apalis-codec = { version = "=0.1.0-rc.9", default-features = false, features = ["json"] }
apalis-core = "=1.0.0-rc.9"
apalis-cron = "=1.0.0-rc.8"
apalis-postgres = { version = "=1.0.0-rc.8", optional = true }
apalis-sqlite = { version = "=1.0.0-rc.8", optional = true }
cc-lb-aead = { path = "../cc-lb-aead" }
cc-lb-config = { path = "../cc-lb-config" }
cc-lb-core = { path = "../cc-lb-core" }
cc-lb-pricing = { path = "../cc-lb-pricing" }
cc-lb-storage-api = { path = "../cc-lb-storage-api" }
chrono = { workspace = true }
hex = { workspace = true }
futures-util = "0.3"
metrics = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "json", "runtime-tokio", "tls-rustls-ring", "uuid"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
tower = { workspace = true, features = ["util"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
ulid = "1"
uuid = { workspace = true }

[[test]]
name = "spike_uniqueness_postgres"
required-features = ["postgres"]

[[test]]
name = "spike_cron_leader"
required-features = ["postgres"]

[dev-dependencies]
async-trait = { workspace = true }
axum.workspace = true
base64.workspace = true
cc-lb-oauth-protocol = { path = "../cc-lb-oauth-protocol" }
cc-lb-server = { path = "../cc-lb-server", default-features = false }
cc-lb-signer-anthropic-oauth = { path = "../cc-lb-signer-anthropic-oauth" }
cc-lb-storage-postgres = { path = "../cc-lb-storage-postgres" }
cc-lb-storage-sqlite = { path = "../cc-lb-storage-sqlite" }
cron = "0.17"
fake-anthropic = { path = "../../tests/fixtures/fake-anthropic", features = ["debug-endpoints"] }
http.workspace = true
metrics-exporter-prometheus.workspace = true
proptest = { workspace = true }
storage-sqlx = { package = "sqlx", version = "0.9.0", default-features = false, features = ["chrono", "json", "migrate", "postgres", "runtime-tokio", "sqlite", "tls-rustls-ring", "uuid"] }
tempfile.workspace = true
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tracing-subscriber = { workspace = true }
url.workspace = true
