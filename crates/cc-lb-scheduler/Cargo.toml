[package]
name = "cc-lb-scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
autotests = false

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite", "apalis-sqlite", "cc-lb-server/sqlite"]
postgres = ["sqlx/postgres", "apalis-postgres", "cc-lb-server/postgres"]

[dependencies]
anyhow = { workspace = true }
apalis = { version = "1.0.0", features = ["catch-panic", "limit", "prometheus", "timeout"], default-features = false }
apalis-codec = { version = "1.0.0", default-features = false, features = ["json"] }
apalis-core = { version = "1.0.0", features = ["sleep"] }
apalis-cron = "1.0.0"
apalis-postgres = { version = "1.0.0", optional = true }
apalis-sqlite = { version = "1.0.0", optional = true }
cc-lb-aead = { path = "../cc-lb-aead" }
cc-lb-config = { path = "../cc-lb-config" }
cc-lb-clock = { path = "../cc-lb-clock" }
cc-lb-control = { path = "../cc-lb-control" }
cc-lb-oauth-protocol = { path = "../cc-lb-oauth-protocol" }
cc-lb-pricing = { path = "../cc-lb-pricing" }
cc-lb-storage-api = { path = "../cc-lb-storage-api" }
chrono = { workspace = true }
hex = { workspace = true }
futures-util = "0.3"
metrics = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
tower = { workspace = true, features = ["util"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
ulid = "3"
uuid = { workspace = true }

[[test]]
name = "integration"
path = "tests/all.rs"

[dev-dependencies]
async-trait = { workspace = true }
axum.workspace = true
base64.workspace = true
cc-lb-server = { path = "../cc-lb-server", default-features = false }
cc-lb-signer-anthropic-oauth = { path = "../cc-lb-signer-anthropic-oauth" }
cc-lb-storage-postgres = { path = "../cc-lb-storage-postgres" }
cc-lb-storage-sqlite = { path = "../cc-lb-storage-sqlite" }
cron = "0.17"
fake-anthropic = { path = "../../tests/fixtures/fake-anthropic", features = ["debug-endpoints"] }
http.workspace = true
metrics-exporter-prometheus.workspace = true
proptest = { workspace = true }
tempfile.workspace = true
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
tracing-subscriber = { workspace = true }
url.workspace = true
