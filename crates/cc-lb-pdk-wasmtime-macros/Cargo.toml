[package]
name = "cc-lb-pdk-wasmtime-macros"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Procedural macros for cc-lb wasmtime-based plugins."
repository = "https://github.com/isac322/cc-lb"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
blake3 = { workspace = true, features = ["pure"] }
cc-lb-plugin-types.workspace = true
