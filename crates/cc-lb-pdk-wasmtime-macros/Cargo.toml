[package]
name = "cc-lb-pdk-wasmtime-macros"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Procedural macros (#[cc_lb_plugin], #[handler]) for cc-lb wasmtime plugins."
repository = "https://github.com/isac322/cc-lb"
homepage = "https://cc-lb.bhyoo.com/"
documentation = "https://cc-lb.bhyoo.com/docs/plugins/"
readme = "README.md"
keywords = ["cc-lb", "plugin", "wasm", "macros", "schema"]
categories = ["wasm", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
