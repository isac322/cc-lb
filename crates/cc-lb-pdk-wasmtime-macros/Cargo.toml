[package]
name = "cc-lb-pdk-wasmtime-macros"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Procedural macros (#[cc_lb_plugin], #[handler], #[derive(WireSchema)]) for cc-lb wasmtime plugins."
repository = "https://github.com/isac322/cc-lb"
readme = "README.md"
keywords = ["cc-lb", "plugin", "wasm", "macros", "schema"]
categories = ["wasm", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
blake3 = { workspace = true, features = ["pure"] }
