[package]
name = "cc-lb-pdk-wasmtime"
version = "0.1.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Plugin Development Kit runtime helpers for cc-lb wasmtime-based plugins (alloc/free, dlmalloc)."
repository = "https://github.com/isac322/cc-lb"
homepage = "https://cc-lb.bhyoo.com/"
documentation = "https://cc-lb.bhyoo.com/docs/plugins/"
readme = "README.md"
keywords = ["cc-lb", "plugin", "wasm", "pdk", "wasmtime"]
categories = ["wasm", "api-bindings", "development-tools"]
autotests = false

[[test]]
name = "integration"
path = "tests/all.rs"

[lib]
crate-type = ["rlib"]

[dependencies]
cc-lb-pdk-wasmtime-macros.workspace = true
cc-lb-plugin-wire.workspace = true
rkyv = { workspace = true, default-features = false, features = ["alloc", "bytecheck"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = { version = "0.2", features = ["global"] }
