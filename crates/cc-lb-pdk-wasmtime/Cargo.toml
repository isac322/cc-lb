[package]
name = "cc-lb-pdk-wasmtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Plugin Development Kit for cc-lb wasmtime-based plugins."
repository = "https://github.com/isac322/cc-lb"

[lib]
crate-type = ["rlib"]

[dependencies]
cc-lb-pdk-wasmtime-macros.workspace = true
cc-lb-plugin-types.workspace = true
rkyv = { workspace = true, default-features = false, features = ["alloc", "bytecheck"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = { version = "0.2", features = ["global"] }
