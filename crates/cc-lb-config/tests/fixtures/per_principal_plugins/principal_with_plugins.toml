allowed_models = ["claude-3-5-sonnet*"]

[router_plugin]
name = "alice-router"
wasm_path = "/opt/cc-lb/plugins/alice-router.wasm"
sse_per_event = false

[router_plugin.config]
upstream = "alice-upstream"

[[observability_hooks]]
name = "alice-hook-events"
wasm_path = "/opt/cc-lb/plugins/alice-hook-events.wasm"
sse_per_event = false

[observability_hooks.config]
sink = "stdout"

[[observability_hooks]]
name = "alice-hook-metrics"
wasm_path = "/opt/cc-lb/plugins/alice-hook-metrics.wasm"
sse_per_event = true
batched_events_per_flush = 16
batched_flush_ms = 50

[observability_hooks.config]
prefix = "alice"
