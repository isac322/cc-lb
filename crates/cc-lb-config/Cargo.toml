[package]
name = "cc-lb-config"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[test]]
name = "integration"
path = "tests/all.rs"

[[bin]]
name = "show"
path = "src/bin/show.rs"

[[bin]]
name = "validate"
path = "src/bin/validate.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
figment = { workspace = true, features = ["env", "toml"] }
humantime = "2"
humantime_serde_dep = { package = "humantime-serde", version = "1" }
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
url = { workspace = true, features = ["serde"] }

[target.'cfg(not(loom))'.dependencies]
notify.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync", "time"] }

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
