[package]
name = "cc-lb-control"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
autotests = false

[[test]]
name = "integration"
path = "tests/all.rs"

[dependencies]
arc-swap.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
cc-lb-aead = { path = "../cc-lb-aead" }
cc-lb-clock = { path = "../cc-lb-clock" }
cc-lb-lifecycle = { workspace = true }
cc-lb-request-log.workspace = true
cc-lb-domain.workspace = true
cc-lb-routing.workspace = true
cc-lb-upstream.workspace = true
cc-lb-storage-api = { path = "../cc-lb-storage-api" }
chrono.workspace = true
dashmap.workspace = true
globset.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "tokio"] }
metrics.workspace = true
parking_lot = "0.13"
rand = "0.10"
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11"
subtle = "2.6.1"
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
ulid = "3"
url.workspace = true
uuid.workspace = true
zeroize = { workspace = true }

[dev-dependencies]
axum.workspace = true
bincode.workspace = true
cc-lb-storage-sqlite = { path = "../cc-lb-storage-sqlite" }
fake-anthropic = { path = "../../tests/fixtures/fake-anthropic", features = ["debug-endpoints"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
