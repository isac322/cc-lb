[package]
name = "cc-lb-control"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
autotests = false

[[test]]
name = "integration"
path = "tests/all.rs"

[dependencies]
arc-swap.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
cc-lb-clock = { path = "../cc-lb-clock" }
cc-lb-config = { path = "../cc-lb-config" }
cc-lb-lifecycle = { workspace = true }
cc-lb-request-log.workspace = true
cc-lb-domain.workspace = true
cc-lb-observability = { path = "../cc-lb-observability" }
cc-lb-routing.workspace = true
cc-lb-upstream.workspace = true
cc-lb-storage-api = { path = "../cc-lb-storage-api" }
chrono.workspace = true
dashmap.workspace = true
globset.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "tokio"] }
metrics.workspace = true
parking_lot = "0.12"
rand = "0.10"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11"
subtle = "2.6.1"
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
ulid = "3"
uuid.workspace = true

[dev-dependencies]
bincode.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
