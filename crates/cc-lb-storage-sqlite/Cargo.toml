[package]
name = "cc-lb-storage-sqlite"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[test]]
name = "integration"
path = "tests/all.rs"

[dependencies]
cc-lb-aead = { path = "../cc-lb-aead" }
cc-lb-clock = { path = "../cc-lb-clock" }
cc-lb-domain.workspace = true
cc-lb-plugin-wire = { path = "../cc-lb-plugin-wire", features = ["std"] }
cc-lb-storage-api = { path = "../cc-lb-storage-api" }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
metrics = { workspace = true }
sqlx = { workspace = true, features = ["chrono", "json", "macros", "migrate", "runtime-tokio", "sqlite", "tls-rustls-ring", "uuid"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
