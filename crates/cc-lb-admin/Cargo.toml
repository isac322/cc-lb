[package]
name = "cc-lb-admin"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[features]
default = ["sqlite"]
sqlite = ["cc-lb-scheduler/sqlite"]
postgres = ["cc-lb-scheduler/postgres"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
async-stream.workspace = true
arc-swap.workspace = true
axum = { workspace = true, features = ["multipart"] }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
serde_yaml = "0.9"
tokio.workspace = true
tokio-util.workspace = true
rust-embed.workspace = true
cc-lb-storage-api = { path = "../cc-lb-storage-api" }
cc-lb-aead = { path = "../cc-lb-aead" }
cc-lb-clock = { path = "../cc-lb-clock" }
cc-lb-contract = { workspace = true }
cc-lb-control = { path = "../cc-lb-control" }
cc-lb-domain.workspace = true
cc-lb-engine = { path = "../cc-lb-engine" }
cc-lb-config = { path = "../cc-lb-config" }
cc-lb-oauth-protocol = { path = "../cc-lb-oauth-protocol" }
cc-lb-scheduler = { path = "../cc-lb-scheduler", default-features = false }
cc-lb-plugin-api = { path = "../cc-lb-plugin-api" }
cc-lb-plugin-wire = { path = "../cc-lb-plugin-wire", features = ["std"] }
cc-lb-runtime-wasmtime = { workspace = true }
cc-lb-signer-anthropic-oauth = { path = "../cc-lb-signer-anthropic-oauth" }
tracing.workspace = true
http.workspace = true
http-body-util.workspace = true
hex.workspace = true
humantime = "2.3"
metrics.workspace = true
bytes.workspace = true
base64.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client", "client-legacy", "http1", "tokio"] }
oauth2.workspace = true
secrecy.workspace = true
sha2.workspace = true
siphasher = "1"
tower.workspace = true
thiserror.workspace = true
ring.workspace = true
toml.workspace = true
url.workspace = true
uuid.workspace = true
mime_guess = "2.0.5"
nix = { version = "0.31.3", features = ["signal"] }

[dev-dependencies]
tower.workspace = true
http-body-util.workspace = true
wat = "1"
blake3 = { workspace = true, features = ["std"] }
rkyv = { workspace = true, features = ["std", "bytecheck"] }
humantime = "2.3"
insta.workspace = true
tempfile.workspace = true
mock-anthropic-oauth-server = { path = "../../tests/fixtures/mock-anthropic-oauth-server" }
fake-anthropic = { path = "../../tests/fixtures/fake-anthropic" }
cc-lb-storage-sqlite = { path = "../cc-lb-storage-sqlite" }
apalis-postgres = "^1.0.0-rc.8"
apalis-sqlite = "^1.0.0-rc.8"
metrics-exporter-prometheus.workspace = true
scheduler-sqlx = { package = "sqlx", version = "=0.8.6", default-features = false, features = ["chrono", "json", "migrate", "postgres", "runtime-tokio", "sqlite", "tls-rustls-ring", "uuid"] }
