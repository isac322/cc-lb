<!DOCTYPE html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>cc-lb</title>
    <meta name="color-scheme" content="dark light" />
    <!-- First-frame ground (blue-slate night / cool slate day) before the CSS
         bundle loads; mirrors --color-bg in src/index.css. -->
    <style>
      html { background: #11181e; }
      html[data-theme="light"] { background: #dee6ec; }
      @media (prefers-color-scheme: light) {
        html[data-theme="system"] { background: #dee6ec; }
      }
    </style>
    <!-- Pre-paint theme: mirrors readStoredTheme() in src/lib/theme.ts so the
         first frame already uses the stored theme instead of flashing dark. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('cclb.theme');
          if (t === 'dark' || t === 'light' || t === 'system') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
