[package]
name = "cc-lb-pricing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
arc-swap.workspace = true
bytes.workspace = true
cc-lb-storage-api = { path = "../cc-lb-storage-api" }
futures-lite = "2.6.1"
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "tokio"] }
metrics.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "fs"] }
tracing.workspace = true

[dev-dependencies]
cc-lb-storage-redb = { path = "../cc-lb-storage-redb" }
tempfile.workspace = true
wiremock = "0.6"
