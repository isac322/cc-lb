[package]
name = "cc-lb-runtime-wasmtime"
version = "0.1.5"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autotests = false
description = "Wasmtime-based plugin runtime for cc-lb. Host-side wasm plugin admission + dispatch."
repository = "https://github.com/isac322/cc-lb"
readme = "README.md"
keywords = ["cc-lb", "plugin", "wasm", "wasmtime", "runtime"]
categories = ["wasm", "web-programming"]

[[test]]
name = "integration"
path = "tests/all.rs"

[dependencies]
cc-lb-plugin-wire = { workspace = true, features = ["std"] }
wasmtime.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
arc-swap.workspace = true
parking_lot = "0.12"
rkyv = { workspace = true, features = ["std", "bytecheck"] }
blake3 = { workspace = true, features = ["std"] }
wasmparser.workspace = true
serde_json.workspace = true
serde.workspace = true
uuid = { version = "1", features = ["v4"] }
http.workspace = true
bytes.workspace = true
url.workspace = true
metrics.workspace = true

[dev-dependencies]
wat = "1"
metrics-exporter-prometheus.workspace = true
