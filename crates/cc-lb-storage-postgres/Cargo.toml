[package]
name = "cc-lb-storage-postgres"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[features]
postgres = []

[dependencies]
cc-lb-storage-api = { path = "../cc-lb-storage-api" }
cc-lb-aead = { path = "../cc-lb-aead" }
cc-lb-pricing = { path = "../cc-lb-pricing" }
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring", "uuid"] } # macros: required for sqlx::migrate!(). sqlx 0.9 split combined runtime+TLS features into separate runtime-tokio + tls-rustls-ring. macros no longer unconditionally pulls sqlx-mysql in 0.9 (uses optional ? dep refs).
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
