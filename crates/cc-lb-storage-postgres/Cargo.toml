[package]
name = "cc-lb-storage-postgres"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[[test]]
name = "integration"
path = "tests/all.rs"

[dependencies]
cc-lb-clock = { path = "../cc-lb-clock" }
cc-lb-domain.workspace = true
cc-lb-oauth-protocol = { path = "../cc-lb-oauth-protocol" }
cc-lb-storage-api = { path = "../cc-lb-storage-api" }
cc-lb-plugin-wire = { path = "../cc-lb-plugin-wire", features = ["std"] }
cc-lb-aead = { path = "../cc-lb-aead" }
async-trait = { workspace = true }
chrono = { workspace = true }
metrics = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring", "uuid"] } # macros: required for sqlx::migrate!(). sqlx 0.9 split combined runtime+TLS features into separate runtime-tokio + tls-rustls-ring. macros no longer unconditionally pulls sqlx-mysql in 0.9 (uses optional ? dep refs).
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
