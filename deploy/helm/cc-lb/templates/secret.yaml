{{- if not .Values.secrets.existingSecret }}
{{- if not .Values.secrets.masterKey }}
{{- fail "cc-lb: a master key is required. Set secrets.masterKey (openssl rand -hex 32) or point secrets.existingSecret at a Secret that provides it." }}
{{- end }}
{{- if and (ne .Values.config.storage.kind "sqlite") (not .Values.secrets.clusterToken) }}
{{- fail "cc-lb: the postgres backend always runs pg_notify fanout and needs a shared cluster token. Set secrets.clusterToken (openssl rand -hex 32) or point secrets.existingSecret at a Secret that provides it." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cc-lb.fullname" . }}
  labels:
    {{- include "cc-lb.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.masterKey }}: {{ .Values.secrets.masterKey | quote }}
  {{- with .Values.secrets.adminToken }}
  {{ $.Values.secrets.keys.adminToken }}: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.bootstrapAdminToken }}
  {{ $.Values.secrets.keys.bootstrapAdminToken }}: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.clusterToken }}
  {{ $.Values.secrets.keys.clusterToken }}: {{ . | quote }}
  {{- end }}
{{- end }}
