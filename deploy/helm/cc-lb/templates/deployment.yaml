{{- $isSqlite := eq .Values.config.storage.kind "sqlite" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cc-lb.fullname" . }}
  labels:
    {{- include "cc-lb.labels" . | nindent 4 }}
spec:
  {{- if and .Values.autoscaling.enabled (not $isSqlite) }}
  {{- /* HPA owns the replica count. */}}
  {{- else if $isSqlite }}
  replicas: 1
  {{- else }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cc-lb.selectorLabels" . | nindent 6 }}
  strategy:
    {{- if .Values.updateStrategy }}
    {{- toYaml .Values.updateStrategy | nindent 4 }}
    {{- else if and $isSqlite .Values.persistence.enabled }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "cc-lb.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "cc-lb.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: cc-lb
          image: {{ include "cc-lb.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --config
            - /etc/cc-lb/cc-lb.toml
          ports:
            - name: proxy
              containerPort: {{ .Values.ports.proxy }}
              protocol: TCP
            - name: admin
              containerPort: {{ .Values.ports.admin }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.ports.metrics }}
              protocol: TCP
          env:
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            - name: {{ .Values.config.aead.keyEnv }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "cc-lb.secretName" . }}
                  key: {{ .Values.secrets.keys.masterKey }}
            - name: {{ .Values.config.admin.tokenEnv }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "cc-lb.secretName" . }}
                  key: {{ .Values.secrets.keys.adminToken }}
                  optional: true
            - name: CC_LB_BOOTSTRAP_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cc-lb.secretName" . }}
                  key: {{ .Values.secrets.keys.bootstrapAdminToken }}
                  optional: true
            {{- if and (not $isSqlite) .Values.config.storage.postgres.urlSecret.name }}
            - name: CC_LB_STORAGE__URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.storage.postgres.urlSecret.name }}
                  key: {{ .Values.config.storage.postgres.urlSecret.key }}
            {{- end }}
            {{- if not $isSqlite }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CC_LB_CLUSTER__INSTANCE_URL
              value: "http://$(POD_IP):{{ .Values.ports.admin }}"
            - name: CC_LB_CLUSTER__TOKEN_ENV
              value: {{ .Values.config.cluster.tokenEnv | quote }}
            - name: {{ .Values.config.cluster.tokenEnv }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "cc-lb.secretName" . }}
                  key: {{ .Values.secrets.keys.clusterToken }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: {{ .Values.probes.startup.port }}
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/cc-lb
              readOnly: true
            - name: data
              mountPath: /var/lib/cc-lb
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "cc-lb.fullname" . }}
        - name: tmp
          emptyDir: {}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "cc-lb.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
