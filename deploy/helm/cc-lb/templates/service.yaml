apiVersion: v1
kind: Service
metadata:
  name: {{ include "cc-lb.fullname" . }}
  labels:
    {{- include "cc-lb.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "cc-lb.selectorLabels" . | nindent 4 }}
  ports:
    - name: proxy
      port: {{ .Values.ports.proxy }}
      targetPort: proxy
      protocol: TCP
    - name: admin
      port: {{ .Values.ports.admin }}
      targetPort: admin
      protocol: TCP
    - name: metrics
      port: {{ .Values.ports.metrics }}
      targetPort: metrics
      protocol: TCP
