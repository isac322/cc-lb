services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cc_lb
      POSTGRES_PASSWORD: cc_lb
      POSTGRES_DB: cc_lb
    ports:
      - "${CC_LB_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cc_lb -d cc_lb"]
      interval: 2s
      timeout: 5s
      retries: 30

  proxy-a:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: proxy
      args:
        FEATURES: postgres
    command:
      - serve
      - --config
      - /etc/cc-lb/cc-lb.toml
      - --role
      - proxy-worker
    environment:
      CC_LB_MASTER_KEY: "${CC_LB_MASTER_KEY:?CC_LB_MASTER_KEY must be set}"
    ports:
      - "8080:8080"
      - "9091:9091"
    volumes:
      - ./cc-lb.split.toml:/etc/cc-lb/cc-lb.toml:ro
      - proxy_a_data:/var/lib/cc-lb
    depends_on:
      postgres:
        condition: service_healthy

  proxy-b:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: proxy
      args:
        FEATURES: postgres
    command:
      - serve
      - --config
      - /etc/cc-lb/cc-lb.toml
      - --role
      - proxy
    environment:
      CC_LB_MASTER_KEY: "${CC_LB_MASTER_KEY:?CC_LB_MASTER_KEY must be set}"
    ports:
      - "8081:8080"
      - "9092:9091"
    volumes:
      - ./cc-lb.split.toml:/etc/cc-lb/cc-lb.toml:ro
      - proxy_b_data:/var/lib/cc-lb
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: admin
      args:
        FEATURES: postgres
    command:
      - serve
      - --config
      - /etc/cc-lb/cc-lb.toml
    environment:
      CC_LB_MASTER_KEY: "${CC_LB_MASTER_KEY:?CC_LB_MASTER_KEY must be set}"
      CC_LB_ADMIN_TOKEN: "${CC_LB_ADMIN_TOKEN:?CC_LB_ADMIN_TOKEN must be set}"
    ports:
      - "9090:9090"
      - "9093:9091"
    volumes:
      - ./cc-lb.split.toml:/etc/cc-lb/cc-lb.toml:ro
      - admin_data:/var/lib/cc-lb
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  proxy_a_data:
  proxy_b_data:
  admin_data:
