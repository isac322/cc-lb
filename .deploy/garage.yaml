# garage: lightweight S3-compatible store — dedicated sccache backend (oracle4, arc-systems ns).
# falcondev cache-server can't back sccache (protobuf twirp, issue #164), so the sccache
# compilation cache lives here (S3) while gha-cache-server keeps the dependency cache (actions/cache).
# rpc_secret/admin_token are injected from the garage-secrets secret via GARAGE_RPC_SECRET/GARAGE_ADMIN_TOKEN env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: arc-systems
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "lmdb"
    replication_factor = 1
    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.garage"

    [admin]
    api_bind_addr = "[::]:3903"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-data
  namespace: arc-systems
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
  namespace: arc-systems
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO PVC: ensure a single writer
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      containers:
        - name: garage
          image: dxflrs/garage:v1.0.1
          command: ["/garage"]
          args: ["server"]
          envFrom:
            - secretRef:
                name: garage-secrets
          ports:
            - {containerPort: 3900, name: s3-api}
            - {containerPort: 3901, name: rpc}
            - {containerPort: 3903, name: admin}
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
          volumeMounts:
            - {name: config, mountPath: /etc/garage.toml, subPath: garage.toml}
            - {name: data, mountPath: /var/lib/garage}
      volumes:
        - name: config
          configMap: {name: garage-config}
        - name: data
          persistentVolumeClaim: {claimName: garage-data}
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: arc-systems
spec:
  selector:
    app: garage
  ports:
    - {name: s3-api, port: 3900, targetPort: 3900}
    - {name: admin, port: 3903, targetPort: 3903}
