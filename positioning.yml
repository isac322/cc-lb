audience:
  primary: Self-hosting platform engineers and tech leads operating Anthropic-compatible traffic.
  secondary:
    - Rust engineers authoring Wasmtime filter and shape plugins
  jobs_to_be_done:
    - When multiple Anthropic accounts hit rolling limits, I want one managed endpoint with explicit upstream and principal control, so I can operate a shared team gateway.
    - When agent tool loops evict prompt-cache prefixes, I want best-effort keepalive scheduling, so active sessions can preserve cache continuity.
    - When pooled accounts drain unevenly, I want cost-first and weekly-pace-aware routing, so quota pressure is managed deterministically.
    - When runtime configuration changes, I want database-backed management and dynamic view rebinding, so I can update operations without rebuilding the binary.
    - When I need custom routing or payload shaping, I want a published Wasmtime PDK and conformance path, so I can extend filter and shape hooks without changing core proxy code.
  surface_priorities:
    landing: category and first executable path before architecture depth
    readme: install contract and supported scope within 60 seconds
    registry: published crate purpose, hook slots, and docs links
    docs: operator lifecycle first, plugin author path second
  visitor_model:
    - source: github-readme
      who: Self-hosting DevOps engineer or tech lead sharing Anthropic accounts across a team.
      questions_60s: ["What does cc-lb do?", "Does it fit my Anthropic-compatible setup?", "How do I run it?"]
      first_action: Run the Quick Start command after setting required secrets.
      landing_page: /docs/getting-started/
    - source: search-problem
