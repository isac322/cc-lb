anti_claims:
  - never_say: Official Anthropic, Claude, or Claude Code proxy, partner, or certified integration
    because: cc-lb is an independent project with no evidenced endorsement, partnership, or certification.
    evidence: assets/brand/README.md:3-6
  - never_say: Universal multi-provider LLM gateway
    because: the current upstream contract is Anthropic API-key and Anthropic OAuth only; removed Bedrock/Vertex/OpenAI claims are stale.
    evidence: crates/cc-lb-domain/src/upstream.rs:19-27; CHANGELOG.md:36
  - never_say: Zero-config, instant drop-in replacement
    because: startup requires secrets, admin authentication, database state, upstreams, principals, and proxy keys.
    evidence: README.md:12-29; docs/runtime-management.md:1-25
  - never_say: Guaranteed 100% prompt-cache hits or zero-overhead keepalive
    because: keepalive is best effort and bounded by scheduler/classifier behavior.
    evidence: crates/cc-lb-engine/src/cache_keepalive/mod.rs:1-30; docs/adr/0004-cache-keepalive-scheduler.md:72-95
  - never_say: Enterprise-grade HA, 99.999% SLA, or global multi-region clustering
    because: the owner-confirmed maturity evidence is bounded to internal use with 10 connected accounts.
    evidence: owner confirmation; docs/scheduler.md:1-30

