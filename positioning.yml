selling_points:
  - id: SP1
    headline: Pool Anthropic upstream accounts
    benefit: Route Anthropic Messages API traffic through managed API-key and OAuth upstreams.
    mechanism: The routing contract exposes Anthropic API-key and Anthropic OAuth upstream kinds and selects candidates for the proxy path.
    evidence: ["crates/cc-lb-domain/src/upstream.rs:19-27", "crates/cc-lb-routing/src/lib.rs:1-12"]
    proof_page: /docs/concepts/upstreams/
    status: shipped
  - id: SP2
    headline: Preserve active session cache continuity
    benefit: Reduce avoidable prompt-cache eviction during active agent sessions.
    mechanism: A background classifier and scheduler can issue best-effort keepalive requests before configured cache TTLs expire; this is not a cache-hit guarantee.
    evidence: ["crates/cc-lb-engine/src/cache_keepalive/mod.rs:1-30", "docs/adr/0004-cache-keepalive-scheduler.md:72-95"]
    proof_page: /docs/concepts/prompt-cache/
    status: shipped
  - id: SP3
    headline: Pace quota across rolling windows
    benefit: Balance pooled account pressure using cost-first selection and weekly pace constraints.
    mechanism: The subscription preference filter compares candidate cost/pressure and applies deterministic weekly pacing decisions; internal thresholds remain operational details.
    evidence: ["crates/cc-lb-engine/src/builtin_filters/subscription_preference.rs:1-40", "docs/adr/0010-cost-first-deterministic-subscription-selection.md", "docs/adr/0013-weekly-pace-gate-for-five-hour-pressure.md"]
    proof_page: /docs/concepts/quota-routing/
    status: shipped
  - id: SP4
    headline: Extend the proxy with Wasmtime hooks
    benefit: Add custom request filtering and request/response/SSE shaping without editing the core proxy.
    mechanism: Published PDK and runtime crates expose filter and shape slots over the versioned rkyv wire contract and run guests in Wasmtime 48.
    evidence: ["Cargo.toml:41-48", "crates/cc-lb-runtime-wasmtime/src/lib.rs:1-60"]
    proof_page: /docs/plugins/
    status: shipped
  - id: SP5
    headline: Manage runtime state from the database
    benefit: Update upstreams, principals, keys, and plugin chains through the admin surface without rebuilding the binary.
    mechanism: Operational entities are stored in the database and compiled into a dynamic view that can be rebound at runtime.
    evidence: ["docs/runtime-management.md:1-30", "crates/cc-lb-server/src/dynamic_view_builder.rs:1-60"]
    proof_page: /docs/operations/runtime-management/
    status: shipped

