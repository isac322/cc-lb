objections:
  - question: Why not use a direct Anthropic endpoint per account?
    answer: cc-lb centralizes upstream, principal, key, quota, cache-keepalive, and extension management for a self-hosted operator; it does not replace Anthropic's service.
    evidence: ["docs/runtime-management.md:1-30", "crates/cc-lb-engine/src/cache_keepalive/mod.rs:1-30", "crates/cc-lb-engine/src/builtin_filters/subscription_preference.rs:1-40"]
    source_threads: []
  - question: Does cc-lb support every major LLM provider?
    answer: No. The current supported upstream kinds are Anthropic API key and Anthropic OAuth; removed provider claims are not part of the public contract.
    evidence: ["crates/cc-lb-domain/src/upstream.rs:19-27", "CHANGELOG.md:36"]
