# Top-level keys must precede the first [table].

# Listener addresses for the proxy, admin stub, and Prometheus metrics listener.
[listener]
proxy_addr = "127.0.0.1:8080"
admin_addr = "127.0.0.1:9090"
metrics_addr = "127.0.0.1:9091"

# TLS is disabled in the smoke config; T29 wires certificate reload support.
# [listener.tls]
# cert_path = "./certs/server.crt"
# key_path = "./certs/server.key"
# reload_on_sighup = true

# Active request body caps.
[body]
messages_cap_bytes = 33554432
files_cap_bytes = 104857600

# End-to-end upstream and graceful-drain timeouts.
[timeouts]
upstream_total_secs = 600
drain_secs = 60

# SQLite stores principals, upstreams, and managed API keys.
[storage]
kind = "sqlite"
path = "./data/cc-lb.sqlite"
# Retain learned upstream affinity bindings for 7 days from their last successful binding.
[upstream_affinity]
ttl_days = 7

# Tracing and metrics. The server binds Prometheus to listener.metrics_addr at startup.
# Set otlp_endpoint to export traces to an OTLP gRPC collector such as the
# Tempo service in compose.yaml (`docker compose up -d tempo`).
[observability]
tracing_level = "info"
log_redaction = true
user_prompt_redaction = false
# otlp_endpoint = "http://127.0.0.1:4317"
# Write one cc_lb.request_diagnostics.v1 JSON line per persisted request event
# to stdout for a log shipper. Renewal rows whose lifecycle events were dropped
# or that were finalized after the assembler stopped get no line; their
# diagnostic fields are empty. Log redaction settings do not apply to these lines;
# producers redact these values before persistence.
# request_diagnostics_log = false

# Configure the admin provider registry explicitly. The token itself remains
# in the environment named by this static-token provider.
[[admin.auth.providers]]
kind = "static_token"
id = "local"
token_env = "CC_LB_ADMIN_TOKEN"

# Circuit breaker settings applied per upstream host.
[circuit_breaker]
failures_to_open = 5
window_secs = 10
half_open_after_secs = 30

# Bulkhead settings applied per upstream host.
[bulkhead]
max_conns_per_upstream = 50
semaphore_per_upstream = 100
