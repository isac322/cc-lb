services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cc_lb
      POSTGRES_PASSWORD: cc_lb
      POSTGRES_DB: cc_lb
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cc_lb -d cc_lb"]
      interval: 1s
      timeout: 5s
      retries: 30
