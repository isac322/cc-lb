[listener]
proxy_addr = "__PROXY_ADDR__"
admin_addr = "__ADMIN_ADDR__"
metrics_addr = "__METRICS_ADDR__"

[body]
messages_cap_bytes = 33554432
files_cap_bytes = 104857600

[timeouts]
request_header_secs = 10
request_body_chunk_secs = 30
idle_secs = 300
upstream_total_secs = 30
drain_secs = 5

[upstreams.real_client]
kind = "bedrock_runtime"
base_url = "__FAKE_URL__"
region = "__REGION__"
auth_strategy = "aws_sig_v4"
[principals.api-key]
allowed_models = ["*"]

[plugins]
observability_hooks = []

[storage]
oauth_aead_key_env = "CC_LB_MASTER_KEY"

[observability]
tracing_level = "info"
log_redaction = true
user_prompt_redaction = false

[quotas]
default_window_secs = 60
default_requests_per_window = 1000
default_input_tokens = 1000000
default_output_tokens = 1000000

[admin]
token_env = "CC_LB_ADMIN_TOKEN"

[circuit_breaker]
failures_to_open = 5
window_secs = 10
half_open_after_secs = 30

[bulkhead]
max_conns_per_upstream = 50
semaphore_per_upstream = 100

[dns]
cache_ttl_floor_secs = 30
cache_ttl_ceiling_secs = 300

[egress]
