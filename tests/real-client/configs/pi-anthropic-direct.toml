[listener]
proxy_addr = "__PROXY_ADDR__"
admin_addr = "__ADMIN_ADDR__"
metrics_addr = "__METRICS_ADDR__"

[body]
messages_cap_bytes = 33554432
files_cap_bytes = 104857600

[timeouts]
upstream_total_secs = 30
drain_secs = 5

[storage]
kind = "sqlite"
path = "__SQLITE_PATH__"

[aead]
key_env = "CC_LB_MASTER_KEY"

[observability]
tracing_level = "info"
log_redaction = true
user_prompt_redaction = false

[[admin.auth.providers]]
kind = "static_token"
id = "test"
token_env = "CC_LB_ADMIN_TOKEN"

[circuit_breaker]
failures_to_open = 5
window_secs = 10
half_open_after_secs = 30

[bulkhead]
max_conns_per_upstream = 50
semaphore_per_upstream = 100
