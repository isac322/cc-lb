[listener]
proxy_addr = "127.0.0.1:8888"
admin_addr = "127.0.0.1:8889"
metrics_addr = "127.0.0.1:8890"

[storage]
type = "redb"
path = "${data_dir}/cc-lb.redb"

[aead]
key_env = "CC_LB_MASTER_KEY"

[admin]
token_env = "CC_LB_BOOTSTRAP_ADMIN_TOKEN"

[api_keys.price_catalog]
url = "https://example.com/prices.json"
refresh_interval = "1d"

[oauth.anthropic]
client_id = "test-client"
auth_url = "http://localhost:18888/oauth/authorize"
token_url = "http://localhost:18888/oauth/token"
redirect_uri = "http://localhost:8888/oauth/callback"
scopes = ["org:profile"]
