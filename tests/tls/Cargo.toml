[package]
name = "cc-lb-tls-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
autotests = false

[[test]]
name = "integration"
path = "tests/all.rs"

[dependencies]
axum.workspace = true
cc-lb-clock = { path = "../../crates/cc-lb-clock" }
cc-lb-config = { path = "../../crates/cc-lb-config" }
cc-lb-server = { path = "../../crates/cc-lb-server" }
fake-anthropic = { path = "../fixtures/fake-anthropic" }
ring.workspace = true
rustls = { workspace = true, default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process", "rt-multi-thread", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
