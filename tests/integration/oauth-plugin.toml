[listener]
proxy_addr = "127.0.0.1:0"
admin_addr = "127.0.0.1:0"
metrics_addr = "127.0.0.1:0"

[body]
messages_cap_bytes = 33554432
files_cap_bytes = 104857600

[timeouts]
request_header_secs = 10
request_body_chunk_secs = 30
idle_secs = 300
upstream_total_secs = 30
drain_secs = 5

[upstreams.fake_anthropic]
kind = "custom"
base_url = "http://127.0.0.1:0"
auth_strategy = "o_auth"

[principals.alice]
allowed_models = ["*"]

[plugins]
observability_hooks = []

[plugins.authn_plugin]
name = "plugin-oauth-anthropic-pro"
wasm_path = "target/wasm32-wasip1/release/plugin_oauth_anthropic_pro.wasm"

[plugins.authn_plugin.config]
client_id = "client-test"
principals = { alice = { refresh_token_storage_key = "alice:anthropic_oauth", token_prefix = "sk-ant-oat01-MOCK-" } }

[storage]
redb_path = "/tmp/cc-lb-oauth-plugin.redb"
oauth_aead_key_env = "CC_LB_MASTER_KEY"

[signers.anthropic_oauth]
issuer_base_url = "http://127.0.0.1:0"
client_id = "client-test"
redirect_uri = "http://127.0.0.1/callback"
scopes = ["messages", "files"]

[observability]
tracing_level = "info"
log_redaction = true
user_prompt_redaction = false

[quotas]
default_window_secs = 60
default_requests_per_window = 1000
default_input_tokens = 1000000
default_output_tokens = 200000

[admin]
token_env = "CC_LB_ADMIN_TOKEN"

[circuit_breaker]
failures_to_open = 5
window_secs = 10
half_open_after_secs = 30

[bulkhead]
max_conns_per_upstream = 50
semaphore_per_upstream = 100

[dns]
cache_ttl_floor_secs = 30
cache_ttl_ceiling_secs = 300

[egress]
