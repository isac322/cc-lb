[package]
name = "cc-lb-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
axum = "0.8"
bytes = "1"
cc-lb-core = { path = "../crates/cc-lb-core" }
cc-lb-plugin-api = { path = "../crates/cc-lb-plugin-api" }
http = "1"
http-body-util = "0.1"
libfuzzer-sys = "0.4"
tokio = { version = "1", features = ["rt", "time"] }

[[bin]]
name = "sse_wrapper"
path = "fuzz_targets/sse_wrapper.rs"
test = false
doc = false
bench = false

[[bin]]
name = "header_parser"
path = "fuzz_targets/header_parser.rs"
test = false
doc = false
bench = false
