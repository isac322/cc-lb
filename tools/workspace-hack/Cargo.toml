[package]
name = "cc-lb-workspace-hack"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
aho-corasick = { version = "1.1.5", features = ["perf-literal", "std"] }
anyhow = { version = "1.0.104", features = ["std"] }
apalis = { version = "1.0.0", default-features = false, features = ["catch-panic", "limit", "prometheus", "timeout"] }
apalis-core = { version = "1.0.0", features = ["sleep"] }
apalis-postgres = "1.0.0"
apalis-sqlite = "1.0.0"
axum = { version = "0.8.9", features = ["form", "http1", "json", "matched-path", "multipart", "original-uri", "query", "tokio", "tower-log", "tracing", "ws"] }
base64_22 = { package = "base64", version = "0.22.1", features = ["alloc", "std"] }
blake3 = { version = "1.8.7", features = ["std"] }
bstr = { version = "1.13.1", features = ["alloc", "std", "unicode"] }
bumpalo = { version = "3.20.3", features = ["allocator-api2"] }
bytes = { version = "1.12.1", features = ["serde", "std"] }
chrono = { version = "0.4.45", features = ["clock", "iana-time-zone", "now", "serde", "std", "wasmbind", "winapi"] }
constant_time_eq = { version = "0.6.1", features = ["std"] }
crossbeam-epoch = { version = "0.9.21", features = ["alloc", "std"] }
crypto-common = { version = "0.1.7", default-features = false, features = ["std"] }
data-encoding = { version = "2.11.1", features = ["alloc", "std"] }
digest_10 = { package = "digest", version = "0.10.7", features = ["alloc", "block-buffer", "core-api", "std"] }
digest_11 = { package = "digest", version = "0.11.3", features = ["alloc", "block-api", "mac", "oid"] }
either = { version = "1.19.0", features = ["serde", "std", "use_std"] }
futures-util = { version = "0.3.34", features = ["alloc", "async-await", "async-await-macro", "channel", "futures-channel", "futures-io", "futures-macro", "futures-sink", "io", "memchr", "sink", "slab", "std"] }
getrandom_02 = { package = "getrandom", version = "0.2.17", features = ["std"] }
getrandom_03 = { package = "getrandom", version = "0.3.4", features = ["std"] }
hashbrown_17 = { package = "hashbrown", version = "0.17.1", default-features = false, features = ["default-hasher", "serde"] }
hickory-resolver = { version = "0.26.3", features = ["tokio", "system-config"] }
hyper = { version = "1.12.0", features = ["client", "full", "http1", "http2", "server"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-roots"] }
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "client-proxy", "http1", "http2", "server", "server-auto", "service", "tokio"] }
indexmap = { version = "2.14.2", features = ["serde", "std"] }
insta = { version = "1.49.0", features = ["json"] }
ipnet = { version = "2.12.2", features = ["serde", "std"] }
libc = { version = "0.2.191", features = ["extra_traits", "std"] }
libsqlite3-sys = { version = "0.40.0", features = ["bundled", "unlock_notify"] }
log = { version = "0.4.35", features = ["std"] }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
metrics-util = { version = "0.20.4", features = ["debugging", "layer-filter", "layer-router", "layers", "recency", "registry", "storage"] }
mime_guess = { version = "2.0.5", features = ["rev-mappings"] }
num-traits = { version = "0.2.19", features = ["std"] }
once_cell = { version = "1.21.4", features = ["alloc", "critical-section", "portable-atomic", "race", "std"] }
opentelemetry = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.33.1", features = ["trace", "testing"] }
portable-atomic = { version = "1.15.0", features = ["fallback"] }
proc-macro2 = { version = "1.0.107", features = ["proc-macro"] }
proptest = "1.12.0"
quote = { version = "1.0.47", features = ["proc-macro"] }
rand = { version = "0.10.3", features = ["std", "std_rng", "sys_rng", "thread_rng"] }
rand_08 = { package = "rand", version = "0.8.8", features = ["alloc", "getrandom", "libc", "rand_chacha", "small_rng", "std", "std_rng"] }
rand_09 = { package = "rand", version = "0.9.5", features = ["alloc", "os_rng", "small_rng", "std", "std_rng", "thread_rng"] }
rand_core_06 = { package = "rand_core", version = "0.6.4", features = ["alloc", "getrandom", "std"] }
regex-automata = { version = "0.4.18", features = ["alloc", "dfa-build", "dfa-onepass", "dfa-search", "hybrid", "meta", "nfa", "nfa-backtrack", "nfa-pikevm", "nfa-thompson", "perf", "perf-inline", "perf-literal", "perf-literal-multisubstring", "perf-literal-substring", "std", "syntax", "unicode", "unicode-age", "unicode-bool", "unicode-case", "unicode-gencat", "unicode-perl", "unicode-script", "unicode-segment", "unicode-word-boundary"] }
regex-syntax = { version = "0.8.11", features = ["std", "unicode", "unicode-age", "unicode-bool", "unicode-case", "unicode-gencat", "unicode-perl", "unicode-script", "unicode-segment"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls-no-provider"] }
ring = "0.17.14"
rkyv = { version = "0.8.18", default-features = false, features = ["std", "bytecheck"] }
rustc-hash = { version = "2.1.3", features = ["std"] }
rustix = { version = "1.1.6", features = ["alloc", "fs", "mm", "param", "std"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
semver = { version = "1.0.28", features = ["serde", "std"] }
serde_core = { version = "1.0.229", features = ["alloc", "rc", "result", "std"] }
serde_json = { version = "1.0.154", features = ["alloc", "raw_value", "std"] }
sha2_10 = { package = "sha2", version = "0.10.9", features = ["std"] }
sha2_11 = { package = "sha2", version = "0.11.1", features = ["alloc", "oid"] }
simdutf8 = { version = "0.1.5", features = ["aarch64_neon", "public_imp", "std"] }
smallvec = { version = "1.16.4", default-features = false, features = ["const_generics", "const_new", "serde", "union"] }
sonic-rs = "0.5.10"
sqlx = { version = "0.9.0", features = ["any", "chrono", "derive", "json", "macros", "migrate", "postgres", "runtime-tokio", "sqlite", "sqlx-toml", "tls-rustls", "tls-rustls-ring", "tls-rustls-ring-webpki", "uuid"] }
subtle = { version = "2.6.1", features = ["i128", "std"] }
syn_3 = { package = "syn", version = "3.0.9", features = ["clone-impls", "derive", "extra-traits", "fold", "full", "parsing", "printing", "proc-macro", "visit", "visit-mut"] }
sync_wrapper = { version = "1.0.2", features = ["futures", "futures-core"] }
tokio = { version = "1.54.1", features = ["bytes", "fs", "io-util", "libc", "macros", "mio", "net", "process", "rt", "rt-multi-thread", "signal", "signal-hook-registry", "socket2", "sync", "test-util", "time", "tokio-macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5.3", features = ["balance", "buffer", "discover", "futures-core", "futures-util", "indexmap", "limit", "load", "load-shed", "log", "make", "pin-project-lite", "ready-cache", "retry", "slab", "sync_wrapper", "timeout", "tokio", "tokio-util", "tracing", "util"] }
tower_http_07 = { package = "tower-http", version = "0.7.1", features = ["compression-br", "compression-gzip", "futures-core", "set-header", "tokio-util", "trace", "tracing"] }
tracing-core = { version = "0.1.36", features = ["once_cell", "std"] }
tracing-subscriber = { version = "0.3.23", features = ["alloc", "ansi", "env-filter", "fmt", "json", "matchers", "nu-ansi-term", "once_cell", "registry", "serde", "serde_json", "sharded-slab", "smallvec", "std", "thread_local", "tracing", "tracing-log", "tracing-serde"] }
trybuild = "1.0.122"
ulid = { version = "3.0.0", features = ["serde", "std", "uuid"] }
uuid = { version = "1.29.0", features = ["rng", "serde", "sha1", "std", "v4", "v5", "v7"] }
wasmtime = { version = "50.0.2", default-features = false, features = ["anyhow", "wat", "cranelift", "pooling-allocator", "threads", "gc", "gc-null", "component-model", "coredump"] }

[build-dependencies]
cc = { version = "1.10.0", features = ["parallel"] }
digest_11 = { package = "digest", version = "0.11.3", features = ["alloc", "block-api", "mac", "oid"] }
proc-macro2 = { version = "1.0.107", features = ["proc-macro"] }
quote = { version = "1.0.47", features = ["proc-macro"] }
sha2_11 = { package = "sha2", version = "0.11.1", features = ["alloc", "oid"] }
syn = { version = "3.0.9", features = ["clone-impls", "derive", "extra-traits", "full", "parsing", "printing", "proc-macro", "visit-mut"] }

[lints.rust]
unused_crate_dependencies = "allow"
