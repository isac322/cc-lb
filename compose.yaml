# Local dev infrastructure for cc-lb.
# Brings up the postgres backend consumed by the RustRover run configs in `.run/`
# (paired with `.run/cc-lb-local.toml`). Not used by CI — CI provisions postgres
# via GitHub Actions `services:` in .github/workflows/postgres.yml.

services:
  postgres:
    image: postgres:18-alpine
    container_name: cc-lb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cclb
      POSTGRES_PASSWORD: cclb
      POSTGRES_DB: cclb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cc-lb-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cclb -d cclb"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Trace collection backend. Point `[observability] otlp_endpoint` at
  # http://127.0.0.1:4317 to export proxy spans here.
  tempo:
    image: grafana/tempo:3.0.0
    container_name: cc-lb-tempo
    restart: unless-stopped
    # Local-dev only: root lets the container read the bind-mounted config
    # under restrictive home permissions and write the local storage volume,
    # mirroring Grafana's own local-storage compose examples.
    user: root
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:3200:3200"
    configs:
      - source: tempo-config
        target: /etc/tempo/tempo.yaml
    volumes:
      - cc-lb-tempo-data:/var/tempo

volumes:
  cc-lb-postgres-data:
  cc-lb-tempo-data:

configs:
  tempo-config:
    file: ./deploy/tempo/tempo.yaml
