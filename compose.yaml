# Local dev infrastructure for cc-lb.
# Brings up the postgres backend consumed by the RustRover run configs in `.run/`
# (paired with `.run/cc-lb-local.toml`). Not used by CI — CI provisions postgres
# via GitHub Actions `services:` in .github/workflows/postgres.yml.

services:
  postgres:
    image: postgres:17-alpine
    container_name: cc-lb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cclb
      POSTGRES_PASSWORD: cclb
      POSTGRES_DB: cclb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cc-lb-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cclb -d cclb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cc-lb-postgres-data:
