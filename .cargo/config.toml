[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

# Scheduler migration: silence `deprecated` lint workspace-wide while the
# Wave 5 `#[deprecated]` markers remain in place. The matching Wave 8 follow-up
# PR drops the columns and re-enables enforcement.
[target.'cfg(all())']
rustflags = ["-A", "deprecated"]
