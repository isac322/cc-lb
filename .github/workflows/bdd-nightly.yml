name: bdd-nightly

env:
  CC_LB_ADMIN_SKIP_SPA: "1"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  bdd-full-sqlite:
    name: BDD full suite (sqlite)
    runs-on: oracle4-cc-lb
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-rust-cache
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run full BDD suite (sqlite)
        run: cargo nextest run -p cc-lb-bdd-tests
      - name: Upload captures on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-nightly-captures-sqlite
          path: crates/cc-lb-bdd-tests/tests/__captures__/
          retention-days: 30
          if-no-files-found: ignore

  bdd-full-postgres:
    name: BDD full suite (postgres)
    runs-on: oracle4-cc-lb

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: cc_lb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CI_POSTGRES_URL: postgres://postgres:testpw@localhost:5432/cc_lb_test

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-rust-cache
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run full BDD suite (postgres)
        run: |
          cargo nextest run \
            -p cc-lb-bdd-tests \
            --features postgres
      - name: Upload captures on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-nightly-captures-postgres
          path: crates/cc-lb-bdd-tests/tests/__captures__/
          retention-days: 30
          if-no-files-found: ignore
