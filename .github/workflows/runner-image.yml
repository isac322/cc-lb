name: runner-image

on:
  push:
    branches:
      - master
    paths:
      - '.github/runner-image/**'
      - '.github/workflows/runner-image.yml'
  pull_request:
    paths:
      - '.github/runner-image/**'
      - '.github/workflows/runner-image.yml'
  workflow_dispatch:
    inputs:
      base_tag:
        description: 'Tag of ghcr.io/falcondev-oss/actions-runner to base on'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cc-lb-actions-runner

jobs:
  build:
    name: Build & push runner image (arm64)
    # Bootstrap on GitHub-hosted amd64: we are building the very image future
    # self-hosted arm64 runners will run on, so they cannot build themselves.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU (arm64 emulation on amd64 host)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pin BASE_TAG=latest to its concrete semver so the build is reproducible and our output tag mirrors the base's version.
      - name: Resolve base image version tag
        id: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          input_tag="${{ inputs.base_tag || 'latest' }}"
          if [ "$input_tag" != "latest" ]; then
            echo "Using explicit base tag: $input_tag"
            echo "tag=$input_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          digest=$(docker buildx imagetools inspect ghcr.io/falcondev-oss/actions-runner:latest --format '{{.Manifest.Digest}}')
          echo "base latest digest = $digest"
          version=$(gh api /orgs/falcondev-oss/packages/container/actions-runner/versions \
            --jq ".[] | select(.name == \"$digest\") | .metadata.container.tags[] | select(. != \"latest\")" \
            | head -n1)
          if [ -z "$version" ]; then
            echo "::error::Could not resolve a non-latest tag for base digest $digest"
            exit 1
          fi
          echo "Resolved base latest -> $version"
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.base.outputs.tag }}
            type=raw,value=latest

      # Single-platform arm64 build. Buildx still wraps the result in a
      # manifest list whose only entry is linux/arm64, so an amd64 client
      # pulling this image fails fast with:
      #   "no matching manifest for linux/amd64 in the manifest list entries"
      # rather than silently pulling a non-runnable image.
      - name: Build and push (linux/arm64 only)
        uses: docker/build-push-action@v6
        with:
          context: .github/runner-image
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BASE_TAG=${{ steps.base.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
