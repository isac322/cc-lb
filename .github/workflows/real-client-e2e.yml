name: Real Client E2E

on:
  pull_request:
  push:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CC_LB_ADMIN_SKIP_SPA: "1"

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned real clients
        run: tests/real-client/install.sh
      - name: Run real-client matrix
        run: tests/real-client/matrix.sh
      - name: Upload real-client evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-36-real-client-evidence
          path: .omo/evidence/task-36-*
          if-no-files-found: error
