name: ci

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CC_LB_ADMIN_SKIP_SPA: "1"

jobs:
  fmt:
    runs-on: oracle4-cc-lb
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: oracle4-cc-lb
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ./.github/actions/setup-rust-cache
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Show sccache stats
        if: always()
        run: |
          if [ -n "${SCCACHE_PATH:-}" ] && [ -x "$SCCACHE_PATH" ]; then
            "$SCCACHE_PATH" --show-stats
          elif command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          fi

  nextest-build:
    name: nextest build
    runs-on: oracle4-cc-lb
    env:
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WASI target for pinned toolchain
        run: rustup target add wasm32-wasip1
      - name: Install wasm32-unknown-unknown for handshake spike fixture
        run: rustup target add wasm32-unknown-unknown
      - uses: ./.github/actions/setup-rust-cache
        with:
          rust-cache-key: nextest-build
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Pre-build wasm test fixtures
        run: |
          cargo build -p plugin-handshake-spike --target wasm32-unknown-unknown --release
          cargo build -p extism-echo-plugin --target wasm32-wasip1 --release
      - name: Pack wasm test fixtures
        run: |
          tar -cf wasm-test-fixtures.tar \
            target/wasm32-unknown-unknown/release/plugin_handshake_spike.wasm \
            target/wasm32-wasip1/release/extism_echo_plugin.wasm
      - name: Build nextest archive
        run: cargo nextest archive --workspace --exclude cc-lb-loadgen --archive-file nextest-archive.tar.zst
      - name: Upload nextest archive
        uses: actions/upload-artifact@v7
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          if-no-files-found: error
          retention-days: 1
      - name: Upload wasm test fixtures
        uses: actions/upload-artifact@v7
        with:
          name: wasm-test-fixtures
          path: wasm-test-fixtures.tar
          if-no-files-found: error
          retention-days: 1
      - name: Show sccache stats
        if: always()
        run: |
          if [ -n "${SCCACHE_PATH:-}" ] && [ -x "$SCCACHE_PATH" ]; then
            "$SCCACHE_PATH" --show-stats
          elif command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          fi

  nextest-partition:
    name: nextest partition ${{ matrix.partition }}/4
    needs: nextest-build
    runs-on: oracle4-cc-lb
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WASI target for pinned toolchain
        run: rustup target add wasm32-wasip1
      - name: Install wasm32-unknown-unknown for handshake spike fixture
        run: rustup target add wasm32-unknown-unknown
      - uses: ./.github/actions/setup-rust-cache
        with:
          rust-cache-key: nextest-partition-${{ matrix.partition }}
      - uses: actions/download-artifact@v7
        with:
          name: nextest-archive
      - uses: actions/download-artifact@v7
        with:
          name: wasm-test-fixtures
      - name: Unpack wasm test fixtures
        run: tar -xf wasm-test-fixtures.tar
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run nextest partition
        run: |
          cargo nextest run \
            --archive-file nextest-archive.tar.zst \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --partition count:${{ matrix.partition }}/4

  nextest:
    needs: nextest-partition
    runs-on: oracle4-cc-lb
    if: always()
    steps:
      - name: Check nextest partitions
        run: |
          if [ "${{ needs.nextest-partition.result }}" != "success" ]; then
            echo "nextest partition failed"
            exit 1
          fi
