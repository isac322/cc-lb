name: ci

# Pull requests always start this workflow, so the `CI gate` job reports on
# every pull request and the master ruleset can require it. A workflow-level
# `paths-ignore` on pull_request would skip the whole workflow for docs-only
# changes, leaving required checks pending forever. The `changes` job applies
# the same docs-only ignore list instead, and the code jobs skip when every
# changed file matches it. `CI gate` passes when each needed job succeeded, or
# was skipped for a reason its own `if:` gives (docs-only change, not a pull
# request, release-plz branch, non-release title), and fails otherwise.
#
# Pushes to master and manual dispatch behave as before: push keeps its
# `paths-ignore`, `changes` is skipped, and every code job runs.
on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CC_LB_ADMIN_SKIP_SPA: "1"

jobs:
  # `code` is false only when every changed file matches the docs-only ignore
  # list that `push.paths-ignore` uses. Code jobs run unless this job succeeded
  # with code=false, so a detection failure runs everything (and fails the
  # gate).
  changes:
    name: Detect code changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.gitignore'
              - '!.editorconfig'

  fmt:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rustup-home
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt
      - run: cargo fmt --check
      - name: Audit-redaction lint
        run: bash scripts/lint-audit-redaction.sh
      - name: Integration-test consolidation guard
        run: bash scripts/check-integration-test-consolidation.sh

  guard-crate-versions:
    name: guard crate versions
    needs: changes
    # release-plz owns literal crate versions. A dedicated release PR may bump
    # the shared workspace version for cc-lb-server after strict validation.
    # release-plz's own PRs remain exempt.
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') &&
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate managed crate version changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          base_tree="$RUNNER_TEMP/base"
          cleanup() {
            git worktree remove --force "$base_tree" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git worktree add --detach "$base_tree" "$BASE_SHA"

          args=(
            --base "$base_tree"
            --head .
            --pr-title "$PR_TITLE"
          )
          while IFS= read -r path; do
            args+=(--changed-file "$path")
          done < <(git diff --name-only "$BASE_SHA"...HEAD)
          while IFS= read -r tag; do
            args+=(--existing-tag "$tag")
          done < <(git tag --list 'cc-lb-v*')

          python3 scripts/check-crate-versions.py "${args[@]}"
      - name: Test managed version validator
        run: python3 scripts/test_check_crate_versions.py -v
      - name: Test chart metadata helper
        run: python3 scripts/test_chart_metadata.py -v
      - name: Test Docker release alias selection
        run: node --test scripts/test_release_aliases.mjs

  release-pr-artifacts:
    name: verify server release artifacts
    needs: guard-crate-versions
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.title, 'chore: release cc-lb v')
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: ./.github/actions/setup-rustup-home
      - name: Attach release-plz validation branch
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          git checkout -B release-plz-validation HEAD
          git branch --set-upstream-to="origin/$GITHUB_BASE_REF" release-plz-validation


      - uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          driver: docker-container
      - uses: ./.github/actions/setup-actionlint

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Inspect release target
        id: release
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "cc-lb-server") | .version')
          printf 'version=%s\ntarget_sha=%s\nsource_date_epoch=%s\n' \
            "$version" "$(git rev-parse HEAD)" "$(git show -s --format=%ct HEAD)" \
            >> "$GITHUB_OUTPUT"

      # release-plz 0.3.172 supports git-only releases, but its release command
      # still filters out manifest-private packages before applying that mode.
      - name: Expose private server package to release-plz
        run: |
          set -euo pipefail
          manifest=crates/cc-lb-server/Cargo.toml
          backup="$RUNNER_TEMP/cc-lb-server-Cargo.toml"
          cp "$manifest" "$backup"
          if [ "$(grep -cx 'publish = false' "$manifest")" != "1" ]; then
            echo "::error::cc-lb-server publish=false marker not found exactly once"
            exit 1
          fi
          sed -i '/^publish = false$/d' "$manifest"


      - name: Install and dry-run release-plz server release
        uses: MarcoIeni/release-plz-action@v0.5.147
        with:
          command: release
          config: release-plz-server.toml
          version: 0.3.172
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Git-only dry-runs intentionally return releases=[].
      - name: Verify release-plz server selection
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          output=$(release-plz release \
            --dry-run \
            --config release-plz-server.toml \
            --repo-url "https://github.com/$GITHUB_REPOSITORY" \
            --forge github \
            -v 2>&1)
          printf '%s\n' "$output"
          grep -F "cc-lb-server $EXPECTED_VERSION:" <<< "$output"
          grep -F "creation of tag 'cc-lb-v$EXPECTED_VERSION'" <<< "$output"
          grep -F "creation of git release" <<< "$output"

      - name: Restore private server manifest
        if: always()
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/cc-lb-server-Cargo.toml"
          if [ -f "$backup" ]; then
            cp "$backup" crates/cc-lb-server/Cargo.toml
          fi
          git diff --exit-code -- crates/cc-lb-server/Cargo.toml


      - name: Restore BuildKit cache mounts
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/docker-mounts.tar
          key: docker-mounts-fat-amd64-${{ steps.release.outputs.target_sha }}
          restore-keys: |
            docker-mounts-fat-amd64-

      - name: Inject restored BuildKit cache mounts
        if: steps.cache-restore.outputs.cache-matched-key != ''
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          ctx="$RUNNER_TEMP/buildkit-cache-inject"
          rm -rf "$ctx"
          mkdir -p "$ctx"
          mv "$RUNNER_TEMP/docker-mounts.tar" "$ctx/docker-mounts.tar"
          cat > "$ctx/Dockerfile" <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.24 AS inject
          COPY docker-mounts.tar /docker-mounts.tar
          RUN --mount=type=cache,id=cargo-home,sharing=shared,target=/cargo-home \
              --mount=type=cache,id=bun-linux-amd64,target=/bun \
              --mount=type=cache,id=sccache,sharing=shared,target=/sccache \
              tar -C / -xf /docker-mounts.tar && \
              mkdir -p /out && \
              du -sb /cargo-home /bun /sccache > /out/restored.txt
          FROM scratch
          COPY --from=inject /out/ /
          EOF
          docker buildx build --builder "$BUILDER" --progress=plain --output "type=local,dest=$ctx/out" "$ctx"
          cat "$ctx/out/restored.txt"
          rm -rf "$ctx"

      - name: Build and smoke-test production image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_RETENTION_DAYS: "7"
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: smoke
          outputs: type=cacheonly
          build-args: |
            CARGO_BUILD_JOBS=4
            SCCACHE_LOCAL_MOUNT=1
            REQUIRE_SCCACHE=1
            GIT_SHA=${{ steps.release.outputs.target_sha }}
            SOURCE_DATE_EPOCH=${{ steps.release.outputs.source_date_epoch }}
            EXPECTED_VERSION=${{ steps.release.outputs.version }}
      - name: Lint and verify release chart
        env:
          SOURCE_SHA: ${{ steps.release.outputs.target_sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          chart_dir="$RUNNER_TEMP/cc-lb-release-chart"
          package_dir="$RUNNER_TEMP/cc-lb-release-package"
          command rm -rf "$chart_dir" "$package_dir"
          command cp -R deploy/helm/cc-lb "$chart_dir"
          mkdir -p "$package_dir/unpacked"
          python3 scripts/chart_metadata.py stamp \
            --chart "$chart_dir/Chart.yaml" \
            --revision "$SOURCE_SHA"
          helm lint "$chart_dir" \
            --set secrets.masterKey=ci-lint-placeholder \
            --set secrets.adminToken=ci-admin-placeholder
          helm package "$chart_dir" \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination "$package_dir"
          tar -xzf "$package_dir/cc-lb-$VERSION.tgz" \
            -C "$package_dir/unpacked"
          python3 scripts/chart_metadata.py verify \
            --chart "$package_dir/unpacked/cc-lb/Chart.yaml" \
            --version "$VERSION" \
            --revision "$SOURCE_SHA"

      - name: Lint release workflows
        run: >-
          actionlint
          .github/workflows/ci.yml
          .github/workflows/cd.yml
          .github/workflows/docker-build.yml
          .github/workflows/publish-chart.yml
          .github/workflows/release-server.yml
          .github/workflows/release-plz.yml

  clippy:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        features: [sqlite, postgres]
    env:
      # Clippy never runs fixture-backed WASM tests, so bypass that build-time
      # prerequisite. The workflow-level env already skips the admin SPA.
      CC_LB_SKIP_WASM_FIXTURE_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rustup-home
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: ./.github/actions/setup-rust-cache
        with:
          stable-build-metadata: "true"
      - run: cargo clippy --workspace --all-targets --no-default-features --features ${{ matrix.features }} -- -D warnings
      - name: Show sccache stats
        if: always()
        run: |
          if [ -n "${SCCACHE_PATH:-}" ] && [ -x "$SCCACHE_PATH" ]; then
            "$SCCACHE_PATH" --show-stats || echo "::warning::sccache stats unavailable; continuing without cache statistics"
          elif command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || echo "::warning::sccache stats unavailable; continuing without cache statistics"
          fi


  cargo-deny:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rustup-home
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  promtool:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install and run promtool
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64) asset=linux-amd64 ;;
            ARM64) asset=linux-arm64 ;;
            *) echo "unsupported architecture $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          archive="prometheus-3.15.0.${asset}.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/prometheus/prometheus/releases/download/v3.15.0/${archive}" \
            --output "$RUNNER_TEMP/prometheus.tar.gz"
          tar -xzf "$RUNNER_TEMP/prometheus.tar.gz" -C "$RUNNER_TEMP"
          promtool="$RUNNER_TEMP/prometheus-3.15.0.${asset}/promtool"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$promtool" "$RUNNER_TEMP/bin/promtool"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          promtool --version
      - name: Check alert rule syntax
        run: promtool check rules deploy/alerts/*.yml
      - name: Validate Grafana dashboards
        run: scripts/validate-grafana-dashboard.sh

  # A sharded, multi-node version of this job is prepared (inactive) in
  # coverage-sharded.yml. Do not run both: they enforce the same coverage gate.
  nextest-cov:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-26.04

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: cc_lb_test
        ports:
          - 5432:5432
        # Hosted service jobs reach Postgres through the mapped localhost port.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Keep coverage build and test concurrency aligned with the hosted runner.
      # Dial back toward 2 if Postgres visibility tests start timing out under
      # llvm-cov.
      CARGO_BUILD_JOBS: "4"
      # Coverage maps counters via embedded __llvm_covmap sections, not DWARF,
      # so debuginfo only bloats object size and slows linking here. Drop it
      # (test + dev profiles, overriding the runner's line-tables-only default)
      # to cut link time; the only cost is less precise test-failure backtraces.
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      # Raised 120 -> 240: nextest-cov runs the full --all-features workspace
      # suite under llvm-cov instrumentation on this 4-core, CARGO_BUILD_JOBS=4
      # Runner contention can stall Postgres's xmin snapshot
      # advancement (multi_instance_storage_tail's pg_snapshot_xmin visibility
      # check, runtime_change_notifier's LISTEN/NOTIFY round-trip), so tests
      # already scaled by this var still occasionally exceed 120s at full
      # instance-count parallelism — observed here and independently on
      # master (run 29223361998, a different test in the same category).
      # 240 keeps the same env-scale convention (0696a516, 4013d027) with
      # headroom for this runner's real contention envelope.
      CC_LB_TEST_READY_TIMEOUT_SECS: "240"
      CI_POSTGRES_URL: postgres://postgres:testpw@localhost:5432/cc_lb_test
      # Alias the same Postgres URL under DATABASE_URL and DATABASE_URL_TEST so
      # tests that check one of the latter env vars (cc-lb-scheduler integration
      # tests) run instead of silently returning Ok(()) after an
      # eprintln!("skip: ...").
      # Literal URL (not ${{ env.CI_POSTGRES_URL }}) — same-map GitHub Actions
      # env aliasing is not portable.
      DATABASE_URL: postgres://postgres:testpw@localhost:5432/cc_lb_test
      DATABASE_URL_TEST: postgres://postgres:testpw@localhost:5432/cc_lb_test
      # Force offline sqlx macro verification. apalis-sqlite ships SQLite-flavored
      # sqlx::query_file!() macros; with DATABASE_URL set to Postgres they would
      # try to prepare their SQLite SQL against Postgres and fail with
      # "relation \"jobs\" does not exist". Both apalis-sqlite and apalis-postgres
      # ship .sqlx/ offline caches in their crate sources so this always compiles.
      # This crate's own code uses no compile-time sqlx macros, only runtime
      # queries — so runtime DB access is unaffected.
      SQLX_OFFLINE: "true"

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rustup-home
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview
      - name: Install wasm targets for pinned toolchain
        run: rustup target add wasm32-wasip1 wasm32-unknown-unknown
      # Unlike clippy, coverage executes fixture-backed WASM tests, so retain
      # both targets installed above.
      - uses: ./.github/actions/setup-rust-cache
        with:
          stable-build-metadata: "true"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.9.0
      - name: Export cargo-installed tools
        run: echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
      - name: Verify test tools
        run: command -v cargo-llvm-cov cargo-nextest sqlx

      - name: Preflight - CI_POSTGRES_URL must be set
        run: |
          if [ -z "${CI_POSTGRES_URL:-}" ]; then
            echo "CI_POSTGRES_URL is empty; postgres service did not configure the env." >&2
            exit 1
          fi

      - name: Run Postgres migrations
        run: sqlx migrate run --source crates/cc-lb-storage-postgres/migrations
        env:
          DATABASE_URL: ${{ env.CI_POSTGRES_URL }}

      - name: Clean coverage artifacts
        run: cargo llvm-cov clean --workspace

      - name: Run tests with coverage instrumentation
        run: |
          # Pin test concurrency to the hosted runner's four-core request so
          # coverage-instrumented processes cannot multiply unnecessarily.
          cargo llvm-cov nextest \
            --workspace \
            --exclude cc-lb-loadgen \
            --exclude cc-lb-stress-suite \
            --all-features \
            --test-threads=4 \
            --no-report

      - name: Generate workspace lcov report
        run: |
          cargo llvm-cov report \
            --lcov \
            --output-path target/coverage.lcov \
            --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'

      - name: Check per-package coverage gates
        run: scripts/coverage-gate.sh target/coverage.lcov

      - name: Show sccache stats
        if: always()
        run: |
          if [ -n "${SCCACHE_PATH:-}" ] && [ -x "$SCCACHE_PATH" ]; then
            "$SCCACHE_PATH" --show-stats || echo "::warning::sccache stats unavailable; continuing without cache statistics"
          elif command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || echo "::warning::sccache stats unavailable; continuing without cache statistics"
          fi

  e2e:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-26.04
    env:
      # Real-client E2E builds the server but does not run the fixture-backed
      # Wasmtime integration suite.
      CC_LB_SKIP_WASM_FIXTURE_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rustup-home
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # Reinstall the pinned clients instead of transferring an expanded
      # node_modules archive. install.sh keeps version and marker validation
      # and lets the package managers reuse downloads within this job.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: ./.github/actions/setup-rust-cache
        with:
          stable-build-metadata: "true"
      - name: Install pinned real clients
        run: tests/real-client/install.sh
      - name: Run real-client matrix
        run: tests/real-client/matrix.sh
      - name: Show sccache stats
        if: always()
        run: |
          if [ -n "${SCCACHE_PATH:-}" ] && [ -x "$SCCACHE_PATH" ]; then
            "$SCCACHE_PATH" --show-stats || echo "::warning::sccache stats unavailable; continuing without cache statistics"
          elif command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || echo "::warning::sccache stats unavailable; continuing without cache statistics"
          fi
      - name: Upload real-client evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-client-evidence
          path: target/test-evidence/real-client
          retention-days: 7
          if-no-files-found: error

  gate:
    name: CI gate
    needs:
      - changes
      - fmt
      - guard-crate-versions
      - release-pr-artifacts
      - clippy
      - cargo-deny
      - promtool
      - nextest-cov
      - e2e
    if: always()
    runs-on: ubuntu-26.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        # JOBS must list exactly the job ids in `needs` above. A job missing
        # from the needs context, or a context that is not a JSON object,
        # fails the gate.
        #
        # A job passes on success. It passes on skipped only when its own `if:`
        # explains the skip; keep skip_ok in sync with those conditions. A run
        # cancelled after `changes` but before the code jobs start skips them
        # all, and this gate may still start afterwards with cancelled() false,
        # so `skipped` alone must never pass. startsWith() in expressions is
        # case-insensitive, so its two mirrors compare lowercased values.
        run: |
          set -euo pipefail
          JOBS=(changes fmt guard-crate-versions release-pr-artifacts clippy
            cargo-deny promtool nextest-cov e2e)
          if ! jq -e --args 'type == "object" and (keys == ($ARGS.positional | sort))' \
            "${JOBS[@]}" <<<"$RESULTS" >/dev/null; then
            echo "::error::needs context does not match the expected jobs: ${JOBS[*]}"
            exit 1
          fi
          result_of() {
            jq -er --arg job "$1" '.[$job].result // "missing"' <<<"$RESULTS"
          }
          changes=$(result_of changes)
          code=$(jq -er '.changes.outputs.code // ""' <<<"$RESULTS")
          is_pr=false
          [[ $EVENT_NAME == pull_request ]] && is_pr=true
          # Code jobs skip only when change detection succeeded and found no
          # code change.
          docs_only=false
          [[ $changes == success && $code != true ]] && docs_only=true
          guard_skip_ok=false
          if $docs_only || ! $is_pr || [[ ${HEAD_REF,,} == "release-plz-"* ]]; then
            guard_skip_ok=true
          fi
          skip_ok() {
            case "$1" in
              changes) ! $is_pr ;;
              guard-crate-versions) $guard_skip_ok ;;
              release-pr-artifacts)
                # Its own `if:`, or a legitimately skipped guard it needs.
                ! $is_pr || [[ ${PR_TITLE,,} != "chore: release cc-lb v"* ]] ||
                  { [[ $(result_of guard-crate-versions) == skipped ]] && $guard_skip_ok; } ;;
              *) $docs_only ;;
            esac
          }
          rc=0
          for job in "${JOBS[@]}"; do
            result=$(result_of "$job")
            echo "$job: $result"
            case "$result" in
              success) ;;
              skipped)
                if ! skip_ok "$job"; then
                  echo "::error::$job: skipped without a matching condition (run cancelled?)"
                  rc=1
                fi
                ;;
              *) echo "::error::$job: $result"; rc=1 ;;
            esac
          done
          exit "$rc"
