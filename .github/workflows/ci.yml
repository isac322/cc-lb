name: ci

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CC_LB_ADMIN_SKIP_SPA: "1"

jobs:
  fmt:
    runs-on: oracle4-cc-lb
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: oracle4-cc-lb
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ./.github/actions/setup-rust-cache
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Show sccache stats
        if: always()
        run: |
          if [ -n "${SCCACHE_PATH:-}" ] && [ -x "$SCCACHE_PATH" ]; then
            "$SCCACHE_PATH" --show-stats
          elif command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          fi

  nextest:
    runs-on: oracle4-cc-lb
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CC_LB_TEST_READY_TIMEOUT_SECS: "120"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wasm targets for pinned toolchain
        run: rustup target add wasm32-wasip1 wasm32-unknown-unknown
      - uses: ./.github/actions/setup-rust-cache
        with:
          stable-build-metadata: "true"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Pre-build handshake spike wasm artifact
        run: cargo build -p plugin-handshake-spike --target wasm32-unknown-unknown --release
      - run: cargo nextest run --workspace --exclude cc-lb-loadgen
      - name: Show sccache stats
        if: always()
        run: |
          if [ -n "${SCCACHE_PATH:-}" ] && [ -x "$SCCACHE_PATH" ]; then
            "$SCCACHE_PATH" --show-stats
          elif command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          fi
