name: ci

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CC_LB_ADMIN_SKIP_SPA: "1"

jobs:
  fmt:
    runs-on: cc-lb-500m
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rustup-home
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Ensure ripgrep is available
        run: rg --version
      - run: cargo fmt --check
      - name: Audit-redaction lint
        run: bash scripts/lint-audit-redaction.sh
      - name: Integration-test consolidation guard
        run: bash scripts/check-integration-test-consolidation.sh

  guard-crate-versions:
    name: guard crate versions
    # release-plz owns literal crate versions. A dedicated release PR may bump
    # the shared workspace version for cc-lb-server after strict validation.
    # release-plz's own PRs remain exempt.
    if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-plz-') }}
    runs-on: cc-lb-500m
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate managed crate version changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          base_tree="$RUNNER_TEMP/base"
          cleanup() {
            git worktree remove --force "$base_tree" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git worktree add --detach "$base_tree" "$BASE_SHA"

          args=(
            --base "$base_tree"
            --head .
            --pr-title "$PR_TITLE"
          )
          while IFS= read -r path; do
            args+=(--changed-file "$path")
          done < <(git diff --name-only "$BASE_SHA"...HEAD)
          while IFS= read -r tag; do
            args+=(--existing-tag "$tag")
          done < <(git tag --list 'cc-lb-v*')

          python3 scripts/check-crate-versions.py "${args[@]}"
      - name: Test managed version validator
        run: python3 scripts/test_check_crate_versions.py -v
      - name: Test chart metadata helper
        run: python3 scripts/test_chart_metadata.py -v
      - name: Test Docker release alias selection
        run: node --test scripts/test_release_aliases.mjs

  release-pr-artifacts:
    name: verify server release artifacts
    needs: guard-crate-versions
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.title, 'chore: release cc-lb v')
    runs-on: cc-lb-500m
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: ./.github/actions/export-sccache-env
      - uses: ./.github/actions/setup-rustup-home
      - uses: ./.github/actions/setup-gh
      - name: Attach release-plz validation branch
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          git checkout -B release-plz-validation HEAD
          git branch --set-upstream-to="origin/$GITHUB_BASE_REF" release-plz-validation


      - uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: ${{ vars.CC_LB_BUILDKIT_ENDPOINT }}

      - uses: ./.github/actions/setup-actionlint

      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.2.4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Inspect release target
        id: release
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "cc-lb-server") | .version')
          printf 'version=%s\ntarget_sha=%s\nsource_date_epoch=%s\n' \
            "$version" "$(git rev-parse HEAD)" "$(git show -s --format=%ct HEAD)" \
            >> "$GITHUB_OUTPUT"

      # release-plz 0.3.160 supports git-only releases, but its release command
      # still filters out manifest-private packages before applying that mode.
      - name: Expose private server package to release-plz
        run: |
          set -euo pipefail
          manifest=crates/cc-lb-server/Cargo.toml
          backup="$RUNNER_TEMP/cc-lb-server-Cargo.toml"
          cp "$manifest" "$backup"
          if [ "$(grep -cx 'publish = false' "$manifest")" != "1" ]; then
            echo "::error::cc-lb-server publish=false marker not found exactly once"
            exit 1
          fi
          sed -i '/^publish = false$/d' "$manifest"


      - name: Install and dry-run release-plz server release
        uses: MarcoIeni/release-plz-action@v0.5.131
        with:
          command: release
          config: release-plz-server.toml
          version: 0.3.160
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Git-only dry-runs intentionally return releases=[].
      - name: Verify release-plz server selection
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          output=$(release-plz release \
            --dry-run \
            --config release-plz-server.toml \
            --repo-url "https://github.com/$GITHUB_REPOSITORY" \
            --forge github \
            -v 2>&1)
          printf '%s\n' "$output"
          grep -F "cc-lb-server $EXPECTED_VERSION:" <<< "$output"
          grep -F "creation of tag 'cc-lb-v$EXPECTED_VERSION'" <<< "$output"
          grep -F "creation of git release" <<< "$output"

      - name: Restore private server manifest
        if: always()
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/cc-lb-server-Cargo.toml"
          if [ -f "$backup" ]; then
            cp "$backup" crates/cc-lb-server/Cargo.toml
          fi
          git diff --exit-code -- crates/cc-lb-server/Cargo.toml


      - name: Build and smoke-test production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: smoke
          outputs: type=cacheonly
          build-args: |
            GIT_SHA=${{ steps.release.outputs.target_sha }}
            SOURCE_DATE_EPOCH=${{ steps.release.outputs.source_date_epoch }}
            SCCACHE_BUCKET=${{ env.SCCACHE_BUCKET }}
            SCCACHE_ENDPOINT=${{ env.SCCACHE_ENDPOINT }}
            SCCACHE_REGION=${{ env.SCCACHE_REGION }}
            SCCACHE_S3_USE_SSL=${{ env.SCCACHE_S3_USE_SSL }}
            SCCACHE_S3_KEY_PREFIX=${{ env.SCCACHE_S3_KEY_PREFIX }}
            EXPECTED_VERSION=${{ steps.release.outputs.version }}
          secret-envs: |
            AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY

      - name: Lint and verify release chart
        env:
          SOURCE_SHA: ${{ steps.release.outputs.target_sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          chart_dir="$RUNNER_TEMP/cc-lb-release-chart"
          package_dir="$RUNNER_TEMP/cc-lb-release-package"
          command rm -rf "$chart_dir" "$package_dir"
          command cp -R deploy/helm/cc-lb "$chart_dir"
          mkdir -p "$package_dir/unpacked"
          python3 scripts/chart_metadata.py stamp \
            --chart "$chart_dir/Chart.yaml" \
            --revision "$SOURCE_SHA"
          helm lint "$chart_dir" --set secrets.masterKey=ci-lint-placeholder
          helm package "$chart_dir" \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination "$package_dir"
          tar -xzf "$package_dir/cc-lb-$VERSION.tgz" \
            -C "$package_dir/unpacked"
          python3 scripts/chart_metadata.py verify \
            --chart "$package_dir/unpacked/cc-lb/Chart.yaml" \
            --version "$VERSION" \
            --revision "$SOURCE_SHA"

      - name: Lint release workflows
        run: >-
          actionlint
          .github/workflows/ci.yml
          .github/workflows/cd.yml
          .github/workflows/publish-chart.yml
          .github/workflows/release-server.yml
          .github/workflows/release-plz.yml

  clippy:
    runs-on: cc-lb-2
    strategy:
      matrix:
        features: [sqlite, postgres]
    env:
      # Clippy never runs fixture-backed WASM tests, so bypass that build-time
      # prerequisite. The workflow-level env already skips the admin SPA.
      CC_LB_SKIP_WASM_FIXTURE_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rustup-home
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: ./.github/actions/setup-rust-cache
        with:
          stable-build-metadata: "true"
      - run: cargo clippy --workspace --all-targets --no-default-features --features ${{ matrix.features }} -- -D warnings
      - name: Show sccache stats
        if: always()
        run: |
          if [ -n "${SCCACHE_PATH:-}" ] && [ -x "$SCCACHE_PATH" ]; then
            "$SCCACHE_PATH" --show-stats
          elif command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          fi

  cargo-deny:
    runs-on: cc-lb-1
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rustup-home
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Install cargo-deny
        run: |
          set -euo pipefail
          ver=0.20.2
          archive="cargo-deny-${ver}-aarch64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${ver}/${archive}" \
            --output "/tmp/${archive}"
          echo "995c82be0defc7a025cae49a2aa2644ce8245c9a3318fc4103907c6a285e8c7d  /tmp/${archive}" | sha256sum --check
          tar -tzf "/tmp/${archive}"
          tar -xzf "/tmp/${archive}" -C /tmp
          bin=$(find /tmp -type f -name cargo-deny -print -quit)
          test -n "$bin"
          sudo install -m 0755 "$bin" /usr/local/bin/cargo-deny
          cargo deny --version
      - run: cargo deny check

  promtool:
    runs-on: cc-lb-500m
    steps:
      - uses: actions/checkout@v7
      - name: Ensure promtool is available
        run: |
          set -euo pipefail
          if command -v promtool >/dev/null 2>&1; then
            promtool --version
            exit 0
          fi
          curl -sSL -o /tmp/prometheus.tar.gz \
            https://github.com/prometheus/prometheus/releases/download/v3.13.2/prometheus-3.13.2.linux-arm64.tar.gz
          tar -xzf /tmp/prometheus.tar.gz -C /tmp/
          sudo mv /tmp/prometheus-3.13.2.linux-arm64/promtool /usr/local/bin/promtool
          promtool --version
      - name: Check alert rule syntax
        run: promtool check rules deploy/alerts/*.yml
      - name: Validate Grafana dashboards
        run: scripts/validate-grafana-dashboard.sh

  # A sharded, multi-node version of this job is prepared (inactive) in
  # coverage-sharded.yml — enable it once the ARC pool has more than one node.
  # See that file's header for the exact steps. Do not run both: they enforce
  # the same coverage gate.
  nextest-cov:
    runs-on: cc-lb-4
    container:
      image: ghcr.io/isac322/cc-lb-actions-runner:2.337.0-cclb-91f8035a0c5f@sha256:508df5d4504e09e2d560b61ef297e2fa77f5e671409c4d8214887a3d8e7327d0

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: cc_lb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # nextest-cov is the remaining 4-core job (clippy/e2e moved to cc-lb-2).
      # CARGO_BUILD_JOBS=4 matches the cc-lb-4 request. Dial back toward 2 if
      # postgres visibility tests start timing out under llvm-cov.
      CARGO_BUILD_JOBS: "4"
      # Coverage maps counters via embedded __llvm_covmap sections, not DWARF,
      # so debuginfo only bloats object size and slows linking here. Drop it
      # (test + dev profiles, overriding the runner's line-tables-only default)
      # to cut link time; the only cost is less precise test-failure backtraces.
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      # Raised 120 -> 240: nextest-cov runs the full --all-features workspace
      # suite under llvm-cov instrumentation on this 4-core, CARGO_BUILD_JOBS=4
      # self-hosted node. Contention there stalls Postgres's xmin snapshot
      # advancement (multi_instance_storage_tail's pg_snapshot_xmin visibility
      # check, runtime_change_notifier's LISTEN/NOTIFY round-trip), so tests
      # already scaled by this var still occasionally exceed 120s at full
      # instance-count parallelism — observed here and independently on
      # master (run 29223361998, a different test in the same category).
      # 240 keeps the same env-scale convention (0696a516, 4013d027) with
      # headroom for this runner's real contention envelope.
      CC_LB_TEST_READY_TIMEOUT_SECS: "240"
      CI_POSTGRES_URL: postgres://postgres:testpw@localhost:5432/cc_lb_test
      # Alias the same Postgres URL under DATABASE_URL and DATABASE_URL_TEST so
      # tests that check one of the latter env vars (cc-lb-scheduler integration
      # tests; cc-lb-storage-postgres migration_0037/0040 regression tests) run
      # instead of silently returning Ok(()) after an eprintln!("skip: ...").
      # Literal URL (not ${{ env.CI_POSTGRES_URL }}) — same-map GitHub Actions
      # env aliasing is not portable.
      DATABASE_URL: postgres://postgres:testpw@localhost:5432/cc_lb_test
      DATABASE_URL_TEST: postgres://postgres:testpw@localhost:5432/cc_lb_test
      # Force offline sqlx macro verification. apalis-sqlite ships SQLite-flavored
      # sqlx::query_file!() macros; with DATABASE_URL set to Postgres they would
      # try to prepare their SQLite SQL against Postgres and fail with
      # "relation \"jobs\" does not exist". Both apalis-sqlite and apalis-postgres
      # ship .sqlx/ offline caches in their crate sources so this always compiles.
      # This crate's own code uses no compile-time sqlx macros, only runtime
      # queries — so runtime DB access is unaffected.
      SQLX_OFFLINE: "true"

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rustup-home
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview
      - name: Install wasm targets for pinned toolchain
        run: rustup target add wasm32-wasip1 wasm32-unknown-unknown
      # Unlike clippy, coverage executes fixture-backed WASM tests, so retain
      # both targets installed above.
      - uses: ./.github/actions/setup-rust-cache
        with:
          stable-build-metadata: "true"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest,sqlx-cli

      - name: Preflight - CI_POSTGRES_URL must be set
        run: |
          if [ -z "${CI_POSTGRES_URL:-}" ]; then
            echo "CI_POSTGRES_URL is empty; postgres service container did not configure the env." >&2
            exit 1
          fi

      - name: Run Postgres migrations
        run: sqlx migrate run --source crates/cc-lb-storage-postgres/migrations
        env:
          DATABASE_URL: ${{ env.CI_POSTGRES_URL }}

      - name: Clean coverage artifacts
        run: cargo llvm-cov clean --workspace

      - name: Run tests with coverage instrumentation
        run: |
          cargo llvm-cov nextest \
            --workspace \
            --exclude cc-lb-loadgen \
            --exclude cc-lb-stress-suite \
            --all-features \
            --no-report

      - name: Generate workspace lcov report
        run: |
          cargo llvm-cov report \
            --lcov \
            --output-path target/coverage.lcov \
            --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'

      - name: Check per-package coverage gates
        run: scripts/coverage-gate.sh target/coverage.lcov

      - name: Show sccache stats
        if: always()
        run: |
          if [ -n "${SCCACHE_PATH:-}" ] && [ -x "$SCCACHE_PATH" ]; then
            "$SCCACHE_PATH" --show-stats
          elif command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task-43-coverage-lcov
          path: target/coverage.lcov
          if-no-files-found: error

  e2e:
    runs-on: cc-lb-2
    env:
      # Real-client E2E builds the server but does not run the fixture-backed
      # Wasmtime integration suite.
      CC_LB_SKIP_WASM_FIXTURE_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rustup-home
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # The self-hosted pool may schedule either an x86_64 or arm64 runner, and
      # these are native client binaries. Keep runner.arch in the key or a
      # cross-arch restore hands the matrix binaries it cannot execute.
      - name: Cache pinned real clients
        uses: actions/cache@v6
        with:
          path: target/test-bins
          key: real-client-test-bins-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/real-client/install.sh') }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: ./.github/actions/setup-rust-cache
        with:
          stable-build-metadata: "true"
      - name: Install pinned real clients
        run: tests/real-client/install.sh
      - name: Run real-client matrix
        run: tests/real-client/matrix.sh
      - name: Show sccache stats
        if: always()
        run: |
          if [ -n "${SCCACHE_PATH:-}" ] && [ -x "$SCCACHE_PATH" ]; then
            "$SCCACHE_PATH" --show-stats
          elif command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          fi
      - name: Upload real-client evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task-36-real-client-evidence
          path: .omo/evidence/task-36-*
          if-no-files-found: error
