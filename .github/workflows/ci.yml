name: ci

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CC_LB_ADMIN_SKIP_SPA: "1"

jobs:
  fmt:
    runs-on: oracle4-cc-lb
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: ripgrep
      - run: cargo fmt --check
      - name: Audit-redaction lint
        run: bash scripts/lint-audit-redaction.sh

  clippy:
    runs-on: oracle4-cc-lb
    strategy:
      matrix:
        features: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install wasm target for conformance fixtures
        run: rustup target add wasm32-unknown-unknown
      - uses: ./.github/actions/setup-rust-cache
      - run: cargo clippy --workspace --all-targets --no-default-features --features ${{ matrix.features }} -- -D warnings
      - name: Show sccache stats
        if: always()
        run: |
          if [ -n "${SCCACHE_PATH:-}" ] && [ -x "$SCCACHE_PATH" ]; then
            "$SCCACHE_PATH" --show-stats
          elif command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          fi

  cargo-deny:
    runs-on: oracle4-cc-lb
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  nextest-cov:
    runs-on: oracle4-cc-lb

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: cc_lb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CC_LB_TEST_READY_TIMEOUT_SECS: "120"
      CI_POSTGRES_URL: postgres://postgres:testpw@localhost:5432/cc_lb_test

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install wasm targets for pinned toolchain
        run: rustup target add wasm32-wasip1 wasm32-unknown-unknown
      # Registry-only: target/ must not be shared across branches. The
      # Swatinem cache key hashes Cargo.lock/Cargo.toml but not the test
      # file set, so a branch can otherwise leak its per-test binaries into
      # target/llvm-cov-target/debug/deps/ and cargo invokes them on restore
      # against a source tree that never contained those files.
      - uses: ./.github/actions/setup-rust-cache
        with:
          rust-cache-key: coverage
          cache-targets: false
          stable-build-metadata: "true"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest,sqlx-cli

      - name: Preflight - CI_POSTGRES_URL must be set
        run: |
          if [ -z "${CI_POSTGRES_URL:-}" ]; then
            echo "CI_POSTGRES_URL is empty; postgres service container did not configure the env." >&2
            exit 1
          fi

      - name: Run Postgres migrations
        run: sqlx migrate run --source crates/cc-lb-storage-postgres/migrations
        env:
          DATABASE_URL: ${{ env.CI_POSTGRES_URL }}

      - name: Clean coverage artifacts
        run: cargo llvm-cov clean --workspace

      - name: Run tests with coverage instrumentation
        run: |
          # principal_store_postgres tests rely on a hardcoded MIGRATIONS const
          # in crates/cc-lb-storage-conformance/src/principal_store.rs that omits
          # the plugin_chains_v2 migrations (0017, 0021, 0022, 0031, 0034, 0035),
          # so they panic with `relation "plugin_chains_v2" does not exist`.
          # postgres.yml previously avoided this by never running them; the
          # consolidated workspace coverage run does, exposing the latent gap.
          # Skip until the conformance fixture loads all migrations.
          cargo llvm-cov nextest \
            --workspace \
            --exclude cc-lb-loadgen \
            --all-features \
            --no-report \
            -E 'not test(/principal_store_postgres/)'

      - name: Generate workspace lcov report
        run: |
          cargo llvm-cov report \
            --lcov \
            --output-path target/coverage.lcov \
            --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'

      - name: Check per-package coverage gates
        run: |
          set -euo pipefail
          cargo llvm-cov report --package cc-lb-core                  --fail-under-lines 60 --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'
          cargo llvm-cov report --package cc-lb-dialect-anthropic     --fail-under-lines 80 --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'
          cargo llvm-cov report --package cc-lb-admin                 --fail-under-lines 60 --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'
          cargo llvm-cov report --package cc-lb-config                --fail-under-lines 60 --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'
          cargo llvm-cov report --package cc-lb-observability         --fail-under-lines 60 --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'
          cargo llvm-cov report --package cc-lb-plugin-api            --fail-under-lines 60 --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'
          cargo llvm-cov report --package cc-lb-signer-anthropic-key  --fail-under-lines 60 --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'
          cargo llvm-cov report --package cc-lb-signer-anthropic-oauth --fail-under-lines 60 --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'
          cargo llvm-cov report --package cc-lb-server                --fail-under-lines 60 --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'
          cargo llvm-cov report --package cc-lb-storage-sqlite        --fail-under-lines 60 --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'
          cargo llvm-cov report --package cc-lb-storage-postgres      --fail-under-lines 60 --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'
          cargo llvm-cov report --package cc-lb-scheduler             --fail-under-lines 60 --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'

      - name: Show sccache stats
        if: always()
        run: |
          if [ -n "${SCCACHE_PATH:-}" ] && [ -x "$SCCACHE_PATH" ]; then
            "$SCCACHE_PATH" --show-stats
          elif command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task-43-coverage-lcov
          path: target/coverage.lcov
          if-no-files-found: error

  e2e:
    runs-on: oracle4-cc-lb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Cache pinned real clients
        uses: actions/cache@v6
        with:
          path: target/test-bins
          key: real-client-test-bins-${{ runner.os }}-${{ hashFiles('tests/real-client/install.sh') }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-rust-cache
      - name: Install pinned real clients
        run: tests/real-client/install.sh
      - name: Run real-client matrix
        run: tests/real-client/matrix.sh
      - name: Show sccache stats
        if: always()
        run: |
          if [ -n "${SCCACHE_PATH:-}" ] && [ -x "$SCCACHE_PATH" ]; then
            "$SCCACHE_PATH" --show-stats
          elif command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          fi
      - name: Upload real-client evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task-36-real-client-evidence
          path: .omo/evidence/task-36-*
          if-no-files-found: error
