name: ci

# Pull requests always start this workflow, so the `CI gate` job reports on
# every pull request and the master ruleset can require it. A workflow-level
# `paths-ignore` on pull_request would skip the whole workflow for docs-only
# changes, leaving required checks pending forever. The `changes` job applies
# the same docs-only ignore list instead, and the code jobs skip when every
# changed file matches it. `CI gate` passes when each needed job succeeded, or
# was skipped for a reason its own `if:` gives (docs-only change, not a pull
# request, release-plz branch, non-release title), and fails otherwise.
#
# Pushes to master and manual dispatch behave as before: push keeps its
# `paths-ignore`, `changes` is skipped, and every code job runs.
on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CC_LB_ADMIN_SKIP_SPA: "1"

jobs:
  # `code` is false only when every changed file matches the docs-only ignore
  # list that `push.paths-ignore` uses. Code jobs run unless this job succeeded
  # with code=false, so a detection failure or runner-provisioning abandonment
  # safely falls back to running the full code suite.
  changes:
    name: Detect code changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      cov_cache_hit: ${{ steps.cov-lookup.outputs.hit == 'true' && 'true' || 'false' }}
    steps:
      - name: Filter changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if ! files=$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename'); then
            echo "::warning::gh api failed when listing PR files; falling back to code=true"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              *.md|docs/*|LICENSE|.gitignore|.editorconfig) ;;
              *)
                code=true
                break
                ;;
            esac
          done <<<"$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Fetch lockfiles for coverage cache lookup
        id: lockfiles
        if: steps.filter.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tools/workspace-hack
          fetch_raw() {
            local p=$1
            gh api "/repos/${GITHUB_REPOSITORY}/contents/${p}?ref=${GITHUB_SHA}" \
              -H "Accept: application/vnd.github.raw" > "$p"
          }
          rc=0
          fetch_raw Cargo.lock & p1=$!
          fetch_raw Cargo.toml & p2=$!
          fetch_raw tools/workspace-hack/Cargo.toml & p3=$!
          wait "$p1" || rc=1
          wait "$p2" || rc=1
          wait "$p3" || rc=1
          if [ "$rc" -ne 0 ] || [ ! -s Cargo.lock ] || [ ! -s Cargo.toml ] || [ ! -s tools/workspace-hack/Cargo.toml ]; then
            echo "::warning::failed to fetch lockfiles for cov cache lookup; falling back to seed-cov-cache"
            rm -f Cargo.lock Cargo.toml tools/workspace-hack/Cargo.toml
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Check whether coverage workspace cache exists for lock hash
        id: cov-lookup
        if: steps.lockfiles.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LOCK_HASH: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'tools/workspace-hack/Cargo.toml') }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          prefix="target-ws-v4-${RUNNER_OS}-${RUNNER_ARCH}-cov-1.99.1-${LOCK_HASH}-"
          if ! caches=$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/caches?key=${prefix}&per_page=100" 2>/dev/null); then
            echo "::warning::gh api actions/caches lookup failed; falling back to cov_cache_hit=false"
            echo "hit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hit=$(jq -sr \
            --arg cur "${GITHUB_REF}" \
            --arg pr_ref "refs/pull/${PR_NUMBER}/merge" \
            --arg base "refs/heads/${PR_BASE_REF}" \
            --arg master "refs/heads/master" \
            '[.[].actions_caches[]? | select(.ref == $cur or .ref == $pr_ref or ($base != "refs/heads/" and .ref == $base) or .ref == $master)] | if length > 0 then "true" else "false" end' \
            <<<"$caches")
          echo "hit=$hit" >> "$GITHUB_OUTPUT"

  fmt:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust-tools
        with:
          profile: fmt
      - run: cargo fmt --check
      - name: Audit-redaction lint
        run: bash scripts/lint-audit-redaction.sh
      - name: Integration-test consolidation guard
        run: bash scripts/check-integration-test-consolidation.sh
      - name: Validate coverage partitions, boundaries, and helpers
        run: |
          node scripts/check-cov-partitions.mjs
          node scripts/check-proxy-admin-boundary.mjs
          node scripts/check-hotpath-firewall.mjs
          node --test scripts/test-cov-partitions.mjs scripts/test-cov-feature-parity.mjs scripts/test-proxy-admin-boundary.mjs scripts/test-hotpath-firewall.mjs scripts/test-ws-mtimes.mjs scripts/test-prune-rust-target.mjs scripts/test-export-merged-lcov.mjs scripts/test-cd-deps-hash.mjs

  guard-crate-versions:
    name: guard crate versions
    needs:
      - changes
      - promtool
    # release-plz owns literal crate versions. A dedicated release PR may bump
    # the shared workspace version for cc-lb-server after strict validation.
    # release-plz's own PRs remain exempt.
    if: >-
      always() &&
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') &&
      needs.promtool.result != 'skipped' &&
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate managed crate version changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          base_tree="$RUNNER_TEMP/base"
          cleanup() {
            git worktree remove --force "$base_tree" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git worktree add --detach "$base_tree" "$BASE_SHA"

          args=(
            --base "$base_tree"
            --head .
            --pr-title "$PR_TITLE"
          )
          while IFS= read -r path; do
            args+=(--changed-file "$path")
          done < <(git diff --name-only "$BASE_SHA"...HEAD)
          while IFS= read -r tag; do
            args+=(--existing-tag "$tag")
          done < <(git tag --list 'cc-lb-v*')

          python3 scripts/check-crate-versions.py "${args[@]}"
      - name: Test managed version validator
        run: python3 scripts/test_check_crate_versions.py -v
      - name: Test chart metadata helper
        run: python3 scripts/test_chart_metadata.py -v
      - name: Test Docker release alias selection
        run: node --test scripts/test_release_aliases.mjs
      - name: Test client capture and coverage harness
        run: node --test tests/real-client/provider-e2e/client-harness/*.test.mjs tests/real-client/provider-e2e/codex169/*.test.mjs tests/real-client/provider-e2e/agy159/*.test.mjs
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: false
      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('tests/real-client/provider-e2e/client-harness/linux-helper/**') }}
      - name: Test isolated Linux replay helper
        run: GO111MODULE=off go test ./tests/real-client/provider-e2e/client-harness/linux-helper

  release-pr-artifacts:
    name: verify server release artifacts
    needs: guard-crate-versions
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.title, 'chore: release cc-lb v')
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: ./.github/actions/setup-rustup-home
      - name: Attach release-plz validation branch
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          git checkout -B release-plz-validation HEAD
          git branch --set-upstream-to="origin/$GITHUB_BASE_REF" release-plz-validation

      - uses: ./.github/actions/setup-actionlint

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Inspect release target
        id: release
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "cc-lb-server") | .version')
          rust_version=$(sed -n -E 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml)
          deps_hash=$(node scripts/cd-deps-hash.mjs)
          printf 'version=%s\ntarget_sha=%s\nbuild_time_epoch=%s\nrust_version=%s\ndeps_hash=%s\n' \
            "$version" "$(git rev-parse HEAD)" "$(git log -1 --format=%ct)" "$rust_version" "$deps_hash" \
            >> "$GITHUB_OUTPUT"

      # release-plz 0.3.172 supports git-only releases, but its release command
      # still filters out manifest-private packages before applying that mode.
      - name: Expose private server package to release-plz
        run: |
          set -euo pipefail
          manifest=crates/cc-lb-server/Cargo.toml
          backup="$RUNNER_TEMP/cc-lb-server-Cargo.toml"
          cp "$manifest" "$backup"
          if [ "$(grep -cx 'publish = false' "$manifest")" != "1" ]; then
            echo "::error::cc-lb-server publish=false marker not found exactly once"
            exit 1
          fi
          sed -i '/^publish = false$/d' "$manifest"


      - name: Install and dry-run release-plz server release
        uses: MarcoIeni/release-plz-action@v0.5.147
        with:
          command: release
          config: release-plz-server.toml
          version: 0.3.172
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Git-only dry-runs intentionally return releases=[].
      - name: Verify release-plz server selection
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          output=$(release-plz release \
            --dry-run \
            --config release-plz-server.toml \
            --repo-url "https://github.com/$GITHUB_REPOSITORY" \
            --forge github \
            -v 2>&1)
          printf '%s\n' "$output"
          grep -F "cc-lb-server $EXPECTED_VERSION:" <<< "$output"
          grep -F "creation of tag 'cc-lb-v$EXPECTED_VERSION'" <<< "$output"
          grep -F "creation of git release" <<< "$output"

      - name: Restore private server manifest
        if: always()
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/cc-lb-server-Cargo.toml"
          if [ -f "$backup" ]; then
            cp "$backup" crates/cc-lb-server/Cargo.toml
          fi
          git diff --exit-code -- crates/cc-lb-server/Cargo.toml


      - name: Setup Admin SPA dist
        uses: ./.github/actions/setup-admin-spa

      - name: Restore shared Cargo registry and git db
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-registry-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-v2-${{ runner.os }}-

      - name: Restore amd64 release Cargo deps cache
        uses: actions/cache/restore@v6
        with:
          path: target
          key: cd-deps-fat-v2-amd64-${{ steps.release.outputs.rust_version }}-${{ steps.release.outputs.deps_hash }}
          restore-keys: |
            cd-deps-fat-v2-amd64-${{ steps.release.outputs.rust_version }}-

      - name: Compile and package static amd64 release image
        env:
          TARGET_PLATFORM: linux/amd64
          OUT_BIN: ${{ runner.temp }}/stage-ctx/cc-lb
          CARGO_BUILD_JOBS: "4"
          GIT_SHA: ${{ steps.release.outputs.target_sha }}
          BUILD_TIME_EPOCH: ${{ steps.release.outputs.build_time_epoch }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/docker-build-musl.sh
          DOCKER_BUILDKIT=1 docker build \
            --file "${GITHUB_WORKSPACE}/Dockerfile" \
            --target distroless-prebuilt \
            --label "org.opencontainers.image.revision=${GIT_SHA}" \
            --tag "cc-lb:release-pr-smoke" \
            "${RUNNER_TEMP}/stage-ctx"
          out=$(docker run --rm "cc-lb:release-pr-smoke" --version)
          printf '%s\n' "$out"
          grep -Fq "$EXPECTED_VERSION" <<<"$out"
      - name: Lint and verify release chart
        env:
          SOURCE_SHA: ${{ steps.release.outputs.target_sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          chart_dir="$RUNNER_TEMP/cc-lb-release-chart"
          package_dir="$RUNNER_TEMP/cc-lb-release-package"
          command rm -rf "$chart_dir" "$package_dir"
          command cp -R deploy/helm/cc-lb "$chart_dir"
          mkdir -p "$package_dir/unpacked"
          python3 scripts/chart_metadata.py stamp \
            --chart "$chart_dir/Chart.yaml" \
            --revision "$SOURCE_SHA"
          helm lint "$chart_dir" \
            --set secrets.masterKey=ci-lint-placeholder \
            --set secrets.adminToken=ci-admin-placeholder
          helm package "$chart_dir" \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination "$package_dir"
          tar -xzf "$package_dir/cc-lb-$VERSION.tgz" \
            -C "$package_dir/unpacked"
          python3 scripts/chart_metadata.py verify \
            --chart "$package_dir/unpacked/cc-lb/Chart.yaml" \
            --version "$VERSION" \
            --revision "$SOURCE_SHA"

      - name: Lint release workflows
        run: >-
          actionlint
          .github/workflows/ci.yml
          .github/workflows/cd.yml
          .github/workflows/dev-image.yml
          .github/workflows/docker-build.yml
          .github/workflows/publish-chart.yml
          .github/workflows/release-server.yml
          .github/workflows/release-plz.yml

  clippy:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        features: [sqlite, postgres]
    env:
      # Clippy never runs fixture-backed WASM tests, so bypass that build-time
      # prerequisite. The workflow-level env already skips the admin SPA.
      CC_LB_SKIP_WASM_FIXTURE_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust-tools
        with:
          profile: clippy
      - uses: ./.github/actions/setup-rust-target-cache
        id: rust-cache
        with:
          cache-job-key: clippy-${{ matrix.features }}
          target-dir: target/debug
          stable-build-metadata: "true"
      - run: cargo clippy --workspace --all-targets --no-default-features --features ${{ matrix.features }} -- -D warnings
      - name: Save rolling Rust target cache
        uses: ./.github/actions/save-rust-target-cache
        with:
          target-dir: target/debug
          cache-paths: ${{ steps.rust-cache.outputs.cache-paths }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}
          lock-cache-hit: ${{ steps.rust-cache.outputs.lock-cache-hit }}
          target-cache-key: ${{ steps.rust-cache.outputs.target-cache-key }}
          keep-workspace-libs: "true"
          save-target: "true"
          force-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

  seed-cov-cache:
    needs: changes
    if: >-
      ${{
        !cancelled() &&
        (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') &&
        (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.cov_cache_hit != 'true')
      }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "4"
      CC_LB_SKIP_WASM_FIXTURE_BUILD: "1"
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Check whether coverage workspace cache exists for lock hash
        id: cov-lookup
        uses: actions/cache/restore@v6
        with:
          lookup-only: true
          path: target/llvm-cov-target/debug
          key: target-ws-v4-${{ runner.os }}-${{ runner.arch }}-cov-1.99.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'tools/workspace-hack/Cargo.toml') }}-exact
          restore-keys: |
            target-ws-v4-${{ runner.os }}-${{ runner.arch }}-cov-1.99.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'tools/workspace-hack/Cargo.toml') }}-
      - name: Decide whether coverage seed is required
        id: decide
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "need_seed=true" >> "$GITHUB_OUTPUT"
          elif [ -z "${{ steps.cov-lookup.outputs.cache-matched-key }}" ]; then
            echo "need_seed=true" >> "$GITHUB_OUTPUT"
          else
            echo "need_seed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup-rust-tools
        if: steps.decide.outputs.need_seed == 'true'
        with:
          profile: cov
      - uses: ./.github/actions/setup-rust-target-cache
        if: steps.decide.outputs.need_seed == 'true'
        id: rust-cache
        with:
          cache-job-key: cov
          target-dir: target/llvm-cov-target/debug
          stable-build-metadata: "true"
      - name: Build instrumented workspace coverage binaries
        if: steps.decide.outputs.need_seed == 'true'
        run: |
          set -euo pipefail
          eval "$(cargo llvm-cov show-env --sh)"
          export CARGO_TARGET_DIR="$PWD/target/llvm-cov-target"
          cargo nextest run --no-run --workspace --exclude cc-lb-loadgen --exclude cc-lb-stress-suite --all-features
      - name: Save rolling coverage workspace cache
        if: steps.decide.outputs.need_seed == 'true'
        uses: ./.github/actions/save-rust-target-cache
        with:
          target-dir: target/llvm-cov-target/debug
          cache-paths: ${{ steps.rust-cache.outputs.cache-paths }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}
          lock-cache-hit: ${{ steps.rust-cache.outputs.lock-cache-hit }}
          target-cache-key: ${{ steps.rust-cache.outputs.target-cache-key }}
          keep-workspace-libs: "true"
          save-target: "true"
          force-save: "true"

  cargo-deny:
    needs:
      - changes
      - promtool
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') && needs.promtool.result != 'skipped' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust-tools
        with:
          profile: deny
      - run: cargo deny check

  promtool:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install promtool
        uses: ./.github/actions/setup-promtool
        with:
          version: 3.15.0
      - name: Check alert rule syntax
        run: promtool check rules deploy/alerts/*.yml
      - name: Validate Grafana dashboards
        run: scripts/validate-grafana-dashboard.sh

  nextest-cov-part:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: server-lib
            needs_postgres: true
            seed_sched_template: true
            needs_wasm: false
          - partition: server-integ-1
            needs_postgres: true
            seed_sched_template: true
            needs_wasm: true
          - partition: server-integ-2
            needs_postgres: true
            seed_sched_template: true
            needs_wasm: true
          - partition: engine-lib
            needs_postgres: false
            seed_sched_template: false
            needs_wasm: false
          - partition: engine-integ
            needs_postgres: true
            seed_sched_template: false
            needs_wasm: false
          - partition: admin
            needs_postgres: true
            seed_sched_template: true
            needs_wasm: false
          - partition: storage-postgres
            needs_postgres: true
            seed_sched_template: false
            needs_wasm: false
          - partition: storage-conformance-sqlite
            needs_postgres: true
            seed_sched_template: false
            needs_wasm: false
          - partition: sched-ext-integ
            needs_postgres: true
            seed_sched_template: true
            needs_wasm: true
          - partition: wasm-and-rest
            needs_postgres: false
            seed_sched_template: false
            needs_wasm: true
    env:
      CARGO_BUILD_JOBS: "4"
      CC_LB_SKIP_WASM_FIXTURE_BUILD: "1"
      CC_LB_TEST_READY_TIMEOUT_SECS: "240"
      SQLX_OFFLINE: "true"
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          code=false
          page=1
          while :; do
            if ! resp=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100&page=${page}" 2>/dev/null); then
              echo "::warning::gh api failed when listing PR files; falling back to code=true"
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            count=$(jq 'length' <<<"$resp")
            if [ "$count" -eq 0 ]; then
              break
            fi
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              case "$path" in
                *.md|docs/*|LICENSE|.gitignore|.editorconfig) ;;
                *)
                  code=true
                  break 2
                  ;;
              esac
            done < <(jq -r '.[].filename' <<<"$resp")
            if [ "$count" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.filter.outputs.code != 'false'
      - uses: ./.github/actions/setup-rust-tools
        if: steps.filter.outputs.code != 'false'
        with:
          profile: cov
          save-caches: "false"
      - uses: ./.github/actions/setup-rust-target-cache
        if: steps.filter.outputs.code != 'false'
        id: rust-cache
        with:
          cache-job-key: cov
          target-dir: target/llvm-cov-target/debug
          stable-build-metadata: "true"
          save-caches: "false"
      - uses: ./.github/actions/setup-wasm-fixtures
        if: ${{ steps.filter.outputs.code != 'false' && matrix.needs_wasm }}
        with:
          save-caches: "false"
      - uses: ./.github/actions/start-native-postgres
        if: ${{ steps.filter.outputs.code != 'false' && matrix.needs_postgres }}
        with:
          async: "true"
          seed-sched-template: "${{ matrix.seed_sched_template }}"
      - name: Run coverage partition ${{ matrix.partition }}
        if: steps.filter.outputs.code != 'false'
        run: node scripts/run-cov-partition.mjs "${{ matrix.partition }}"
      - uses: actions/upload-artifact@v7
        if: steps.filter.outputs.code != 'false'
        with:
          name: coverage-part-${{ matrix.partition }}
          path: target/cov-part-${{ matrix.partition }}.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  typestate-contracts:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "4"
      CC_LB_SKIP_WASM_FIXTURE_BUILD: "1"
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust-tools
        with:
          profile: cov
      - uses: ./.github/actions/setup-rust-target-cache
        id: rust-cache
        with:
          cache-job-key: trybuild
          target-dir: target/debug
          extra-cache-paths: target/tests/trybuild
          stable-build-metadata: "true"
      - name: Fetch locked dependencies for host target
        run: cargo fetch --locked --target x86_64-unknown-linux-gnu
      - name: Verify coverage partition feature parity against seed-cov-cache
        run: node scripts/check-cov-feature-parity.mjs --target x86_64-unknown-linux-gnu
      - name: Run compile-fail contract tests
        run: |
          set -euo pipefail
          unset RUSTFLAGS
          CC_LB_TRYBUILD_UNIFIED=1
          CARGO_ENCODED_RUSTFLAGS="$(printf '%s\x1f%s\x1f%s\x1f%s\x1f%s\x1f%s' --cfg trybuild --verbose -A dead_code --diagnostic-width=140)"
          export CC_LB_TRYBUILD_UNIFIED CARGO_ENCODED_RUSTFLAGS
          cargo test \
            -p cc-lb-engine \
            --test typestate_contracts \
            --all-features \
            -- --exact authn_rail_trybuild::authn_rail_typestate_contracts --nocapture
      - name: Run standalone split-proxy integration tests with admin disabled
        run: cargo nextest run --locked -p cc-lb-proxy --no-default-features --features sqlite,postgres --test integration
      - name: Save rolling trybuild cache
        uses: ./.github/actions/save-rust-target-cache
        with:
          target-dir: target/debug
          extra-cache-paths: target/tests/trybuild
          cache-paths: ${{ steps.rust-cache.outputs.cache-paths }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}
          lock-cache-hit: ${{ steps.rust-cache.outputs.lock-cache-hit }}
          target-cache-key: ${{ steps.rust-cache.outputs.target-cache-key }}
          keep-workspace-libs: "true"
          save-target: "true"
          force-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

  nextest-cov:
    name: nextest-cov
    needs:
      - changes
      - nextest-cov-part
    if: >-
      ${{
        !cancelled() &&
        needs.nextest-cov-part.result == 'success' &&
        needs.nextest-cov-part.outputs.code != 'false' &&
        (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
      }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Fetch coverage merge scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p scripts .github/ci
          fetch_raw() {
            local p=$1
            gh api "/repos/${GITHUB_REPOSITORY}/contents/${p}?ref=${GITHUB_SHA}" \
              -H "Accept: application/vnd.github.raw" > "$p"
          }
          rc=0
          fetch_raw scripts/export-merged-lcov.mjs & p1=$!
          fetch_raw scripts/coverage-gate.sh & p2=$!
          fetch_raw .github/ci/cov-partitions.json & p3=$!
          wait "$p1" || rc=1
          wait "$p2" || rc=1
          wait "$p3" || rc=1
          [ "$rc" -eq 0 ]
          chmod +x scripts/coverage-gate.sh
      - name: Restore lightweight LLVM coverage binaries
        id: llvm-bins-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.local/llvm-cov-bins
          key: llvm-cov-bins-v1-${{ runner.os }}-${{ runner.arch }}-1.99.1
      - name: Verify lightweight LLVM coverage binaries
        id: llvm-check
        run: |
          set -euo pipefail
          bin_dir="$HOME/.local/llvm-cov-bins"
          if [ -x "$bin_dir/llvm-profdata" ] && [ -x "$bin_dir/llvm-cov" ] && \
             "$bin_dir/llvm-profdata" --version >/dev/null 2>&1 && \
             "$bin_dir/llvm-cov" --version >/dev/null 2>&1; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
      # This job skips the full checkout, so a cache miss must fetch the
      # local action before using it. Check out into a subdirectory: a
      # workspace-root checkout would delete the merge scripts fetched above.
      - uses: actions/checkout@v7
        if: steps.llvm-check.outputs.hit != 'true'
        with:
          path: .ci-actions
          sparse-checkout: .github/actions
      - uses: ./.ci-actions/.github/actions/setup-rust-tools
        if: steps.llvm-check.outputs.hit != 'true'
        with:
          profile: cov
      - name: Stage lightweight LLVM coverage binaries
        if: steps.llvm-check.outputs.hit != 'true'
        run: |
          set -euo pipefail
          sysroot="$(rustc --print sysroot)"
          sysroot_real="$(realpath "$sysroot")"
          host="$(rustc -vV | awk '/^host:/ { print $2 }')"
          llvm_bin="$sysroot/lib/rustlib/$host/bin"
          out_dir="$HOME/.local/llvm-cov-bins"
          rm -rf "$out_dir"
          mkdir -p "$out_dir/bin" "$out_dir/lib"
          cp -L "$llvm_bin/llvm-profdata" "$llvm_bin/llvm-cov" "$out_dir/bin/"
          for tool in llvm-profdata llvm-cov; do
            while IFS= read -r lib_path; do
              [ -n "$lib_path" ] || continue
              real_lib="$(realpath "$lib_path")"
              case "$real_lib" in
                "$sysroot"/*|"$sysroot_real"/*)
                  base="$(basename "$lib_path")"
                  [ -e "$out_dir/lib/$base" ] || cp -L "$lib_path" "$out_dir/lib/$base"
                  ;;
              esac
            done < <(ldd "$llvm_bin/$tool" | awk '/=> \// { print $3 }')
            cat > "$out_dir/$tool" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          export LD_LIBRARY_PATH="\$HOME/.local/llvm-cov-bins/lib\${LD_LIBRARY_PATH:+:\$LD_LIBRARY_PATH}"
          exec "\$HOME/.local/llvm-cov-bins/bin/$tool" "\$@"
          EOF
            chmod +x "$out_dir/$tool"
          done
          "$out_dir/llvm-profdata" --version
          "$out_dir/llvm-cov" --version
      - name: Save lightweight LLVM coverage binaries
        if: steps.llvm-check.outputs.hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.local/llvm-cov-bins
          key: llvm-cov-bins-v1-${{ runner.os }}-${{ runner.arch }}-1.99.1
      - name: Export LLVM coverage tool paths
        run: |
          set -euo pipefail
          echo "LLVM_PROFDATA=$HOME/.local/llvm-cov-bins/llvm-profdata" >> "$GITHUB_ENV"
          echo "LLVM_COV=$HOME/.local/llvm-cov-bins/llvm-cov" >> "$GITHUB_ENV"
      - name: Download partition coverage archives
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-part-*
          path: target/cov-parts
          merge-multiple: true
      - name: Merge LLVM profile data, export LCOV, and check per-package coverage gates
        run: |
          set -euo pipefail
          mapfile -t partitions < <(jq -r '.partitions[].name' .github/ci/cov-partitions.json)
          if [ "${#partitions[@]}" -eq 0 ]; then
            echo "::error::no partitions found in .github/ci/cov-partitions.json" >&2
            exit 1
          fi
          for name in "${partitions[@]}"; do
            archive="target/cov-parts/cov-part-${name}.tar.zst"
            if [ ! -s "$archive" ]; then
              echo "::error::missing or empty partition archive: $archive" >&2
              exit 1
            fi
          done
          node scripts/export-merged-lcov.mjs target/cov-parts target/coverage.lcov
          scripts/coverage-gate.sh target/coverage.lcov
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov-merged
          path: target/coverage.lcov
          compression-level: 1
          if-no-files-found: error
          retention-days: 1

  e2e:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-26.04
    env:
      # Real-client E2E builds the server with wasm fixture build skipped; prebuilt
      # wasm fixtures for plugin-slots are restored via setup-wasm-fixtures.
      CC_LB_SKIP_WASM_FIXTURE_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust-tools
        with:
          profile: e2e
      - uses: ./.github/actions/setup-rust-target-cache
        id: rust-cache
        with:
          cache-job-key: std
          target-dir: target/debug
          stable-build-metadata: "true"
      - uses: ./.github/actions/setup-wasm-fixtures
      - name: Cache installed real-client CLIs
        uses: actions/cache@v6
        with:
          path: target/test-bins
          key: real-client-bins-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/real-client/install.sh') }}
      - name: Run real-client matrix and plugin-slots suites in parallel
        run: |
          set -euo pipefail
          mkdir -p /dev/shm/cc-lb-tmp
          "$PWD/tests/real-client/install.sh" > "$RUNNER_TEMP/real-client-install.log" 2>&1 &
          pid_install=$!
          cargo build --locked -p cc-lb-server -p fake-anthropic
          if ! wait "$pid_install"; then
            cat "$RUNNER_TEMP/real-client-install.log" >&2 || true
            exit 1
          fi

          {
            IFS= read -r matrix_ports
            IFS= read -r slots_ports
            IFS= read -r lifecycle_ports
          } < <(python3 - <<'PY'
          import random, socket
          needed = 45 + 3 + 9
          socks = []
          start = random.randrange(12000)
          try:
              for step in range(12000):
                  if len(socks) >= needed:
                      break
                  candidate = 20000 + ((start + step) % 12000)
                  s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  try:
                      s.bind(('127.0.0.1', candidate))
                      socks.append(s)
                  except OSError:
                      s.close()
              while len(socks) < needed:
                  s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  s.bind(('127.0.0.1', 0))
                  socks.append(s)
              ports = [str(s.getsockname()[1]) for s in socks]
          finally:
              for s in socks:
                  s.close()
          matrix = ";".join(" ".join(ports[i:i + 5]) for i in range(0, 45, 5))
          print(matrix)
          print(" ".join(ports[45:48]))
          print(" ".join(ports[48:57]))
          PY
          )

          CC_LB_MATRIX_PORTS="$matrix_ports" \
          TMPDIR=/dev/shm/cc-lb-tmp REAL_CLIENT_SKIP_BUILD=1 REAL_CLIENT_SKIP_INSTALL=1 REAL_CLIENT_JOBS=6 \
            tests/real-client/matrix.sh &
          pid_matrix=$!

          CC_LB_BIN="$PWD/target/debug/cc-lb" \
          CC_LB_PLUGIN_WASM="$PWD/target/wasm32-unknown-unknown/release/wasmtime_dual_slot.wasm" \
          CC_LB_QA_OUTPUT="$PWD/target/test-evidence/real-client/plugin-slots" \
          CC_LB_QA_LEDGER="$RUNNER_TEMP/plugin-slots.ledger" \
          CC_LB_PLUGIN_SLOTS_PORTS="$slots_ports" \
            node tests/real-client/provider-e2e/plugin-slots.mjs &
          pid_slots=$!

          CC_LB_BIN="$PWD/target/debug/cc-lb" \
          CC_LB_PLUGIN_WASM="$PWD/target/wasm32-unknown-unknown/release/wasmtime_dual_slot.wasm" \
          CC_LB_QA_OUTPUT="$PWD/target/test-evidence/real-client/plugin-slots-lifecycle" \
          CC_LB_QA_LEDGER="$RUNNER_TEMP/plugin-slots-lifecycle.ledger" \
          CC_LB_PLUGIN_SLOTS_LIFECYCLE_PORTS="$lifecycle_ports" \
            node --test tests/real-client/provider-e2e/plugin-slots.lifecycle.test.mjs &
          pid_lifecycle=$!

          rc=0
          wait "$pid_matrix" || rc=1
          wait "$pid_slots" || rc=1
          wait "$pid_lifecycle" || rc=1
          exit "$rc"
      - name: Save rolling Rust target cache
        uses: ./.github/actions/save-rust-target-cache
        with:
          target-dir: target/debug
          cache-paths: ${{ steps.rust-cache.outputs.cache-paths }}
          target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}
          lock-cache-hit: ${{ steps.rust-cache.outputs.lock-cache-hit }}
          target-cache-key: ${{ steps.rust-cache.outputs.target-cache-key }}
          keep-workspace-libs: "true"
          save-target: "true"
          force-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - name: Upload real-client evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-client-evidence
          path: target/test-evidence/real-client
          retention-days: 7
          if-no-files-found: error

  gate:
    name: CI gate
    needs:
      - changes
      - fmt
      - guard-crate-versions
      - release-pr-artifacts
      - clippy
      - seed-cov-cache
      - cargo-deny
      - promtool
      - nextest-cov-part
      - typestate-contracts
      - nextest-cov
      - e2e
    if: ${{ always() }}
    runs-on: ubuntu-slim
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        # JOBS must list exactly the job ids in `needs` above. A job missing
        # from the needs context, or a context that is not a JSON object,
        # fails the gate.
        #
        # A job passes on success. It passes on skipped only when its own `if:`
        # explains the skip; keep skip_ok in sync with those conditions. A run
        # cancelled after `changes` but before the code jobs start skips them
        # all, and this gate may still start afterwards with cancelled() false,
        # so `skipped` alone must never pass. startsWith() in expressions is
        # case-insensitive, so its two mirrors compare lowercased values.
        run: |
          set -euo pipefail
          JOBS=(changes fmt guard-crate-versions release-pr-artifacts clippy
            seed-cov-cache cargo-deny promtool nextest-cov-part typestate-contracts nextest-cov e2e)
          if ! jq -e --args 'type == "object" and (keys == ($ARGS.positional | sort))' \
            "${JOBS[@]}" <<<"$RESULTS" >/dev/null; then
            echo "::error::needs context does not match the expected jobs: ${JOBS[*]}"
            exit 1
          fi
          result_of() {
            jq -er --arg job "$1" '.[$job].result // "missing"' <<<"$RESULTS"
          }
          changes=$(result_of changes)
          code=$(jq -er '.changes.outputs.code // ""' <<<"$RESULTS")
          cov_cache_hit=$(jq -er '.changes.outputs.cov_cache_hit // ""' <<<"$RESULTS")
          is_pr=false
          [[ $EVENT_NAME == pull_request ]] && is_pr=true
          # Code jobs skip only when change detection succeeded and found no
          # code change.
          docs_only=false
          [[ $changes == success && $code != true ]] && docs_only=true
          guard_skip_ok=false
          if $docs_only || ! $is_pr || [[ ${HEAD_REF,,} == "release-plz-"* ]]; then
            guard_skip_ok=true
          fi
          skip_ok() {
            case "$1" in
              changes) ! $is_pr ;;
              nextest-cov-part) false ;;
              guard-crate-versions) $guard_skip_ok ;;
              seed-cov-cache) $docs_only || { $is_pr && [[ $changes == success && $code == true && $cov_cache_hit == true ]]; } ;;
              release-pr-artifacts)
                # Its own `if:`, or a legitimately skipped guard it needs.
                ! $is_pr || [[ ${PR_TITLE,,} != "chore: release cc-lb v"* ]] ||
                  { [[ $(result_of guard-crate-versions) == skipped ]] && $guard_skip_ok; } ;;
              *) $docs_only ;;
            esac
          }
          rc=0
          for job in "${JOBS[@]}"; do
            result=$(result_of "$job")
            echo "$job: $result"
            case "$result" in
              success) ;;
              skipped)
                if ! skip_ok "$job"; then
                  echo "::error::$job: skipped without a matching condition (run cancelled?)"
                  rc=1
                fi
                ;;
              abandoned)
                # When GitHub Actions abandons `changes` during third-party
                # action preparation, `docs_only` is false so every code job
                # below is required to run and succeed.
                if [[ $job == changes ]] && ! $docs_only; then
                  echo "::warning::changes: abandoned (fell back to running full code suite)"
                else
                  echo "::error::$job: $result"
                  rc=1
                fi
                ;;
              *) echo "::error::$job: $result"; rc=1 ;;
            esac
          done
          exit "$rc"

  prune-master-caches:
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs:
      - seed-cov-cache
      - clippy
      - e2e
      - typestate-contracts
    runs-on: ubuntu-slim
    permissions:
      actions: write
    timeout-minutes: 5
    steps:
      - name: Prune superseded master Rust target caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          caches_json=$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/caches?ref=refs/heads/master&per_page=100" --jq '.actions_caches[]') || {
            echo "::warning::failed to query master caches; skipping prune"
            exit 0
          }
          [ -n "$caches_json" ] || exit 0
          old_ids=$(jq -sr '
            [ .[] | select(.key | startswith("target-ws-v4-")) ]
            | map(. + {prefix: (.key | capture("^(?<p>target-ws-v4-.+?-[0-9]+\\.[0-9]+\\.[0-9]+-)").p)})
            | group_by(.prefix)
            | map(sort_by(.created_at) | reverse | .[1:][] | .id)
            | .[]
          ' <<<"$caches_json") || true
          for id in $old_ids; do
            gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches/${id}" >/dev/null || \
              echo "::warning::failed to delete superseded cache ${id}"
          done
