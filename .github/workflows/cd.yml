name: publish-docker

# Publish the immutable exact version first. Stable moving aliases are updated
# only when this version is the newest published stable server Release for the
# alias prefix. Prereleases never move aliases, and `latest` is never published.

on:
  workflow_call:
    inputs:
      version:
        description: 'Semver to publish without a leading v'
        required: true
        type: string
      source_ref:
        description: 'Immutable cc-lb source tag to build'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver to publish without a leading v'
        required: true
        type: string
      source_ref:
        description: 'Immutable cc-lb source tag to build'
        required: true
        type: string

concurrency:
  group: publish-docker-${{ inputs.version }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: build & push image
    # Runs in-cluster so the build can reach the garage-S3 sccache warmed by
    # Docker PR builds. The runner pool may schedule either x86_64 or arm64;
    # the source Dockerfile isolates host-only Cargo configuration and xx
    # cross-compiles all four target architectures with no QEMU.
    runs-on: oracle4-cc-lb-500m
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Resolve source revision
        id: source
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Validate version and source ref
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [ "$SOURCE_REF" != "cc-lb-v$VERSION" ]; then
            echo "::error::source_ref '$SOURCE_REF' must equal cc-lb-v$VERSION"
            exit 1
          fi
          actual_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$actual_version" != "$VERSION" ]; then
            echo "::error::checked-out server version '$actual_version' does not match '$VERSION'"
            exit 1
          fi

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkit.arc-systems.svc.cluster.local:1234

      - name: Inspect existing exact image
        id: existing
        env:
          IMAGE: ghcr.io/isac322/cc-lb
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          error_file="$RUNNER_TEMP/image-inspect-error"
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>"$error_file"; then
            revision=$(docker buildx imagetools inspect "$IMAGE:$VERSION" \
              --format '{{index .Image.Config.Labels "org.opencontainers.image.revision"}}')
            if [ "$revision" != "$SOURCE_SHA" ]; then
              echo "::error::existing $IMAGE:$VERSION points to revision '$revision', expected '$SOURCE_SHA'"
              exit 1
            fi
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'not found|manifest unknown' "$error_file"; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            command cat "$error_file" >&2
            echo "::error::could not determine whether $IMAGE:$VERSION exists"
            exit 1
          fi

      - name: Derive exact tag and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/isac322/cc-lb
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}


      - name: Build and push exact image
        if: steps.existing.outputs.already_published != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.source.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            SCCACHE_BUCKET=sccache
            SCCACHE_ENDPOINT=http://garage.arc-systems.svc.cluster.local:3900
            SCCACHE_REGION=garage
            SCCACHE_S3_USE_SSL=false
            REQUIRE_SCCACHE=1
            SCCACHE_S3_KEY_PREFIX=cc-lb
          secret-envs: |
            AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY

      - name: Smoke-test binary version
        if: steps.existing.outputs.already_published != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: smoke
          outputs: type=cacheonly
          platforms: linux/arm64
          provenance: false
          build-args: |
            GIT_SHA=${{ steps.source.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            EXPECTED_VERSION=${{ inputs.version }}
            SCCACHE_BUCKET=sccache
            SCCACHE_ENDPOINT=http://garage.arc-systems.svc.cluster.local:3900
            SCCACHE_REGION=garage
            SCCACHE_S3_USE_SSL=false
            REQUIRE_SCCACHE=1
            SCCACHE_S3_KEY_PREFIX=cc-lb
          secret-envs: |
            AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY

      - name: Select moving aliases
        id: aliases
        uses: actions/github-script@v9
        env:
          VERSION: ${{ inputs.version }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const moduleUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/release_aliases.mjs`,
            );
            const { releaseAliases } = await import(moduleUrl.href);

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );
            const publishedTags = releases
              .filter((release) => !release.draft && !release.prerelease)
              .map((release) => release.tag_name);
            core.setOutput(
              'aliases',
              releaseAliases(process.env.VERSION, publishedTags).join(' '),
            );

      - name: Reconcile moving aliases
        if: steps.aliases.outputs.aliases != ''
        env:
          ALIASES: ${{ steps.aliases.outputs.aliases }}
          IMAGE: ghcr.io/isac322/cc-lb
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          args=()
          for alias in $ALIASES; do
            args+=(--tag "$IMAGE:$alias")
          done
          docker buildx imagetools create "${args[@]}" "$IMAGE:$VERSION"

      - name: Verify published image tags
        env:
          ALIASES: ${{ steps.aliases.outputs.aliases }}
          IMAGE: ghcr.io/isac322/cc-lb
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          tags=("$VERSION")
          for alias in $ALIASES; do
            tags+=("$alias")
          done
          for tag in "${tags[@]}"; do
            revision=$(docker buildx imagetools inspect "$IMAGE:$tag" \
              --format '{{index .Image.Config.Labels "org.opencontainers.image.revision"}}')
            if [ "$revision" != "$SOURCE_SHA" ]; then
              echo "::error::$IMAGE:$tag revision '$revision' does not match '$SOURCE_SHA'"
              exit 1
            fi
          done
