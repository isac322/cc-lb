name: publish-docker

# Publish the immutable exact version first. Stable moving aliases are updated
# only when this version is the newest published stable server Release for the
# alias prefix. Prereleases never move aliases, and `latest` is never published.

on:
  workflow_call:
    inputs:
      version:
        description: 'Semver to publish without a leading v'
        required: true
        type: string
      source_ref:
        description: 'Immutable cc-lb source tag to build'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver to publish without a leading v'
        required: true
        type: string
      source_ref:
        description: 'Immutable cc-lb source tag to build (or "dry-run" for no-push CI benchmark)'
        required: true
        type: string

concurrency:
  group: publish-docker-${{ inputs.version }}-${{ inputs.source_ref == 'dry-run' && github.ref || 'release' }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: validate & inspect release image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      source_date_epoch: ${{ steps.source.outputs.source_date_epoch }}
      rust_version: ${{ steps.source.outputs.rust_version }}
      lock_hash: ${{ steps.source.outputs.lock_hash }}
      already_published: ${{ steps.existing.outputs.already_published }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      - name: Determine execution mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$SOURCE_REF" = "dry-run" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.source_ref == 'dry-run') && github.sha || inputs.source_ref }}
          persist-credentials: false

      - name: Prepare image revision verifier
        if: steps.mode.outputs.dry_run != 'true'
        run: |
          cat > "$RUNNER_TEMP/verify-image-revision.sh" <<'VERIFY_IMAGE_REVISION'
          #!/usr/bin/env bash
          set -euo pipefail

          if [ "$#" -lt 2 ]; then
            echo "::error::usage: $0 EXPECTED_REVISION IMAGE [IMAGE...]" >&2
            exit 2
          fi

          expected_revision=$1
          shift

          declare -A verified_revisions=()
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          raw_file="$temp_dir/manifest.json"

          verify_revision() {
            local ref=$1
            local labels revision

            if [[ -v 'verified_revisions[$ref]' ]]; then
              return
            fi

            if ! labels=$(docker buildx imagetools inspect "$ref" \
                --format '{{json .Image.Config.Labels}}'); then
              echo "::error::could not inspect image config for $ref" >&2
              exit 1
            fi
            revision=$(jq -r '."org.opencontainers.image.revision" // empty' <<<"$labels")
            if [ "$revision" != "$expected_revision" ]; then
              echo "::error::image $ref revision '$revision' does not match '$expected_revision'" >&2
              exit 1
            fi

            verified_revisions["$ref"]=$revision
          }

          for image in "$@"; do
            if ! docker buildx imagetools inspect "$image" --raw > "$raw_file"; then
              echo "::error::could not inspect image $image" >&2
              exit 1
            fi

            repository=${image%%@*}
            last_component=${repository##*/}
            if [[ "$last_component" == *:* ]]; then
              repository=${repository%:*}
            fi

            refs=()
            if jq -e 'has("manifests")' "$raw_file" > /dev/null; then
              platforms=$(
                jq -r '
                  [
                    .manifests[]
                    | select(.platform.os != "unknown")
                    | .platform
                    | if .variant and ((.os + "/" + .architecture) != "linux/arm64" or .variant != "v8")
                      then .os + "/" + .architecture + "/" + .variant
                      else .os + "/" + .architecture
                      end
                  ]
                  | sort
                  | join(" ")
                ' "$raw_file"
              )
              if [ "$platforms" != "linux/amd64 linux/arm/v7 linux/arm64 linux/ppc64le" ]; then
                echo "::error::image $image has runnable platforms '$platforms', expected 'linux/amd64 linux/arm/v7 linux/arm64 linux/ppc64le'" >&2
                exit 1
              fi
              digests=()
              while IFS= read -r digest; do
                if [ -n "$digest" ]; then
                  digests+=("$digest")
                fi
              done < <(
                jq -r '
                  .manifests[]
                  | select(.platform.os != "unknown")
                  | .digest
                ' "$raw_file"
              )
              for digest in "${digests[@]}"; do
                refs+=("$repository@$digest")
              done
            else
              manifest_digest=$(sha256sum "$raw_file")
              manifest_digest=${manifest_digest%% *}
              refs+=("$repository@sha256:$manifest_digest")
            fi

            for ref in "${refs[@]}"; do
              verify_revision "$ref"
            done

            printf 'verified %s platform manifest(s) for %s at revision %s\n' \
              "${#refs[@]}" "$image" "$expected_revision"
          done
          VERIFY_IMAGE_REVISION
          chmod 0755 "$RUNNER_TEMP/verify-image-revision.sh"

      - name: Resolve source revision
        id: source
        env:
          LOCK_HASH: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
        run: |
          set -euo pipefail
          rust_version=$(sed -n -E 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml)
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "source_date_epoch=$(git log -1 --format=%ct)"
            echo "rust_version=$rust_version"
            echo "lock_hash=$LOCK_HASH"
          } >> "$GITHUB_OUTPUT"

      - name: Validate version and source ref
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ inputs.source_ref }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" != "true" ] && [ "$SOURCE_REF" != "cc-lb-v$VERSION" ]; then
            echo "::error::source_ref '$SOURCE_REF' must equal cc-lb-v$VERSION"
            exit 1
          fi
          actual_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$actual_version" != "$VERSION" ]; then
            echo "::error::checked-out server version '$actual_version' does not match '$VERSION'"
            exit 1
          fi

      - name: Log in to ghcr.io
        if: steps.mode.outputs.dry_run != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect existing exact image
        id: existing
        env:
          IMAGE: ghcr.io/isac322/cc-lb
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          error_file="$RUNNER_TEMP/image-inspect-error"
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>"$error_file"; then
            "$RUNNER_TEMP/verify-image-revision.sh" "$SOURCE_SHA" "$IMAGE:$VERSION"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'not found|manifest unknown' "$error_file"; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            command cat "$error_file" >&2
            echo "::error::could not determine whether $IMAGE:$VERSION exists"
            exit 1
          fi

      - name: Build Admin SPA once for all targets
        if: steps.existing.outputs.already_published != 'true'
        uses: ./.github/actions/setup-admin-spa

      - name: Upload Admin SPA dist artifact
        if: steps.existing.outputs.already_published != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: admin-spa-dist
          path: crates/cc-lb-admin/web/dist
          retention-days: 1
          if-no-files-found: error

  build:
    name: build & push digest (${{ matrix.key }})
    needs: prepare
    if: needs.prepare.outputs.already_published != 'true'
    # Fat LTO + CGU=1 is single-threaded; x86_64 outperforms ARM64 by ~1.4-1.6x.
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: amd64
            platform: linux/amd64
            smoke: true
          - key: arm64
            platform: linux/arm64
            smoke: false
          - key: armv7
            platform: linux/arm/v7
            smoke: false
          - key: ppc64le
            platform: linux/ppc64le
            smoke: false
    env:
      DOCKER_BUILD_RECORD_RETENTION_DAYS: "7"
      CACHE_PREFIX: cd-deps-fat-v1-${{ needs.prepare.outputs.dry_run == 'true' && 'dryrun-' || '' }}${{ matrix.key }}-${{ needs.prepare.outputs.rust_version }}
      CACHE_KEY: cd-deps-fat-v1-${{ needs.prepare.outputs.dry_run == 'true' && 'dryrun-' || '' }}${{ matrix.key }}-${{ needs.prepare.outputs.rust_version }}-${{ needs.prepare.outputs.lock_hash }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.dry_run == 'true' && needs.prepare.outputs.sha || inputs.source_ref }}
          persist-credentials: false

      - name: Download prebuilt Admin SPA dist
        uses: actions/download-artifact@v7
        with:
          name: admin-spa-dist
          path: crates/cc-lb-admin/web/dist

      - name: Cache shared Cargo registry and git db (amd64 primary)
        if: matrix.key == 'amd64'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-registry-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-v2-${{ runner.os }}-

      - name: Restore shared Cargo registry and git db
        if: matrix.key != 'amd64'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-registry-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-v2-${{ runner.os }}-

      - name: Restore release Cargo deps target cache
        id: deps-restore
        uses: actions/cache/restore@v6
        with:
          path: target
          key: ${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-

      - name: Compile static binary with fat LTO
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          OUT_BIN: ${{ runner.temp }}/stage-ctx/cc-lb
          CARGO_BUILD_JOBS: "4"
          GIT_SHA: ${{ needs.prepare.outputs.sha }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        run: ./scripts/docker-build-musl.sh

      - name: Smoke-test native amd64 static binary
        if: matrix.smoke
        env:
          BIN_PATH: ${{ runner.temp }}/stage-ctx/cc-lb
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          out=$("$BIN_PATH" --version)
          printf '%s\n' "$out"
          grep -Fq "$EXPECTED_VERSION" <<<"$out"

      - name: Upload dry-run arm64 binary for remote smoke
        if: needs.prepare.outputs.dry_run == 'true' && matrix.key == 'arm64'
        uses: actions/upload-artifact@v7
        with:
          name: arm64-dryrun-bin
          path: ${{ runner.temp }}/stage-ctx/cc-lb
          retention-days: 1
          if-no-files-found: error

      - name: Log in to ghcr.io
        if: needs.prepare.outputs.dry_run != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          driver: docker-container

      - name: Derive exact labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/isac322/cc-lb
          flavor: latest=false
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}

      - name: Package and push platform digest
        id: build_push
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          file: ${{ github.workspace }}/Dockerfile
          context: ${{ runner.temp }}/stage-ctx
          target: distroless-prebuilt
          platforms: ${{ matrix.platform }}
          provenance: true
          sbom: true
          outputs: ${{ needs.prepare.outputs.dry_run == 'true' && 'type=cacheonly' || 'type=image,name=ghcr.io/isac322/cc-lb,push-by-digest=true,name-canonical=true,push=true' }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Write pushed platform digest
        if: needs.prepare.outputs.dry_run != 'true'
        env:
          DIGEST: ${{ steps.build_push.outputs.digest }}
          KEY: ${{ matrix.key }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::invalid digest for $KEY: '$DIGEST'" >&2
            exit 1
          fi
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digest-$KEY.txt"

      - name: Upload platform digest
        if: needs.prepare.outputs.dry_run != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: docker-digest-${{ matrix.key }}
          path: ${{ runner.temp }}/digest-${{ matrix.key }}.txt
          retention-days: 1
          if-no-files-found: error

      - name: Prune release deps target cache
        if: steps.deps-restore.outputs.cache-hit != 'true' && (needs.prepare.outputs.dry_run == 'true' || github.ref == 'refs/heads/master')
        run: |
          set -euo pipefail
          echo "=== target size before prune ==="
          du -sh target target/*/release || true
          node scripts/prune-rust-target.mjs \
            --target-dir target \
            --metadata-file target/.cargo-metadata.json
          echo "=== target size after prune ==="
          du -sh target target/*/release || true

      - name: Save release deps target cache
        if: steps.deps-restore.outputs.cache-hit != 'true' && (needs.prepare.outputs.dry_run == 'true' || github.ref == 'refs/heads/master')
        uses: actions/cache/save@v6
        with:
          path: target
          key: ${{ env.CACHE_KEY }}

      - name: Prune superseded release deps caches
        if: steps.deps-restore.outputs.cache-hit != 'true' && (needs.prepare.outputs.dry_run == 'true' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_KEY: ${{ env.CACHE_KEY }}
          CACHE_PREFIX: ${{ env.CACHE_PREFIX }}-
          TARGET_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          stale_ids=$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/caches?ref=${TARGET_REF}&per_page=100" \
            --jq '.actions_caches[] | select((.key | startswith(env.CACHE_PREFIX)) and .key != env.CURRENT_KEY) | .id') || true
          for id in $stale_ids; do
            gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches/${id}" >/dev/null || true
          done

  smoke-arm64:
    name: smoke-test native arm64 binary
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.already_published != 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      packages: read
    steps:
      - name: Download arm64 digest (live)
        if: needs.prepare.outputs.dry_run != 'true'
        uses: actions/download-artifact@v7
        with:
          name: docker-digest-arm64
          path: ${{ runner.temp }}/digests

      - name: Log in to ghcr.io
        if: needs.prepare.outputs.dry_run != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run native arm64 container smoke test
        if: needs.prepare.outputs.dry_run != 'true'
        env:
          IMAGE: ghcr.io/isac322/cc-lb
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          digest=$(tr -d '[:space:]' < "$RUNNER_TEMP/digests/docker-digest-arm64/digest-arm64.txt" 2>/dev/null || tr -d '[:space:]' < "$RUNNER_TEMP/digests/digest-arm64.txt")
          out=$(docker run --rm "${IMAGE}@${digest}" --version)
          printf '%s\n' "$out"
          grep -Fq "$EXPECTED_VERSION" <<<"$out"

      - name: Download dry-run arm64 binary
        if: needs.prepare.outputs.dry_run == 'true'
        uses: actions/download-artifact@v7
        with:
          name: arm64-dryrun-bin
          path: ${{ runner.temp }}/arm64-bin

      - name: Run native arm64 binary smoke test (dry-run)
        if: needs.prepare.outputs.dry_run == 'true'
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/arm64-bin/cc-lb"
          out=$("$RUNNER_TEMP/arm64-bin/cc-lb" --version)
          printf '%s\n' "$out"
          grep -Fq "$EXPECTED_VERSION" <<<"$out"

  publish:
    name: assemble & verify image
    needs: [prepare, build, smoke-arm64]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.prepare.outputs.already_published == 'true' || (needs.build.result == 'success' && needs.smoke-arm64.result == 'success')) }}
    runs-on: ubuntu-slim
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Verify dry-run ubuntu-slim imagetools without daemon
        if: needs.prepare.outputs.dry_run == 'true'
        run: |
          set -euo pipefail
          docker buildx imagetools inspect ghcr.io/isac322/cc-lb:2.2.1 --raw >/dev/null
          echo "dry-run publish verified on ubuntu-slim without Docker daemon"

      - uses: actions/checkout@v7
        if: needs.prepare.outputs.dry_run != 'true'
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Prepare image revision verifier
        if: needs.prepare.outputs.dry_run != 'true'
        run: |
          cat > "$RUNNER_TEMP/verify-image-revision.sh" <<'VERIFY_IMAGE_REVISION'
          #!/usr/bin/env bash
          set -euo pipefail

          if [ "$#" -lt 2 ]; then
            echo "::error::usage: $0 EXPECTED_REVISION IMAGE [IMAGE...]" >&2
            exit 2
          fi

          expected_revision=$1
          shift

          declare -A verified_revisions=()
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          raw_file="$temp_dir/manifest.json"

          verify_revision() {
            local ref=$1
            local labels revision

            if [[ -v 'verified_revisions[$ref]' ]]; then
              return
            fi

            if ! labels=$(docker buildx imagetools inspect "$ref" \
                --format '{{json .Image.Config.Labels}}'); then
              echo "::error::could not inspect image config for $ref" >&2
              exit 1
            fi
            revision=$(jq -r '."org.opencontainers.image.revision" // empty' <<<"$labels")
            if [ "$revision" != "$expected_revision" ]; then
              echo "::error::image $ref revision '$revision' does not match '$expected_revision'" >&2
              exit 1
            fi

            verified_revisions["$ref"]=$revision
          }

          for image in "$@"; do
            if ! docker buildx imagetools inspect "$image" --raw > "$raw_file"; then
              echo "::error::could not inspect image $image" >&2
              exit 1
            fi

            repository=${image%%@*}
            last_component=${repository##*/}
            if [[ "$last_component" == *:* ]]; then
              repository=${repository%:*}
            fi

            refs=()
            if jq -e 'has("manifests")' "$raw_file" > /dev/null; then
              platforms=$(
                jq -r '
                  [
                    .manifests[]
                    | select(.platform.os != "unknown")
                    | .platform
                    | if .variant and ((.os + "/" + .architecture) != "linux/arm64" or .variant != "v8")
                      then .os + "/" + .architecture + "/" + .variant
                      else .os + "/" + .architecture
                      end
                  ]
                  | sort
                  | join(" ")
                ' "$raw_file"
              )
              if [ "$platforms" != "linux/amd64 linux/arm/v7 linux/arm64 linux/ppc64le" ]; then
                echo "::error::image $image has runnable platforms '$platforms', expected 'linux/amd64 linux/arm/v7 linux/arm64 linux/ppc64le'" >&2
                exit 1
              fi
              digests=()
              while IFS= read -r digest; do
                if [ -n "$digest" ]; then
                  digests+=("$digest")
                fi
              done < <(
                jq -r '
                  .manifests[]
                  | select(.platform.os != "unknown")
                  | .digest
                ' "$raw_file"
              )
              for digest in "${digests[@]}"; do
                refs+=("$repository@$digest")
              done
            else
              manifest_digest=$(sha256sum "$raw_file")
              manifest_digest=${manifest_digest%% *}
              refs+=("$repository@sha256:$manifest_digest")
            fi

            for ref in "${refs[@]}"; do
              verify_revision "$ref"
            done

            printf 'verified %s platform manifest(s) for %s at revision %s\n' \
              "${#refs[@]}" "$image" "$expected_revision"
          done
          VERIFY_IMAGE_REVISION
          chmod 0755 "$RUNNER_TEMP/verify-image-revision.sh"

      - name: Log in to ghcr.io
        if: needs.prepare.outputs.dry_run != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download platform digests
        if: needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.already_published != 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: docker-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Assemble and push exact multi-arch image
        if: needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.already_published != 'true'
        env:
          IMAGE: ghcr.io/isac322/cc-lb
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          refs=()
          for key in amd64 arm64 armv7 ppc64le; do
            digest_file="$RUNNER_TEMP/digests/digest-$key.txt"
            digest=$(tr -d '[:space:]' < "$digest_file")
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::invalid digest for $key: '$digest'" >&2
              exit 1
            fi
            refs+=("$IMAGE@$digest")
          done
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "${refs[@]}"

      - name: Select moving aliases
        if: needs.prepare.outputs.dry_run != 'true'
        id: aliases
        uses: actions/github-script@v9
        env:
          VERSION: ${{ inputs.version }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const moduleUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/release_aliases.mjs`,
            );
            const { releaseAliases } = await import(moduleUrl.href);

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );
            const publishedTags = releases
              .filter((release) => !release.draft && !release.prerelease)
              .map((release) => release.tag_name);
            core.setOutput(
              'aliases',
              releaseAliases(process.env.VERSION, publishedTags).join(' '),
            );

      - name: Reconcile moving aliases
        if: needs.prepare.outputs.dry_run != 'true' && steps.aliases.outputs.aliases != ''
        env:
          ALIASES: ${{ steps.aliases.outputs.aliases }}
          IMAGE: ghcr.io/isac322/cc-lb
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          read -r -a aliases <<< "$ALIASES"
          args=()
          for alias in "${aliases[@]}"; do
            args+=(--tag "$IMAGE:$alias")
          done
          docker buildx imagetools create "${args[@]}" "$IMAGE:$VERSION"

      - name: Verify published image tags
        if: needs.prepare.outputs.dry_run != 'true'
        env:
          ALIASES: ${{ steps.aliases.outputs.aliases }}
          IMAGE: ghcr.io/isac322/cc-lb
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          aliases=()
          if [ -n "$ALIASES" ]; then
            read -r -a aliases <<< "$ALIASES"
          fi
          images=("$IMAGE:$VERSION")
          for alias in "${aliases[@]}"; do
            images+=("$IMAGE:$alias")
          done
          "$RUNNER_TEMP/verify-image-revision.sh" "$SOURCE_SHA" "${images[@]}"
