name: publish-docker

# Image tags are strict semver with no `latest`: 1.2.3 publishes 1, 1.2, 1.2.3,
# while a prerelease (1.2.3-rc.1) publishes only 1.2.3-rc.1 and never moves the
# 1 / 1.2 tags. The build cross-compiles from the runner's native arch, so no
# QEMU is needed for the four target platforms.

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      version:
        description: 'Semver to publish, without a leading v (e.g. 1.2.3 or 1.2.3-rc.1)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver to publish, without a leading v (e.g. 1.2.3 or 1.2.3-rc.1)'
        required: true
        type: string

concurrency:
  group: publish-docker-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: build & push image
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    # Runs on the self-hosted oracle4-cc-lb runner: it is arm64 (required — from
    # an x86_64/musl host the build host's triple equals the x86_64-musl target,
    # so .cargo/config.toml's static-musl linker leaks into host proc-macro
    # builds and they fail to link), and being in-cluster it can reach the
    # garage-S3 sccache that docker-build warms on every PR. xx cross-compiles
    # all four target arches with no QEMU.
    runs-on: oracle4-cc-lb
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Derive reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${RELEASE_TAG#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Reject non-semver before it can reach the registry (otherwise
      # metadata-action emits no tags and the push is a confusing no-op).
      - name: Validate version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not valid semver (expected X.Y.Z[-prerelease][+build])"
            exit 1
          fi

      # network=host lets the build reach the in-cluster garage sccache endpoint.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement network.host

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/isac322/cc-lb
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le
          push: true
          provenance: false
          network: host
          allow: network.host
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            SCCACHE_BUCKET=sccache
            SCCACHE_ENDPOINT=http://garage.arc-systems.svc.cluster.local:3900
            SCCACHE_REGION=garage
            SCCACHE_S3_USE_SSL=false
          secret-envs: |
            AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY

      # Pull the freshly pushed amd64 image back and confirm the binary runs.
      - name: Smoke test published image (amd64)
        env:
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: docker run --rm "ghcr.io/isac322/cc-lb:${IMAGE_VERSION}" --version
