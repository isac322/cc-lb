name: publish-docker

# Publish the immutable exact version first. Stable moving aliases are updated
# only when this version is the newest published stable server Release for the
# alias prefix. Prereleases never move aliases, and `latest` is never published.

on:
  workflow_call:
    inputs:
      version:
        description: 'Semver to publish without a leading v'
        required: true
        type: string
      source_ref:
        description: 'Immutable cc-lb source tag to build'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver to publish without a leading v'
        required: true
        type: string
      source_ref:
        description: 'Immutable cc-lb source tag to build'
        required: true
        type: string

concurrency:
  group: publish-docker-${{ inputs.version }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: build & push image
    # Reuse the configured compiler cache across Docker builds.
    # The runner pool may schedule either x86_64 or arm64;
    # the source Dockerfile isolates host-only Cargo configuration and xx
    # cross-compiles all four target architectures with no QEMU.
    runs-on: cc-lb-500m
    permissions:
      contents: read
      packages: write
    env:
      # docker/build-push-action uploads a per-step build record artifact
      # (docker-build-*); bound its retention so records do not outlive the
      # debugging window they exist for.
      DOCKER_BUILD_RECORD_RETENTION_DAYS: "7"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Prepare image revision verifier
        run: |
          cat > "$RUNNER_TEMP/verify-image-revision.sh" <<'VERIFY_IMAGE_REVISION'
          #!/usr/bin/env bash
          set -euo pipefail

          if [ "$#" -lt 2 ]; then
            echo "::error::usage: $0 EXPECTED_REVISION IMAGE [IMAGE...]" >&2
            exit 2
          fi

          expected_revision=$1
          shift

          declare -A verified_revisions=()
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          raw_file="$temp_dir/manifest.json"

          verify_revision() {
            local ref=$1
            local labels revision

            if [[ -v 'verified_revisions[$ref]' ]]; then
              return
            fi

            if ! labels=$(docker buildx imagetools inspect "$ref" \
                --format '{{json .Image.Config.Labels}}'); then
              echo "::error::could not inspect image config for $ref" >&2
              exit 1
            fi
            revision=$(jq -r '."org.opencontainers.image.revision" // empty' <<<"$labels")
            if [ "$revision" != "$expected_revision" ]; then
              echo "::error::image $ref revision '$revision' does not match '$expected_revision'" >&2
              exit 1
            fi

            verified_revisions["$ref"]=$revision
          }

          for image in "$@"; do
            if ! docker buildx imagetools inspect "$image" --raw > "$raw_file"; then
              echo "::error::could not inspect image $image" >&2
              exit 1
            fi

            repository=${image%%@*}
            last_component=${repository##*/}
            if [[ "$last_component" == *:* ]]; then
              repository=${repository%:*}
            fi

            refs=()
            if jq -e 'has("manifests")' "$raw_file" > /dev/null; then
              digests=()
              while IFS= read -r digest; do
                if [ -n "$digest" ]; then
                  digests+=("$digest")
                fi
              done < <(
                jq -r '
                  .manifests[]
                  | select(.platform.os != "unknown")
                  | .digest
                ' "$raw_file"
              )
              if [ "${#digests[@]}" -eq 0 ]; then
                echo "::error::image $image contains no runnable platform manifests" >&2
                exit 1
              fi
              for digest in "${digests[@]}"; do
                refs+=("$repository@$digest")
              done
            else
              manifest_digest=$(sha256sum "$raw_file")
              manifest_digest=${manifest_digest%% *}
              refs+=("$repository@sha256:$manifest_digest")
            fi

            for ref in "${refs[@]}"; do
              verify_revision "$ref"
            done

            printf 'verified %s platform manifest(s) for %s at revision %s\n' \
              "${#refs[@]}" "$image" "$expected_revision"
          done
          VERIFY_IMAGE_REVISION
          chmod 0755 "$RUNNER_TEMP/verify-image-revision.sh"

      - uses: ./.github/actions/export-sccache-env

      - name: Resolve source revision
        id: source
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Validate version and source ref
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [ "$SOURCE_REF" != "cc-lb-v$VERSION" ]; then
            echo "::error::source_ref '$SOURCE_REF' must equal cc-lb-v$VERSION"
            exit 1
          fi
          actual_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$actual_version" != "$VERSION" ]; then
            echo "::error::checked-out server version '$actual_version' does not match '$VERSION'"
            exit 1
          fi

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        with:
          driver: remote

      - name: Inspect existing exact image
        id: existing
        env:
          IMAGE: ghcr.io/isac322/cc-lb
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          error_file="$RUNNER_TEMP/image-inspect-error"
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>"$error_file"; then
            "$RUNNER_TEMP/verify-image-revision.sh" "$SOURCE_SHA" "$IMAGE:$VERSION"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'not found|manifest unknown' "$error_file"; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            command cat "$error_file" >&2
            echo "::error::could not determine whether $IMAGE:$VERSION exists"
            exit 1
          fi

      - name: Derive exact tag and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/isac322/cc-lb
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}


      - name: Build and push exact image
        if: steps.existing.outputs.already_published != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: distroless
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CARGO_BUILD_JOBS=6
            GIT_SHA=${{ steps.source.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            SCCACHE_BUCKET=${{ env.SCCACHE_BUCKET }}
            SCCACHE_ENDPOINT=${{ env.SCCACHE_ENDPOINT }}
            SCCACHE_REGION=${{ env.SCCACHE_REGION }}
            SCCACHE_S3_USE_SSL=${{ env.SCCACHE_S3_USE_SSL }}
            SCCACHE_S3_KEY_PREFIX=${{ env.SCCACHE_S3_KEY_PREFIX }}
          secret-envs: |
            AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY

      - name: Smoke-test binary version
        if: steps.existing.outputs.already_published != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: smoke
          outputs: type=cacheonly
          platforms: linux/arm64
          provenance: false
          build-args: |
            CARGO_BUILD_JOBS=6
            GIT_SHA=${{ steps.source.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            SCCACHE_BUCKET=${{ env.SCCACHE_BUCKET }}
            SCCACHE_ENDPOINT=${{ env.SCCACHE_ENDPOINT }}
            SCCACHE_REGION=${{ env.SCCACHE_REGION }}
            SCCACHE_S3_USE_SSL=${{ env.SCCACHE_S3_USE_SSL }}
            SCCACHE_S3_KEY_PREFIX=${{ env.SCCACHE_S3_KEY_PREFIX }}
            EXPECTED_VERSION=${{ inputs.version }}
          secret-envs: |
            AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY

      - name: Select moving aliases
        id: aliases
        uses: actions/github-script@v9
        env:
          VERSION: ${{ inputs.version }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const moduleUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/release_aliases.mjs`,
            );
            const { releaseAliases } = await import(moduleUrl.href);

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );
            const publishedTags = releases
              .filter((release) => !release.draft && !release.prerelease)
              .map((release) => release.tag_name);
            core.setOutput(
              'aliases',
              releaseAliases(process.env.VERSION, publishedTags).join(' '),
            );

      - name: Reconcile moving aliases
        if: steps.aliases.outputs.aliases != ''
        env:
          ALIASES: ${{ steps.aliases.outputs.aliases }}
          IMAGE: ghcr.io/isac322/cc-lb
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          read -r -a aliases <<< "$ALIASES"
          args=()
          for alias in "${aliases[@]}"; do
            args+=(--tag "$IMAGE:$alias")
          done
          docker buildx imagetools create "${args[@]}" "$IMAGE:$VERSION"

      - name: Verify published image tags
        env:
          ALIASES: ${{ steps.aliases.outputs.aliases }}
          IMAGE: ghcr.io/isac322/cc-lb
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          aliases=()
          if [ -n "$ALIASES" ]; then
            read -r -a aliases <<< "$ALIASES"
          fi
          images=("$IMAGE:$VERSION")
          for alias in "${aliases[@]}"; do
            images+=("$IMAGE:$alias")
          done
          "$RUNNER_TEMP/verify-image-revision.sh" "$SOURCE_SHA" "${images[@]}"
