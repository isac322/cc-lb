name: publish-docker

# Publish the immutable exact version first. Stable moving aliases are updated
# only when this version is the newest published stable server Release for the
# alias prefix. Prereleases never move aliases, and `latest` is never published.

on:
  workflow_call:
    inputs:
      version:
        description: 'Semver to publish without a leading v'
        required: true
        type: string
      source_ref:
        description: 'Immutable cc-lb source tag to build'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver to publish without a leading v'
        required: true
        type: string
      source_ref:
        description: 'Immutable cc-lb source tag to build'
        required: true
        type: string

concurrency:
  group: publish-docker-${{ inputs.version }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: validate & inspect release image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      source_date_epoch: ${{ steps.source.outputs.source_date_epoch }}
      already_published: ${{ steps.existing.outputs.already_published }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Prepare image revision verifier
        run: |
          cat > "$RUNNER_TEMP/verify-image-revision.sh" <<'VERIFY_IMAGE_REVISION'
          #!/usr/bin/env bash
          set -euo pipefail

          if [ "$#" -lt 2 ]; then
            echo "::error::usage: $0 EXPECTED_REVISION IMAGE [IMAGE...]" >&2
            exit 2
          fi

          expected_revision=$1
          shift

          declare -A verified_revisions=()
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          raw_file="$temp_dir/manifest.json"

          verify_revision() {
            local ref=$1
            local labels revision

            if [[ -v 'verified_revisions[$ref]' ]]; then
              return
            fi

            if ! labels=$(docker buildx imagetools inspect "$ref" \
                --format '{{json .Image.Config.Labels}}'); then
              echo "::error::could not inspect image config for $ref" >&2
              exit 1
            fi
            revision=$(jq -r '."org.opencontainers.image.revision" // empty' <<<"$labels")
            if [ "$revision" != "$expected_revision" ]; then
              echo "::error::image $ref revision '$revision' does not match '$expected_revision'" >&2
              exit 1
            fi

            verified_revisions["$ref"]=$revision
          }

          for image in "$@"; do
            if ! docker buildx imagetools inspect "$image" --raw > "$raw_file"; then
              echo "::error::could not inspect image $image" >&2
              exit 1
            fi

            repository=${image%%@*}
            last_component=${repository##*/}
            if [[ "$last_component" == *:* ]]; then
              repository=${repository%:*}
            fi

            refs=()
            if jq -e 'has("manifests")' "$raw_file" > /dev/null; then
              platforms=$(
                jq -r '
                  [
                    .manifests[]
                    | select(.platform.os != "unknown")
                    | .platform
                    | if .variant and ((.os + "/" + .architecture) != "linux/arm64" or .variant != "v8")
                      then .os + "/" + .architecture + "/" + .variant
                      else .os + "/" + .architecture
                      end
                  ]
                  | sort
                  | join(" ")
                ' "$raw_file"
              )
              if [ "$platforms" != "linux/amd64 linux/arm/v7 linux/arm64 linux/ppc64le" ]; then
                echo "::error::image $image has runnable platforms '$platforms', expected 'linux/amd64 linux/arm/v7 linux/arm64 linux/ppc64le'" >&2
                exit 1
              fi
              digests=()
              while IFS= read -r digest; do
                if [ -n "$digest" ]; then
                  digests+=("$digest")
                fi
              done < <(
                jq -r '
                  .manifests[]
                  | select(.platform.os != "unknown")
                  | .digest
                ' "$raw_file"
              )
              for digest in "${digests[@]}"; do
                refs+=("$repository@$digest")
              done
            else
              manifest_digest=$(sha256sum "$raw_file")
              manifest_digest=${manifest_digest%% *}
              refs+=("$repository@sha256:$manifest_digest")
            fi

            for ref in "${refs[@]}"; do
              verify_revision "$ref"
            done

            printf 'verified %s platform manifest(s) for %s at revision %s\n' \
              "${#refs[@]}" "$image" "$expected_revision"
          done
          VERIFY_IMAGE_REVISION
          chmod 0755 "$RUNNER_TEMP/verify-image-revision.sh"

      - name: Resolve source revision
        id: source
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Validate version and source ref
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [ "$SOURCE_REF" != "cc-lb-v$VERSION" ]; then
            echo "::error::source_ref '$SOURCE_REF' must equal cc-lb-v$VERSION"
            exit 1
          fi
          actual_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$actual_version" != "$VERSION" ]; then
            echo "::error::checked-out server version '$actual_version' does not match '$VERSION'"
            exit 1
          fi

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Inspect existing exact image
        id: existing
        env:
          IMAGE: ghcr.io/isac322/cc-lb
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          error_file="$RUNNER_TEMP/image-inspect-error"
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>"$error_file"; then
            "$RUNNER_TEMP/verify-image-revision.sh" "$SOURCE_SHA" "$IMAGE:$VERSION"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'not found|manifest unknown' "$error_file"; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            command cat "$error_file" >&2
            echo "::error::could not determine whether $IMAGE:$VERSION exists"
            exit 1
          fi

  build:
    name: build & push digest (${{ matrix.key }})
    needs: prepare
    if: needs.prepare.outputs.already_published != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
            host: amd64
            smoke: true
          - key: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
            host: arm64
            smoke: true
          - key: armv7
            platform: linux/arm/v7
            runner: ubuntu-26.04-arm
            host: arm64
            smoke: false
          - key: ppc64le
            platform: linux/ppc64le
            runner: ubuntu-26.04-arm
            host: arm64
            smoke: false
    env:
      # docker/build-push-action uploads a per-step build record artifact
      # (docker-build-*); bound its retention so records do not outlive the
      # debugging window they exist for.
      DOCKER_BUILD_RECORD_RETENTION_DAYS: "7"
      CACHE_KEY: docker-mounts-fat-${{ matrix.key }}-${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Restore BuildKit cache mounts
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/docker-mounts.tar
          key: ${{ env.CACHE_KEY }}
          restore-keys: |
            docker-mounts-fat-${{ matrix.key }}-

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          driver: docker-container

      - name: Inject restored BuildKit cache mounts
        if: steps.cache-restore.outputs.cache-matched-key != ''
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
          HOST_ARCH: ${{ matrix.host }}
        run: |
          set -euo pipefail
          ctx="$RUNNER_TEMP/buildkit-cache-inject"
          rm -rf "$ctx"
          mkdir -p "$ctx"
          mv "$RUNNER_TEMP/docker-mounts.tar" "$ctx/docker-mounts.tar"
          cat > "$ctx/Dockerfile" <<EOF
          # syntax=docker/dockerfile:1
          FROM alpine:3.24 AS inject
          COPY docker-mounts.tar /docker-mounts.tar
          RUN --mount=type=cache,id=cargo-home,sharing=shared,target=/cargo-home \
              --mount=type=cache,id=bun-linux-${HOST_ARCH},target=/bun \
              --mount=type=cache,id=sccache,sharing=shared,target=/sccache \
              tar -C / -xf /docker-mounts.tar && \
              mkdir -p /out && \
              du -sk /cargo-home /bun /sccache > /out/restored.txt
          FROM scratch
          COPY --from=inject /out/ /
          EOF
          docker buildx build --builder "$BUILDER" --progress=plain --output "type=local,dest=$ctx/out" "$ctx"
          cat "$ctx/out/restored.txt"
          rm -rf "$ctx"

      - name: Derive exact labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/isac322/cc-lb
          flavor: latest=false
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}

      - name: Build and push platform digest
        id: build_push
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: distroless
          platforms: ${{ matrix.platform }}
          provenance: true
          sbom: true
          outputs: type=image,name=ghcr.io/isac322/cc-lb,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CARGO_BUILD_JOBS=4
            SCCACHE_LOCAL_MOUNT=1
            REQUIRE_SCCACHE=1
            GIT_SHA=${{ needs.prepare.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ needs.prepare.outputs.source_date_epoch }}

      - name: Smoke-test native binary version
        if: matrix.smoke
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: smoke
          outputs: type=cacheonly
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: |
            CARGO_BUILD_JOBS=4
            SCCACHE_LOCAL_MOUNT=1
            REQUIRE_SCCACHE=1
            GIT_SHA=${{ needs.prepare.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ needs.prepare.outputs.source_date_epoch }}
            EXPECTED_VERSION=${{ inputs.version }}

      - name: Write pushed platform digest
        env:
          DIGEST: ${{ steps.build_push.outputs.digest }}
          KEY: ${{ matrix.key }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::invalid digest for $KEY: '$DIGEST'" >&2
            exit 1
          fi
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digest-$KEY.txt"

      - name: Upload platform digest
        uses: actions/upload-artifact@v7
        with:
          name: docker-digest-${{ matrix.key }}
          path: ${{ runner.temp }}/digest-${{ matrix.key }}.txt
          retention-days: 1
          if-no-files-found: error

      - name: Extract populated BuildKit cache mounts
        if: github.ref == 'refs/heads/master' && steps.cache-restore.outputs.cache-hit != 'true'
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
          HOST_ARCH: ${{ matrix.host }}
        run: |
          set -euo pipefail
          ctx="$RUNNER_TEMP/buildkit-cache-extract"
          rm -rf "$ctx" "$RUNNER_TEMP/docker-mounts.tar"
          mkdir -p "$ctx"
          cat > "$ctx/Dockerfile" <<EOF
          # syntax=docker/dockerfile:1
          FROM alpine:3.24 AS extract
          RUN --mount=type=cache,id=cargo-home,sharing=shared,target=/cargo-home \
              --mount=type=cache,id=bun-linux-${HOST_ARCH},target=/bun \
              --mount=type=cache,id=sccache,sharing=shared,target=/sccache \
              mkdir -p /out && \
              du -sk /cargo-home /bun /sccache > /out/extracted.txt && \
              tar -C / -cf /out/docker-mounts.tar cargo-home bun sccache
          FROM scratch
          COPY --from=extract /out/ /
          EOF
          docker buildx build --builder "$BUILDER" --progress=plain --output "type=local,dest=$ctx/out" "$ctx"
          cat "$ctx/out/extracted.txt"
          mv "$ctx/out/docker-mounts.tar" "$RUNNER_TEMP/docker-mounts.tar"
          test -s "$RUNNER_TEMP/docker-mounts.tar"
          rm -rf "$ctx"

      - name: Save BuildKit cache mounts
        if: github.ref == 'refs/heads/master' && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/docker-mounts.tar
          key: ${{ env.CACHE_KEY }}

  publish:
    name: assemble & verify image
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.prepare.outputs.already_published == 'true' || needs.build.result == 'success') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Prepare image revision verifier
        run: |
          cat > "$RUNNER_TEMP/verify-image-revision.sh" <<'VERIFY_IMAGE_REVISION'
          #!/usr/bin/env bash
          set -euo pipefail

          if [ "$#" -lt 2 ]; then
            echo "::error::usage: $0 EXPECTED_REVISION IMAGE [IMAGE...]" >&2
            exit 2
          fi

          expected_revision=$1
          shift

          declare -A verified_revisions=()
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          raw_file="$temp_dir/manifest.json"

          verify_revision() {
            local ref=$1
            local labels revision

            if [[ -v 'verified_revisions[$ref]' ]]; then
              return
            fi

            if ! labels=$(docker buildx imagetools inspect "$ref" \
                --format '{{json .Image.Config.Labels}}'); then
              echo "::error::could not inspect image config for $ref" >&2
              exit 1
            fi
            revision=$(jq -r '."org.opencontainers.image.revision" // empty' <<<"$labels")
            if [ "$revision" != "$expected_revision" ]; then
              echo "::error::image $ref revision '$revision' does not match '$expected_revision'" >&2
              exit 1
            fi

            verified_revisions["$ref"]=$revision
          }

          for image in "$@"; do
            if ! docker buildx imagetools inspect "$image" --raw > "$raw_file"; then
              echo "::error::could not inspect image $image" >&2
              exit 1
            fi

            repository=${image%%@*}
            last_component=${repository##*/}
            if [[ "$last_component" == *:* ]]; then
              repository=${repository%:*}
            fi

            refs=()
            if jq -e 'has("manifests")' "$raw_file" > /dev/null; then
              platforms=$(
                jq -r '
                  [
                    .manifests[]
                    | select(.platform.os != "unknown")
                    | .platform
                    | if .variant and ((.os + "/" + .architecture) != "linux/arm64" or .variant != "v8")
                      then .os + "/" + .architecture + "/" + .variant
                      else .os + "/" + .architecture
                      end
                  ]
                  | sort
                  | join(" ")
                ' "$raw_file"
              )
              if [ "$platforms" != "linux/amd64 linux/arm/v7 linux/arm64 linux/ppc64le" ]; then
                echo "::error::image $image has runnable platforms '$platforms', expected 'linux/amd64 linux/arm/v7 linux/arm64 linux/ppc64le'" >&2
                exit 1
              fi
              digests=()
              while IFS= read -r digest; do
                if [ -n "$digest" ]; then
                  digests+=("$digest")
                fi
              done < <(
                jq -r '
                  .manifests[]
                  | select(.platform.os != "unknown")
                  | .digest
                ' "$raw_file"
              )
              for digest in "${digests[@]}"; do
                refs+=("$repository@$digest")
              done
            else
              manifest_digest=$(sha256sum "$raw_file")
              manifest_digest=${manifest_digest%% *}
              refs+=("$repository@sha256:$manifest_digest")
            fi

            for ref in "${refs[@]}"; do
              verify_revision "$ref"
            done

            printf 'verified %s platform manifest(s) for %s at revision %s\n' \
              "${#refs[@]}" "$image" "$expected_revision"
          done
          VERIFY_IMAGE_REVISION
          chmod 0755 "$RUNNER_TEMP/verify-image-revision.sh"

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Download platform digests
        if: needs.prepare.outputs.already_published != 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: docker-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Assemble and push exact multi-arch image
        if: needs.prepare.outputs.already_published != 'true'
        env:
          IMAGE: ghcr.io/isac322/cc-lb
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          refs=()
          for key in amd64 arm64 armv7 ppc64le; do
            digest_file="$RUNNER_TEMP/digests/digest-$key.txt"
            digest=$(tr -d '[:space:]' < "$digest_file")
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::invalid digest for $key: '$digest'" >&2
              exit 1
            fi
            refs+=("$IMAGE@$digest")
          done
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "${refs[@]}"

      - name: Select moving aliases
        id: aliases
        uses: actions/github-script@v9
        env:
          VERSION: ${{ inputs.version }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const moduleUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/release_aliases.mjs`,
            );
            const { releaseAliases } = await import(moduleUrl.href);

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );
            const publishedTags = releases
              .filter((release) => !release.draft && !release.prerelease)
              .map((release) => release.tag_name);
            core.setOutput(
              'aliases',
              releaseAliases(process.env.VERSION, publishedTags).join(' '),
            );

      - name: Reconcile moving aliases
        if: steps.aliases.outputs.aliases != ''
        env:
          ALIASES: ${{ steps.aliases.outputs.aliases }}
          IMAGE: ghcr.io/isac322/cc-lb
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          read -r -a aliases <<< "$ALIASES"
          args=()
          for alias in "${aliases[@]}"; do
            args+=(--tag "$IMAGE:$alias")
          done
          docker buildx imagetools create "${args[@]}" "$IMAGE:$VERSION"

      - name: Verify published image tags
        env:
          ALIASES: ${{ steps.aliases.outputs.aliases }}
          IMAGE: ghcr.io/isac322/cc-lb
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          aliases=()
          if [ -n "$ALIASES" ]; then
            read -r -a aliases <<< "$ALIASES"
          fi
          images=("$IMAGE:$VERSION")
          for alias in "${aliases[@]}"; do
            images+=("$IMAGE:$alias")
          done
          "$RUNNER_TEMP/verify-image-revision.sh" "$SOURCE_SHA" "${images[@]}"
