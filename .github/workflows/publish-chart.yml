name: publish-chart

on:
  workflow_call:
    inputs:
      version:
        description: 'Semver to publish without a leading v'
        required: true
        type: string
      source_ref:
        description: 'Immutable cc-lb source tag to package'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver to publish without a leading v'
        required: true
        type: string
      source_ref:
        description: 'Immutable cc-lb source tag to package'
        required: true
        type: string

concurrency:
  group: publish-chart-${{ inputs.version }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: package & push chart
    runs-on: oracle4-cc-lb
    permissions:
      contents: read
      packages: write
    env:
      CHART: deploy/helm/cc-lb
      LINT_MASTER_KEY: ci-lint-placeholder
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Resolve source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate version and source ref
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$SOURCE_REF" != "cc-lb-v$VERSION" ]; then
            echo "::error::source_ref '$SOURCE_REF' must equal cc-lb-v$VERSION"
            exit 1
          fi
          actual_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$actual_version" != "$VERSION" ]; then
            echo "::error::checked-out server version '$actual_version' does not match '$VERSION'"
            exit 1
          fi

      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.16.4

      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Inspect existing chart
        id: existing
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          existing_dir="$RUNNER_TEMP/existing-chart"
          mkdir -p "$existing_dir"
          error_file="$RUNNER_TEMP/chart-pull-error"
          if helm pull oci://ghcr.io/isac322/charts/cc-lb \
              --version "$VERSION" \
              --destination "$existing_dir" \
              2>"$error_file"; then
            tar -xzf "$existing_dir/cc-lb-$VERSION.tgz" -C "$existing_dir"
            python3 scripts/chart_metadata.py verify \
              --chart "$existing_dir/cc-lb/Chart.yaml" \
              --version "$VERSION" \
              --revision "$SOURCE_SHA"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'not found|manifest unknown' "$error_file"; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            command cat "$error_file" >&2
            echo "::error::could not determine whether chart $VERSION exists"
            exit 1
          fi

      - name: Prepare chart
        if: steps.existing.outputs.already_published != 'true'
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          command cp -R "$CHART" "$RUNNER_TEMP/cc-lb-chart"
          python3 scripts/chart_metadata.py stamp \
            --chart "$RUNNER_TEMP/cc-lb-chart/Chart.yaml" \
            --revision "$SOURCE_SHA"
          helm lint "$RUNNER_TEMP/cc-lb-chart" \
            --set secrets.masterKey="$LINT_MASTER_KEY"
          helm package "$RUNNER_TEMP/cc-lb-chart" \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination "$RUNNER_TEMP"

      - name: Push chart
        if: steps.existing.outputs.already_published != 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: helm push "$RUNNER_TEMP/cc-lb-$VERSION.tgz" oci://ghcr.io/isac322/charts

      - name: Verify published chart
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/verify-chart"
          mkdir -p "$verify_dir"
          helm pull oci://ghcr.io/isac322/charts/cc-lb \
            --version "$VERSION" \
            --destination "$verify_dir"
          tar -xzf "$verify_dir/cc-lb-$VERSION.tgz" -C "$verify_dir"
          python3 scripts/chart_metadata.py verify \
            --chart "$verify_dir/cc-lb/Chart.yaml" \
            --version "$VERSION" \
            --revision "$SOURCE_SHA"
