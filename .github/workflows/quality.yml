name: quality

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CC_LB_ADMIN_SKIP_SPA: "1"

jobs:
  audit-redaction-lint:
    runs-on: oracle4-cc-lb
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: ripgrep
      - run: bash scripts/lint-audit-redaction.sh

  cargo-deny:
    runs-on: oracle4-cc-lb
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  cargo-llvm-cov:
    runs-on: oracle4-cc-lb
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install wasm targets for pinned toolchain
        run: rustup target add wasm32-wasip1 wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      # We share target/ across runs to let cargo's incremental fingerprint
      # skip third-party deps and unchanged cc-lb crates. The orphan-binary
      # leak this comment used to describe (tests/<file>-<hash> surviving a
      # branch switch) is prevented by hashing the implicit-built file set
      # (tests/, benches/, examples/, build.rs) into the cache key below,
      # so any add/remove/rename in those paths invalidates the cache.
      - name: Compute implicit-built file inventory hash
        id: inv
        shell: bash
        run: |
          set -euo pipefail
          inv_hash=$(
            command find . \
              \( -path './target' -o -path './node_modules' -o -path './.git' \) -prune -o \
              \( \
                -path '*/tests/*.rs' \
                -o -path '*/benches/*.rs' \
                -o -path '*/examples/*.rs' \
                -o -name 'build.rs' \
              \) \
              -type f -print 2>/dev/null \
            | sort \
            | sha256sum \
            | cut -c1-16
          )
          echo "hash=$inv_hash" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust-cache
        with:
          rust-cache-key: coverage-v2-${{ steps.inv.outputs.hash }}
          cache-targets: true
          # Slim target paths so tar+zstd has less data to compress on save and
          # less to decompress on restore. From diagnostic data:
          # target/llvm-cov-target/debug/{deps,build,.fingerprint} are required
          # for cargo Fresh fingerprint detection; examples/ (304 MB) and the
          # top-level cc-lb binary (285 MB) are produced but never run by
          # cargo-llvm-cov nextest, so they're excluded. Fixtures go to
          # target/wasm32-*/release. cargo regenerates missing CACHEDIR.TAG /
          # .rustc_info.json on the next run.
          target-paths: |
            target/llvm-cov-target/debug/.fingerprint
            target/llvm-cov-target/debug/deps
            target/llvm-cov-target/debug/build
            target/wasm32-wasip1/release
            target/wasm32-unknown-unknown/release
            crates/cc-lb-admin/web/dist
          stable-build-metadata: "true"

      # --profraw-only keeps build artifacts so cargo's fingerprint can skip
      # unchanged crates on cache hit. Only .profraw / .profdata are cleared.
      - name: Clean coverage profraw files
        run: cargo llvm-cov clean --workspace --profraw-only

      - name: Ensure cc-lb-admin SPA placeholder exists
        run: |
          DIST=crates/cc-lb-admin/web/dist
          if [ ! -f "$DIST/index.html" ]; then
            echo "web/dist missing; invalidating cc-lb-admin build script fingerprint to force regeneration"
            find target -path '*/.fingerprint/cc-lb-admin-*' -type d -exec rm -rf {} + 2>/dev/null || true
          fi
      - name: Build Extism echo fixture
        run: cargo build -p extism-echo-plugin --target wasm32-wasip1 --release
      - name: Build handshake spike fixture
        run: cargo build -p plugin-handshake-spike --target wasm32-unknown-unknown --release

      - name: Run tests with coverage instrumentation
        env:
          CARGO_LOG: cargo::core::compiler::fingerprint=info
        run: |
          cargo llvm-cov nextest \
            --workspace \
            --exclude cc-lb-loadgen \
            --exclude cc-lb-plugin-lifecycle-tests \
            --exclude plugin-api-key \
            --exclude plugin-oauth-anthropic-pro \
            --exclude plugin-internal-key-mapping \
            --exclude extism-pdk \
            --exclude extism-pdk-macros \
            --no-report \
            2>&1 | tee /tmp/cargo-verbose.log

      - name: Upload cargo verbose log for fingerprint analysis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-verbose-log
          path: /tmp/cargo-verbose.log
          if-no-files-found: warn

      - name: Generate workspace lcov report
        run: |
          cargo llvm-cov report \
            --lcov \
            --output-path target/coverage.lcov \
            --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'

      - name: Check per-package coverage gates
        run: |
          set -euo pipefail
          cargo llvm-cov report --package cc-lb-core                  --fail-under-lines 60 --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'
          cargo llvm-cov report --package cc-lb-dialect-anthropic     --fail-under-lines 80 --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'
          cargo llvm-cov report --package cc-lb-admin                 --fail-under-lines 60 --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'
          cargo llvm-cov report --package cc-lb-config                --fail-under-lines 60 --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'
          cargo llvm-cov report --package cc-lb-observability         --fail-under-lines 60 --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'
          cargo llvm-cov report --package cc-lb-plugin-api            --fail-under-lines 60 --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'
          cargo llvm-cov report --package cc-lb-runtime-extism        --fail-under-lines 60 --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'
          cargo llvm-cov report --package cc-lb-signer-anthropic-key  --fail-under-lines 60 --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'
          cargo llvm-cov report --package cc-lb-signer-anthropic-oauth --fail-under-lines 60 --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'
          cargo llvm-cov report --package cc-lb-server                --fail-under-lines 60 --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'
          cargo llvm-cov report --package cc-lb-storage-redb          --fail-under-lines 60 --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'

      - name: Show sccache stats
        if: always()
        run: |
          if [ -n "${SCCACHE_PATH:-}" ] && [ -x "$SCCACHE_PATH" ]; then
            "$SCCACHE_PATH" --show-stats
          elif command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task-43-coverage-lcov
          path: target/coverage.lcov
          if-no-files-found: error
