name: quality

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CC_LB_ADMIN_SKIP_SPA: "1"

jobs:
  audit-redaction-lint:
    runs-on: oracle4-cc-lb
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: ripgrep
      - run: bash scripts/lint-audit-redaction.sh

  cargo-deny:
    runs-on: oracle4-cc-lb
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  cargo-llvm-cov:
    runs-on: oracle4-cc-lb
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview
          targets: wasm32-wasip1, wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      # Registry-only: target/ must not be shared across branches. The
      # Swatinem cache key hashes Cargo.lock/Cargo.toml but not the test
      # file set, so a branch like oauth-refresh-cadence-tuning leaks its
      # tests/oauth_refresh_cadence-* binary into target/llvm-cov-target/
      # debug/deps/ and cargo invokes it on restore against a source tree
      # that never contained that file.
      - uses: ./.github/actions/setup-rust-cache
        with:
          rust-cache-key: coverage
          cache-targets: false
          stable-build-metadata: "true"

      - name: Clean coverage artifacts
        run: cargo llvm-cov clean --workspace
      - name: Build Extism echo fixture
        run: cargo build -p extism-echo-plugin --target wasm32-wasip1 --release
      - name: Build handshake spike fixture
        run: cargo build -p plugin-handshake-spike --target wasm32-unknown-unknown --release

      - name: Run tests with coverage instrumentation
        run: |
          cargo llvm-cov nextest \
            --workspace \
            --exclude cc-lb-loadgen \
            --exclude cc-lb-plugin-lifecycle-tests \
            --exclude plugin-api-key \
            --exclude plugin-oauth-anthropic-pro \
            --exclude plugin-internal-key-mapping \
            --exclude extism-pdk \
            --exclude extism-pdk-macros \
            --no-report

      - name: Generate workspace lcov report
        run: |
          cargo llvm-cov report \
            --lcov \
            --output-path target/coverage.lcov \
            --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'

      - name: Check per-package coverage gates
        run: |
          set -euo pipefail
          check_package() {
            cargo llvm-cov report \
              --package "$1" \
              --fail-under-lines "$2" \
              --ignore-filename-regex '^(tests/|fuzz/|examples/|third_party/|tests/fixtures/)'
          }

          pids=()
          check_package cc-lb-core 60 & pids+=("$!")
          check_package cc-lb-dialect-anthropic 80 & pids+=("$!")
          check_package cc-lb-admin 60 & pids+=("$!")
          check_package cc-lb-config 60 & pids+=("$!")
          check_package cc-lb-observability 60 & pids+=("$!")
          check_package cc-lb-plugin-api 60 & pids+=("$!")
          check_package cc-lb-runtime-extism 60 & pids+=("$!")
          check_package cc-lb-signer-anthropic-key 60 & pids+=("$!")
          check_package cc-lb-signer-anthropic-oauth 60 & pids+=("$!")
          check_package cc-lb-server 60 & pids+=("$!")
          check_package cc-lb-storage-redb 60 & pids+=("$!")

          failed=0
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
          exit "$failed"

      - name: Show sccache stats
        if: always()
        run: |
          if [ -n "${SCCACHE_PATH:-}" ] && [ -x "$SCCACHE_PATH" ]; then
            "$SCCACHE_PATH" --show-stats
          elif command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task-43-coverage-lcov
          path: target/coverage.lcov
          if-no-files-found: error
