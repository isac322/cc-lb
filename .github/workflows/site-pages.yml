name: Publish documentation site

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'assets/brand/**'
      - 'assets/media/**'
      - 'docs/runtime-management.md'
      - 'docs/upstream-warmup.md'
      - 'docs/scheduler.md'
      - 'docs/plugin-author-guide.md'
      - '.github/workflows/site-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Configure Pages
        # Build while private; Pages is enabled later by the public-site IaC.
        if: github.event.repository.private == false && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install site dependencies
        run: bun install --frozen-lockfile
      - name: Build site
        env:
          # Public Cloudflare Web Analytics site token; empty for PRs, forks, private, and non-master builds.
          PUBLIC_ANALYTICS_TOKEN: ${{ github.repository == 'isac322/cc-lb' && github.ref == 'refs/heads/master' && github.event.repository.private == false && github.event.repository.fork == false && vars.PUBLIC_ANALYTICS_TOKEN || '' }}
        run: bun run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.event.repository.private == false && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
