name: publish-check

# PR-stage validation that cc-lb-plugin-api remains publish-ready.
# Catches manifest regressions (missing description/license/repository,
# excluded source files, broken workspace inheritance) before they reach
# the release workflow. After the Extism removal sweep the published set
# degenerated from the historical trio (cc-lb-pdk / cc-lb-plugin-wire /
# cc-lb-plugin-api) to a solo crate; the matrix shrinks to match.

on:
  pull_request:
    paths:
      - 'crates/cc-lb-plugin-api/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'release-plz.toml'
      - '.github/workflows/publish-check.yml'

permissions:
  contents: read

concurrency:
  group: publish-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: ${{ matrix.crate }}
    runs-on: oracle4-cc-lb
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: cc-lb-plugin-api
            mode: publish
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-rust-cache

      - name: cargo publish --dry-run
        if: matrix.mode == 'publish'
        run: cargo publish --dry-run -p ${{ matrix.crate }}

      - name: cargo check
        if: matrix.mode == 'check'
        run: cargo check -p ${{ matrix.crate }} --all-targets
