name: publish-check

# PR-stage validation for the approved runtime/conformance package release.
#
# The bug this workflow guards against: a public API change in one of the
# approved crates is made without a release-plz-compatible version bump or
# breaking-change marker. Workspace-local `cargo check` still passes because
# path deps resolve to the fresh source, so nothing downstream complains.
# release-plz then publishes a package with an incompatible API contract.
# semver-checks catches that break at the source crate before publishing.
#
# This package-only gate intentionally excludes cc-lb-plugin-wire. Wire has a
# separate pending release, and unrelated wire drift must not block this
# approved runtime/conformance release.
#
# Checks:
#
# 1. cargo-semver-checks on exactly the approved publish=true crates:
#    cc-lb-runtime-wasmtime and cc-lb-plugin-conformance. It compares the
#    current source's public API against the last published version and fails
#    when a breaking change is not matched by a semver-appropriate version bump
#    or declared as a breaking change (`type(scope)!:` /
#    `BREAKING CHANGE:`) since the crate's last release tag. release-plz owns
#    the actual version bump. Full history and tags are required.
#
# 2. No cargo publish --dry-run is run in this preflight. Runtime/conformance
#    workspace dependencies are typically not yet published at PR-review
#    time, so dry-run would fail on unpublished-dependency resolution instead
#    of catching a real package bug. The release-plz trusted publish job
#    validates the final package.

on:
  pull_request:
    paths:
      - 'crates/cc-lb-plugin-wire/**'
      - 'crates/cc-lb-pdk-wasmtime/**'
      - 'crates/cc-lb-pdk-wasmtime-macros/**'
      - 'crates/cc-lb-plugin-conformance/**'
      - 'crates/cc-lb-runtime-wasmtime/**'
      - 'crates/cc-lb-storage-api/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'release-plz.toml'
      - '.github/workflows/publish-check.yml'
      - '.github/actions/check-published-crates/action.yml'

permissions:
  contents: read

concurrency:
  group: publish-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  published-crates:
    name: approved runtime/conformance crates
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/check-published-crates
        with:
          stable-build-metadata: "true"
