name: postgres scheduled

env:
  CC_LB_ADMIN_SKIP_SPA: "1"
  # Scheduled storage/server scenarios do not run fixture-backed Wasmtime tests.
  CC_LB_SKIP_WASM_FIXTURE_BUILD: "1"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-storage-stress:
    name: Postgres storage stress
    runs-on: cc-lb-2
    container:
      image: ghcr.io/isac322/cc-lb-actions-runner:2.338.0-cclb-a65132b3c9d7@sha256:d319c98e776daac3a8fb00c19780dd896c3e828675b1c8a77273a22373f57b55

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: cc_lb_test
        # No `ports`: the k8s container hook turns them into hostPorts, which
        # collide when two jobs land on one node. The job reaches the service
        # on localhost through the shared pod network.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CI_POSTGRES_URL: postgres://postgres:testpw@localhost:5432/cc_lb_test

    steps:
      - uses: actions/checkout@v7
      - name: Export isolated Rustup home
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
      - name: Verify baked Rustup bootstrap
        working-directory: ${{ runner.temp }}
        run: |
          command -v rustup
          rustup --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Setup Rust cache
        run: |
          {
            echo "CARGO_INCREMENTAL=0"
            echo "GIT_SHA=0000000"
            echo "SOURCE_DATE_EPOCH=0"
          } >> "$GITHUB_ENV"
          export SCCACHE_BASEDIRS="$GITHUB_WORKSPACE"
          sccache_path="$(command -v sccache || true)"
          rustc_path="$(command -v rustc || true)"
          if [ -n "$sccache_path" ] && [ -n "$rustc_path" ]; then
            "$sccache_path" --stop-server >/dev/null 2>&1 || true
            if "$sccache_path" "$rustc_path" -vV >/dev/null 2>&1; then
              {
                echo "SCCACHE_PATH=$sccache_path"
                echo "RUSTC_WRAPPER=sccache"
                echo "SCCACHE_BASEDIRS=$GITHUB_WORKSPACE"
              } >> "$GITHUB_ENV"
            else
              "$sccache_path" --stop-server >/dev/null 2>&1 || true
              echo "::warning::sccache compiler-wrapper probe failed; continuing with uncached rustc"
            fi
          else
            echo "::warning::sccache is unavailable; continuing without compiler caching"
          fi

      - name: Run Postgres storage stress tests
        run: |
          cargo test -p cc-lb-storage-postgres \
            --test integration crash_recovery \
            -- --test-threads=1

      - name: Show sccache stats
        if: always()
        run: |
          if [ -n "${SCCACHE_PATH:-}" ] && [ -x "$SCCACHE_PATH" ]; then
            "$SCCACHE_PATH" --show-stats || echo "::warning::sccache stats unavailable; continuing without cache statistics"
          elif command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || echo "::warning::sccache stats unavailable; continuing without cache statistics"
          fi

  postgres-e2e:
    name: Postgres E2E and chaos
    runs-on: cc-lb-2
    container:
      image: ghcr.io/isac322/cc-lb-actions-runner:2.338.0-cclb-a65132b3c9d7@sha256:d319c98e776daac3a8fb00c19780dd896c3e828675b1c8a77273a22373f57b55

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: cc_lb_test
        # No `ports`: the k8s container hook turns them into hostPorts, which
        # collide when two jobs land on one node. The job reaches the service
        # on localhost through the shared pod network.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CI_POSTGRES_URL: postgres://postgres:testpw@localhost:5432/cc_lb_test

    steps:
      - uses: actions/checkout@v7
      - name: Export isolated Rustup home
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
      - name: Verify baked Rustup bootstrap
        working-directory: ${{ runner.temp }}
        run: |
          command -v rustup
          rustup --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Setup Rust cache
        run: |
          {
            echo "CARGO_INCREMENTAL=0"
            echo "GIT_SHA=0000000"
            echo "SOURCE_DATE_EPOCH=0"
          } >> "$GITHUB_ENV"
          export SCCACHE_BASEDIRS="$GITHUB_WORKSPACE"
          sccache_path="$(command -v sccache || true)"
          rustc_path="$(command -v rustc || true)"
          if [ -n "$sccache_path" ] && [ -n "$rustc_path" ]; then
            "$sccache_path" --stop-server >/dev/null 2>&1 || true
            if "$sccache_path" "$rustc_path" -vV >/dev/null 2>&1; then
              {
                echo "SCCACHE_PATH=$sccache_path"
                echo "RUSTC_WRAPPER=sccache"
                echo "SCCACHE_BASEDIRS=$GITHUB_WORKSPACE"
              } >> "$GITHUB_ENV"
            else
              "$sccache_path" --stop-server >/dev/null 2>&1 || true
              echo "::warning::sccache compiler-wrapper probe failed; continuing with uncached rustc"
            fi
          else
            echo "::warning::sccache is unavailable; continuing without compiler caching"
          fi

      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.9.0
      - name: Export cargo-installed tools
        run: echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
      - name: Verify sqlx-cli
        run: command -v sqlx

      - name: Run Postgres migrations
        run: sqlx migrate run --source crates/cc-lb-storage-postgres/migrations
        env:
          DATABASE_URL: ${{ env.CI_POSTGRES_URL }}

      # db_unreachable_503 stops Postgres via docker CLI; kubernetes service
      # containers are not stoppable from the job, so this chaos case stays skipped.

      - name: Ensure psql is available
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            echo "::error::psql is required on the runner image"
            exit 1
          fi
          psql --version

      - name: E2E smoke - cc-lb binary against postgres backend
        run: ./tests/real-client/postgres-smoke.sh

      - name: Show sccache stats
        if: always()
        run: |
          if [ -n "${SCCACHE_PATH:-}" ] && [ -x "$SCCACHE_PATH" ]; then
            "$SCCACHE_PATH" --show-stats || echo "::warning::sccache stats unavailable; continuing without cache statistics"
          elif command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || echo "::warning::sccache stats unavailable; continuing without cache statistics"
          fi
