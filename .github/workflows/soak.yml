name: Soak

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

jobs:
  rss-soak:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run 24h RSS soak
        run: bash tests/soak/soak.sh 24h
      - name: Upload soak CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-41-soak-rss
          path: .omo/evidence/task-41-soak-24h.csv
          if-no-files-found: error
