name: Soak

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rss-soak:
    if: github.ref == 'refs/heads/master'
    runs-on: oracle4-cc-lb
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: ./.github/actions/setup-rust-cache
        with:
          rust-cache-key: soak-rss
      - name: Run 24h RSS soak
        run: bash tests/soak/soak.sh 24h
      - name: Show sccache stats
        if: always()
        run: |
          if [ -n "${SCCACHE_PATH:-}" ] && [ -x "$SCCACHE_PATH" ]; then
            "$SCCACHE_PATH" --show-stats
          elif command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          fi
      - name: Upload soak CSV
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task-41-soak-rss
          path: .omo/evidence/task-41-soak-24h.csv
          if-no-files-found: error
