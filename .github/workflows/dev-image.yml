name: publish-dev-image

on:
  push:
    branches:
      - dev
  workflow_dispatch:

# A later push supersedes an older build; only the newest completed build may
# publish the mutable dev tag.
concurrency:
  group: publish-dev-image-dev
  cancel-in-progress: true

permissions: {}

jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    name: build and verify dev image
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out triggering revision
        uses: actions/checkout@v7
        with:
          # github.sha is the immutable commit that caused this push event.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve source metadata
        id: source
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
          echo "CACHE_KEY=docker-mounts-thin-arm64-$sha" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore BuildKit cache mounts
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/docker-mounts.tar
          key: ${{ env.CACHE_KEY }}
          restore-keys: |
            docker-mounts-thin-arm64-

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Inject restored BuildKit cache mounts
        if: steps.cache-restore.outputs.cache-matched-key != ''
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          ctx="$RUNNER_TEMP/buildkit-cache-inject"
          rm -rf "$ctx"
          mkdir -p "$ctx"
          mv "$RUNNER_TEMP/docker-mounts.tar" "$ctx/docker-mounts.tar"
          cat > "$ctx/Dockerfile" <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.24 AS inject
          COPY docker-mounts.tar /docker-mounts.tar
          RUN --mount=type=cache,id=cargo-home,sharing=shared,target=/cargo-home \
              --mount=type=cache,id=bun-linux-arm64,target=/bun \
              --mount=type=cache,id=sccache,sharing=shared,target=/sccache \
              tar -C / -xf /docker-mounts.tar && \
              mkdir -p /out && \
              du -sk /cargo-home /bun /sccache > /out/restored.txt
          FROM scratch
          COPY --from=inject /out/ /
          EOF
          docker buildx build --builder "$BUILDER" --progress=plain --output "type=local,dest=$ctx/out" "$ctx"
          cat "$ctx/out/restored.txt"
          rm -rf "$ctx"
      - name: Build and push arm64 dev image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: distroless
          platforms: linux/arm64
          push: true
          tags: ghcr.io/isac322/cc-lb:dev
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          build-args: |
            GIT_SHA=${{ steps.source.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.source_date_epoch }}
            CARGO_BUILD_JOBS=4
            CARGO_PROFILE_RELEASE_LTO=thin
            CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
            SCCACHE_LOCAL_MOUNT=1
            REQUIRE_SCCACHE=1
          # Avoid an unknown/unknown attestation entry in the mutable tag. The
          # remote verification below must see exactly one runnable platform.
          provenance: false


      - name: Extract populated BuildKit cache mounts
        if: steps.cache-restore.outputs.cache-hit != 'true'
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          ctx="$RUNNER_TEMP/buildkit-cache-extract"
          rm -rf "$ctx" "$RUNNER_TEMP/docker-mounts.tar"
          mkdir -p "$ctx"
          cat > "$ctx/Dockerfile" <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.24 AS extract
          RUN --mount=type=cache,id=cargo-home,sharing=shared,target=/cargo-home \
              --mount=type=cache,id=bun-linux-arm64,target=/bun \
              --mount=type=cache,id=sccache,sharing=shared,target=/sccache \
              mkdir -p /out && \
              du -sk /cargo-home /bun /sccache > /out/extracted.txt && \
              tar -C / -cf /out/docker-mounts.tar cargo-home bun sccache
          FROM scratch
          COPY --from=extract /out/ /
          EOF
          docker buildx build --builder "$BUILDER" --progress=plain --output "type=local,dest=$ctx/out" "$ctx"
          cat "$ctx/out/extracted.txt"
          mv "$ctx/out/docker-mounts.tar" "$RUNNER_TEMP/docker-mounts.tar"
          test -s "$RUNNER_TEMP/docker-mounts.tar"
          rm -rf "$ctx"

      - name: Save BuildKit cache mounts
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/docker-mounts.tar
          key: ${{ env.CACHE_KEY }}
      - name: Verify remote image platform and revision
        env:
          IMAGE: ghcr.io/isac322/cc-lb:dev
          EXPECTED_REVISION: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          raw_file="$RUNNER_TEMP/dev-image-manifest.json"
          if ! docker buildx imagetools inspect "$IMAGE" --raw > "$raw_file"; then
            echo "::error::could not inspect published image $IMAGE" >&2
            exit 1
          fi

          labels=
          if jq -e 'has("manifests")' "$raw_file" > /dev/null; then
            manifest_count=$(jq '.manifests | length' "$raw_file")
            if [ "$manifest_count" -ne 1 ]; then
              echo "::error::published image has $manifest_count manifests; expected exactly one linux/arm64 manifest" >&2
              exit 1
            fi

            platform_os=$(jq -r '.manifests[0].platform.os // empty' "$raw_file")
            platform_arch=$(jq -r '.manifests[0].platform.architecture // empty' "$raw_file")
            platform_variant=$(jq -r '.manifests[0].platform.variant // empty' "$raw_file")
            if [ "$platform_os" != "linux" ] || [ "$platform_arch" != "arm64" ] || {
              [ -n "$platform_variant" ] && [ "$platform_variant" != "v8" ];
            }; then
              echo "::error::published image platform is ${platform_os}/${platform_arch}${platform_variant:+/$platform_variant}; expected linux/arm64" >&2
              exit 1
            fi

            digest=$(jq -r '.manifests[0].digest // empty' "$raw_file")
            if [ -z "$digest" ]; then
              echo "::error::published image manifest has no digest" >&2
              exit 1
            fi
            labels=$(docker buildx imagetools inspect "${IMAGE%@*}@$digest" \
              --format '{{json .Image.Config.Labels}}')
          else
            image_info=$(docker buildx imagetools inspect "$IMAGE" \
              --format '{{json .Image}}')
            platform_os=$(jq -r '.os // empty' <<<"$image_info")
            platform_arch=$(jq -r '.architecture // empty' <<<"$image_info")
            platform_variant=$(jq -r '.variant // empty' <<<"$image_info")
            if [ "$platform_os" != "linux" ] || [ "$platform_arch" != "arm64" ] || {
              [ -n "$platform_variant" ] && [ "$platform_variant" != "v8" ];
            }; then
              echo "::error::published image platform is ${platform_os}/${platform_arch}${platform_variant:+/$platform_variant}; expected linux/arm64" >&2
              exit 1
            fi
            labels=$(jq -c '.config.Labels // {}' <<<"$image_info")
          fi

          revision=$(jq -r '."org.opencontainers.image.revision" // empty' <<<"$labels")
          if [ "$revision" != "$EXPECTED_REVISION" ]; then
            echo "::error::published image revision '$revision' does not match '$EXPECTED_REVISION'" >&2
            exit 1
          fi

          echo "verified $IMAGE: linux/arm64 at revision $revision"
