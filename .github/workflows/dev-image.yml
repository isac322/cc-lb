name: publish-dev-image

on:
  push:
    branches:
      - dev
  workflow_dispatch:

# A later push supersedes an older build; only the newest completed build may
# publish the mutable dev tag.
concurrency:
  group: publish-dev-image-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  publish:
    if: github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch'
    name: build and verify dev image
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Check out triggering revision
        uses: actions/checkout@v7
        with:
          # github.sha is the immutable commit that caused this push/dispatch event.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve source and cache metadata
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          LOCK_HASH: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml', 'scripts/docker-build-musl.sh', 'Dockerfile') }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          rust_version=$(sed -n -E 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml)
          if [ "$REF_NAME" = "refs/heads/dev" ]; then
            dry_run=false
            cache_prefix="dev-target-v2-arm64-${rust_version}"
            prune_prefix="dev-target-v2-arm64-"
            legacy_prefix="dev-target-v1-arm64-"
            image_tag="ghcr.io/isac322/cc-lb:dev"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            dry_run=true
            cache_prefix="dev-target-dryrun-v2-arm64-${rust_version}"
            prune_prefix="dev-target-dryrun-v2-arm64-"
            legacy_prefix="dev-target-dryrun-v1-arm64-"
            image_tag="cc-lb:dev-dry-run"
          else
            echo "::error::unexpected ref '$REF_NAME' for event '$EVENT_NAME'"
            exit 1
          fi
          lock_prefix="${cache_prefix}-${LOCK_HASH}"
          cache_key="${lock_prefix}-${sha}"
          {
            echo "sha=$sha"
            echo "short_sha=${sha:0:7}"
            echo "build_time_epoch=$(git log -1 --format=%ct)"
            echo "version=$version"
            echo "rust_version=$rust_version"
            echo "dry_run=$dry_run"
            echo "cache_prefix=$cache_prefix"
            echo "prune_prefix=$prune_prefix"
            echo "legacy_prefix=$legacy_prefix"
            echo "lock_prefix=$lock_prefix"
            echo "cache_key=$cache_key"
            echo "image_tag=$image_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Admin SPA dist
        uses: ./.github/actions/setup-admin-spa

      - name: Cache shared Cargo registry and git db
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-registry-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-v2-${{ runner.os }}-

      - name: Restore rolling dev Cargo target cache
        id: target-restore
        uses: actions/cache/restore@v6
        with:
          path: target
          key: ${{ steps.source.outputs.cache_key }}
          restore-keys: |
            ${{ steps.source.outputs.lock_prefix }}-

      - name: Evaluate target cache and restore workspace mtimes
        id: target-match
        env:
          MATCHED_KEY: ${{ steps.target-restore.outputs.cache-matched-key }}
          LOCK_PREFIX: ${{ steps.source.outputs.lock_prefix }}-
        run: |
          set -euo pipefail
          if [ -n "$MATCHED_KEY" ] && [[ "$MATCHED_KEY" == "$LOCK_PREFIX"* ]]; then
            echo "lock_cache_hit=true" >> "$GITHUB_OUTPUT"
            node scripts/ws-mtimes.mjs restore --in target/aarch64-unknown-linux-musl/release/.ws-mtimes.json
          else
            echo "lock_cache_hit=false" >> "$GITHUB_OUTPUT"
            if [ -n "$MATCHED_KEY" ]; then
              echo "Lockfile/toolchain changed (matched $MATCHED_KEY); clearing stale target dir"
              rm -rf target
            fi
          fi

      - name: Compile static arm64 dev binary
        env:
          TARGET_PLATFORM: linux/arm64
          OUT_BIN: ${{ runner.temp }}/stage-ctx/cc-lb
          GIT_SHA: ${{ steps.source.outputs.sha }}
          BUILD_TIME_EPOCH: ${{ steps.source.outputs.build_time_epoch }}
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_INCREMENTAL: "1"
          CARGO_BUILD_JOBS: "4"
        run: ./scripts/docker-build-musl.sh

      - name: Package and smoke-test distroless arm64 dev image
        env:
          IMAGE_TAG: ${{ steps.source.outputs.image_tag }}
          EXPECTED_VERSION: ${{ steps.source.outputs.version }}
          EXPECTED_SHORT_SHA: ${{ steps.source.outputs.short_sha }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          STAGE_CTX: ${{ runner.temp }}/stage-ctx
        run: |
          set -euo pipefail
          # Disable provenance/SBOM attestations so `docker push` publishes a single
          # linux/arm64 manifest without an unknown/unknown attestation entry.
          docker buildx build \
            --load \
            --provenance=false \
            --sbom=false \
            --file "${GITHUB_WORKSPACE}/Dockerfile" \
            --target distroless-prebuilt \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --tag "${IMAGE_TAG}" \
            "${STAGE_CTX}"
          version_out=$(docker run --rm "${IMAGE_TAG}" --version)
          printf '%s\n' "$version_out"
          grep -Fq "$EXPECTED_VERSION" <<<"$version_out"
          grep -Fq "$EXPECTED_SHORT_SHA" <<<"$version_out"

      - name: Log in to ghcr.io
        if: steps.source.outputs.dry_run != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push arm64 dev image
        if: steps.source.outputs.dry_run != 'true'
        env:
          IMAGE_TAG: ${{ steps.source.outputs.image_tag }}
        run: docker push "$IMAGE_TAG"

      - name: Prune and save dev Cargo target cache
        if: steps.target-restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          node scripts/prune-rust-target.mjs \
            --target-dir target \
            --metadata-file target/.cargo-metadata.json \
            --keep-workspace-libs \
            --keep-latest-incremental \
            --incremental-crates cc-lb-server,cc-lb-engine,cc-lb-admin,cc-lb-storage-postgres,cc-lb-storage-sqlite,cc-lb-control,cc-lb-scheduler \
            --prune-build-objects
          node scripts/ws-mtimes.mjs record \
            --out target/aarch64-unknown-linux-musl/release/.ws-mtimes.json \
            --extra-dir crates/cc-lb-admin/web/dist
          du -sh target || true
          du -sh target/aarch64-unknown-linux-musl/release/* 2>/dev/null || true
          du -sh target/release 2>/dev/null || true

      - name: Upload dev Cargo target cache
        if: steps.target-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: target
          key: ${{ steps.source.outputs.cache_key }}

      - name: Prune superseded dev-image caches
        if: steps.target-restore.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_KEY: ${{ steps.source.outputs.cache_key }}
          PRUNE_PREFIX: ${{ steps.source.outputs.prune_prefix }}
          LEGACY_PREFIX: ${{ steps.source.outputs.legacy_prefix }}
          DRY_RUN: ${{ steps.source.outputs.dry_run }}
          TARGET_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          stale_ids=$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/caches?ref=${TARGET_REF}&per_page=100" \
            --jq '
              .actions_caches[]
              | select(
                  (
                    (.key | startswith(env.PRUNE_PREFIX)) or
                    (.key | startswith(env.LEGACY_PREFIX)) or
                    (env.DRY_RUN != "true" and ((.key | startswith("docker-mounts-off-arm64-")) or (.key | startswith("docker-mounts-thin-arm64-"))))
                  )
                  and .key != env.CURRENT_KEY
                )
              | .id
            ') || true
          for id in $stale_ids; do
            gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches/${id}" >/dev/null || true
          done

      - name: Verify remote image platform and revision
        if: steps.source.outputs.dry_run != 'true'
        env:
          IMAGE: ghcr.io/isac322/cc-lb:dev
          EXPECTED_REVISION: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          raw_file="$RUNNER_TEMP/dev-image-manifest.json"
          if ! docker buildx imagetools inspect "$IMAGE" --raw > "$raw_file"; then
            echo "::error::could not inspect published image $IMAGE" >&2
            exit 1
          fi

          labels=
          if jq -e 'has("manifests")' "$raw_file" > /dev/null; then
            manifest_count=$(jq '.manifests | length' "$raw_file")
            if [ "$manifest_count" -ne 1 ]; then
              echo "::error::published image has $manifest_count manifests; expected exactly one linux/arm64 manifest" >&2
              exit 1
            fi

            platform_os=$(jq -r '.manifests[0].platform.os // empty' "$raw_file")
            platform_arch=$(jq -r '.manifests[0].platform.architecture // empty' "$raw_file")
            platform_variant=$(jq -r '.manifests[0].platform.variant // empty' "$raw_file")
            if [ "$platform_os" != "linux" ] || [ "$platform_arch" != "arm64" ] || {
              [ -n "$platform_variant" ] && [ "$platform_variant" != "v8" ];
            }; then
              echo "::error::published image platform is ${platform_os}/${platform_arch}${platform_variant:+/$platform_variant}; expected linux/arm64" >&2
              exit 1
            fi

            digest=$(jq -r '.manifests[0].digest // empty' "$raw_file")
            if [ -z "$digest" ]; then
              echo "::error::published image manifest has no digest" >&2
              exit 1
            fi
            labels=$(docker buildx imagetools inspect "${IMAGE%@*}@$digest" \
              --format '{{json .Image.Config.Labels}}')
          else
            image_info=$(docker buildx imagetools inspect "$IMAGE" \
              --format '{{json .Image}}')
            platform_os=$(jq -r '.os // empty' <<<"$image_info")
            platform_arch=$(jq -r '.architecture // empty' <<<"$image_info")
            platform_variant=$(jq -r '.variant // empty' <<<"$image_info")
            if [ "$platform_os" != "linux" ] || [ "$platform_arch" != "arm64" ] || {
              [ -n "$platform_variant" ] && [ "$platform_variant" != "v8" ];
            }; then
              echo "::error::published image platform is ${platform_os}/${platform_arch}${platform_variant:+/$platform_variant}; expected linux/arm64" >&2
              exit 1
            fi
            labels=$(jq -c '.config.Labels // {}' <<<"$image_info")
          fi

          revision=$(jq -r '."org.opencontainers.image.revision" // empty' <<<"$labels")
          if [ "$revision" != "$EXPECTED_REVISION" ]; then
            echo "::error::published image revision '$revision' does not match '$EXPECTED_REVISION'" >&2
            exit 1
          fi

          echo "verified $IMAGE: linux/arm64 at revision $revision"
