name: postgres

env:
  CC_LB_ADMIN_SKIP_SPA: "1"

on:
  pull_request:
    paths:
      - 'crates/cc-lb-storage-*/**'
      - 'crates/cc-lb-config/**'
      - '.github/workflows/**'
  push:
    branches:
      - master
    paths:
      - 'crates/cc-lb-storage-*/**'
      - 'crates/cc-lb-config/**'
      - '.github/workflows/**'
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-build-matrix:
    name: Build ${{ matrix.build-variant }}
    runs-on: oracle4-cc-lb

    strategy:
      matrix:
        build-variant:
          - all-features
          - no-default-features

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-postgres-build-${{ matrix.build-variant }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build workspace (all features)
        if: matrix.build-variant == 'all-features'
        run: cargo build --workspace --all-features

      - name: Test workspace (all features)
        if: matrix.build-variant == 'all-features'
        run: cargo test --workspace --no-run --all-features

      - name: Build workspace (no default features)
        if: matrix.build-variant == 'no-default-features'
        run: cargo build --workspace --no-default-features

      - name: Test workspace (no default features)
        if: matrix.build-variant == 'no-default-features'
        run: cargo test --workspace --no-run --no-default-features

  postgres-conformance:
    name: Postgres conformance
    runs-on: oracle4-cc-lb

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: cc_lb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CI_POSTGRES_URL: postgres://postgres:testpw@localhost:5432/cc_lb_test

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-postgres-conformance-${{ hashFiles('**/Cargo.lock') }}

      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Run Postgres migrations
        run: sqlx migrate run --source crates/cc-lb-storage-postgres/migrations
        env:
          DATABASE_URL: ${{ env.CI_POSTGRES_URL }}

      - name: Run Postgres conformance tests
        run: cargo test -p cc-lb-storage-postgres --features postgres -- --test-threads=4

      - name: Run cc-lb-server Postgres tests
        run: cargo test -p cc-lb-server --features postgres,redb

      - name: Run cc-lb-server Postgres integration test (multi-instance)
        run: cargo test -p cc-lb-server --features postgres --test managed_key_multi_instance
        continue-on-error: true

      - name: Run cc-lb-server DB unreachable chaos test (ignored)
        run: cargo test -p cc-lb-server --features postgres --test db_unreachable_503 -- --ignored
        continue-on-error: true

      - name: E2E smoke - cc-lb binary against postgres backend
        run: ./tests/real-client/postgres-smoke.sh
