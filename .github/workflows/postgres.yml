name: postgres

env:
  CC_LB_ADMIN_SKIP_SPA: "1"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/cc-lb-storage-api/**'
      - 'crates/cc-lb-storage-conformance/**'
      - 'crates/cc-lb-storage-postgres/**'
      - 'crates/cc-lb-config/**'
      - 'crates/cc-lb-server/**'
      - 'tests/fixtures/postgres-pool-1.toml'
      - '.github/workflows/postgres*.yml'
  push:
    branches:
      - master
    paths:
      - 'crates/cc-lb-storage-api/**'
      - 'crates/cc-lb-storage-conformance/**'
      - 'crates/cc-lb-storage-postgres/**'
      - 'crates/cc-lb-config/**'
      - 'crates/cc-lb-server/**'
      - 'tests/fixtures/postgres-pool-1.toml'
      - '.github/workflows/postgres*.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    name: Postgres integration
    runs-on: oracle4-cc-lb

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: cc_lb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CI_POSTGRES_URL: postgres://postgres:testpw@localhost:5432/cc_lb_test

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm target for conformance fixtures
        run: rustup target add wasm32-unknown-unknown

      - uses: ./.github/actions/setup-rust-cache
        with:
          rust-cache-key: postgres-integration

      - name: Check workspace feature combinations
        if: github.event_name != 'pull_request'
        run: |
          cargo check --workspace --all-features
          cargo check --workspace --no-default-features

      - name: Run Postgres adapter unit tests
        run: cargo test -p cc-lb-storage-postgres --features postgres --lib

      - name: Run Postgres storage conformance tests
        run: |
          cargo test -p cc-lb-storage-conformance --features postgres \
            --test storage_roundtrips_postgres \
            --test managed_keys_postgres \
            --test managed_keys_cross_backend \
            -- --test-threads=4

      - name: Run cc-lb-server Postgres feature and integration tests
        run: |
          cargo test -p cc-lb-server --features postgres \
            --test bad_postgres_url_fatal \
            --test backend_kind_mismatch_fatal \
            --test restart_required_matrix \
            --test managed_key_multi_instance

      - name: Show sccache stats
        if: always()
        run: |
          if [ -n "${SCCACHE_PATH:-}" ] && [ -x "$SCCACHE_PATH" ]; then
            "$SCCACHE_PATH" --show-stats
          elif command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          fi
