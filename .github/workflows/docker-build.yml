name: docker-build

# Build the production image whenever Docker build inputs change, so source
# linker configuration and Dockerfile/.dockerignore edits cannot silently break
# the image (hadolint in deploy.yml only lints; it never actually compiles).
# Other source-only changes are covered by ci.yml and do not trigger this build.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.cargo/config.toml'
      - '.github/workflows/docker-build.yml'
  push:
    branches:
      - master
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.cargo/config.toml'
      - '.github/workflows/docker-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The self-hosted pool may schedule either an x86_64 or arm64 runner.
    # Dockerfile isolates host-only Cargo linker configuration, cross-compiles
    # the static musl binary with both storage backends, builds the SPA, and
    # runs a smoke test. Runner pods carry the in-cluster sccache S3 credentials.
    runs-on: oracle4-cc-lb-heavy
    steps:
      - uses: actions/checkout@v7
      - name: Resolve source revision
        id: source
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      # network=host + the network.host entitlement let the in-Docker build
      # reach the in-cluster Garage S3 endpoint (garage.arc-systems.svc).
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement network.host

      # Build every release target on Dockerfile changes so cross-compilation
      # failures are caught before publication.
      - name: Build all release targets
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le
          target: builder
          outputs: type=cacheonly
          network: host
          allow: network.host
          build-args: |
            GIT_SHA=${{ steps.source.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.source_date_epoch }}
            SCCACHE_BUCKET=sccache
            SCCACHE_ENDPOINT=http://garage.arc-systems.svc.cluster.local:3900
            SCCACHE_REGION=garage
            SCCACHE_S3_USE_SSL=false
            REQUIRE_SCCACHE=1
            SCCACHE_S3_KEY_PREFIX=cc-lb
          secret-envs: |
            AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: cc-lb:ci
          network: host
          allow: network.host
          build-args: |
            GIT_SHA=${{ steps.source.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.source_date_epoch }}
            SCCACHE_BUCKET=sccache
            SCCACHE_ENDPOINT=http://garage.arc-systems.svc.cluster.local:3900
            SCCACHE_REGION=garage
            SCCACHE_S3_USE_SSL=false
            REQUIRE_SCCACHE=1
            SCCACHE_S3_KEY_PREFIX=cc-lb
          secret-envs: |
            AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY

      # A successful build already proves both storage backends compile (default
      # FEATURES=sqlite,postgres); this just confirms the static binary runs.
      - name: Smoke test
        run: docker run --rm cc-lb:ci --version
