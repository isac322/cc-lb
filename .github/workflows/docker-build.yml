name: docker-build

# Build the production image whenever Docker build inputs change, so source
# linker configuration and Dockerfile/.dockerignore edits cannot silently break
# the image (hadolint in deploy.yml only lints; it never actually compiles).
# Other source-only changes are covered by ci.yml and do not trigger this build.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.cargo/config.toml'
      - '.github/workflows/docker-build.yml'
  push:
    branches:
      - master
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.cargo/config.toml'
      - '.github/workflows/docker-build.yml'

concurrency:
  group: docker-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    # The self-hosted pool may schedule either an x86_64 or arm64 runner.
    # Dockerfile isolates host-only Cargo linker configuration, cross-compiles
    # the static musl binary with both storage backends, builds the SPA, and
    # runs a smoke test. Runner pods carry the in-cluster sccache S3 credentials.
    runs-on: cc-lb-500m
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/export-sccache-env
      - name: Resolve source revision
        id: source
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      # Builds run on the in-cluster BuildKit daemon (same cluster as versitygw).
      - uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkit.arc-systems.svc.cluster.local:1234

      # Trim unused records to leave disk headroom for target directories.
      # BuildKit keeps records leased by builds that are still running.
      - name: Prune stale BuildKit build cache
        run: docker buildx prune --force --all --max-used-space 20GB || true

      # Limit each solve to two concurrent target directories; four exhausted
      # the BuildKit worker before arm/v7 and ppc64le could finish.
      - name: Build primary release targets
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: builder
          outputs: type=cacheonly
          build-args: |
            CARGO_BUILD_JOBS=1
            CARGO_PROFILE_RELEASE_LTO=thin
            GIT_SHA=${{ steps.source.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.source_date_epoch }}
            SCCACHE_BUCKET=${{ env.SCCACHE_BUCKET }}
            SCCACHE_ENDPOINT=${{ env.SCCACHE_ENDPOINT }}
            SCCACHE_REGION=${{ env.SCCACHE_REGION }}
            SCCACHE_S3_USE_SSL=${{ env.SCCACHE_S3_USE_SSL }}
            SCCACHE_S3_KEY_PREFIX=${{ env.SCCACHE_S3_KEY_PREFIX }}
          secret-envs: |
            AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY

      - name: Build image and smoke-test binary
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          target: smoke
          outputs: type=cacheonly
          build-args: |
            CARGO_BUILD_JOBS=1
            CARGO_PROFILE_RELEASE_LTO=thin
            GIT_SHA=${{ steps.source.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.source_date_epoch }}
            SCCACHE_BUCKET=${{ env.SCCACHE_BUCKET }}
            SCCACHE_ENDPOINT=${{ env.SCCACHE_ENDPOINT }}
            SCCACHE_REGION=${{ env.SCCACHE_REGION }}
            SCCACHE_S3_USE_SSL=${{ env.SCCACHE_S3_USE_SSL }}
            SCCACHE_S3_KEY_PREFIX=${{ env.SCCACHE_S3_KEY_PREFIX }}
          secret-envs: |
            AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY

      - name: Prune intermediate BuildKit build cache
        run: docker buildx prune --force --all --max-used-space 20GB || true

      - name: Build remaining release targets
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm/v7,linux/ppc64le
          target: builder
          outputs: type=cacheonly
          build-args: |
            CARGO_BUILD_JOBS=1
            CARGO_PROFILE_RELEASE_LTO=thin
            GIT_SHA=${{ steps.source.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.source_date_epoch }}
            SCCACHE_BUCKET=${{ env.SCCACHE_BUCKET }}
            SCCACHE_ENDPOINT=${{ env.SCCACHE_ENDPOINT }}
            SCCACHE_REGION=${{ env.SCCACHE_REGION }}
            SCCACHE_S3_USE_SSL=${{ env.SCCACHE_S3_USE_SSL }}
            SCCACHE_S3_KEY_PREFIX=${{ env.SCCACHE_S3_KEY_PREFIX }}
          secret-envs: |
            AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY
