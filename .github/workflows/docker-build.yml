name: docker-build

# Build the production image whenever Docker build inputs change, so source
# linker configuration and Dockerfile/.dockerignore edits cannot silently break
# the image (hadolint in deploy.yml only lints; it never actually compiles).
# Other source-only changes are covered by ci.yml and do not trigger this build.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.cargo/config.toml'
      - '.github/workflows/docker-build.yml'
  push:
    branches:
      - master
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.cargo/config.toml'
      - '.github/workflows/docker-build.yml'

concurrency:
  group: docker-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.key }})
    # Distribute the four release architectures across native hosted runners so
    # each BuildKit worker compiles a single target with persisted cache mounts.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
            host: amd64
            smoke: true
          - key: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
            host: arm64
            smoke: true
          - key: armv7
            platform: linux/arm/v7
            runner: ubuntu-26.04-arm
            host: arm64
            smoke: false
          - key: ppc64le
            platform: linux/ppc64le
            runner: ubuntu-26.04-arm
            host: arm64
            smoke: false
    env:
      # docker/build-push-action uploads a per-step build record artifact
      # (docker-build-*); bound its retention so records do not outlive the
      # debugging window they exist for.
      DOCKER_BUILD_RECORD_RETENTION_DAYS: "7"
    steps:
      - uses: actions/checkout@v7
      - name: Resolve source revision
        id: source
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
          echo "CACHE_KEY=docker-mounts-thin-${{ matrix.key }}-$sha" >> "$GITHUB_ENV"

      - name: Restore BuildKit cache mounts
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/docker-mounts.tar
          key: ${{ env.CACHE_KEY }}
          restore-keys: |
            docker-mounts-thin-${{ matrix.key }}-

      - uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          driver: docker-container

      - name: Inject restored BuildKit cache mounts
        if: steps.cache-restore.outputs.cache-matched-key != ''
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
          HOST_ARCH: ${{ matrix.host }}
        run: |
          set -euo pipefail
          ctx="$RUNNER_TEMP/buildkit-cache-inject"
          rm -rf "$ctx"
          mkdir -p "$ctx"
          mv "$RUNNER_TEMP/docker-mounts.tar" "$ctx/docker-mounts.tar"
          cat > "$ctx/Dockerfile" <<EOF
          # syntax=docker/dockerfile:1
          FROM alpine:3.24 AS inject
          COPY docker-mounts.tar /docker-mounts.tar
          RUN --mount=type=cache,id=cargo-home,sharing=shared,target=/cargo-home \
              --mount=type=cache,id=bun-linux-${HOST_ARCH},target=/bun \
              --mount=type=cache,id=sccache,sharing=shared,target=/sccache \
              tar -C / -xf /docker-mounts.tar && \
              mkdir -p /out && \
              du -sk /cargo-home /bun /sccache > /out/restored.txt
          FROM scratch
          COPY --from=inject /out/ /
          EOF
          docker buildx build --builder "$BUILDER" --progress=plain --output "type=local,dest=$ctx/out" "$ctx"
          cat "$ctx/out/restored.txt"
          rm -rf "$ctx"

      - name: Build release target
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: ${{ matrix.platform }}
          target: builder
          outputs: type=cacheonly
          build-args: |
            CARGO_BUILD_JOBS=4
            CARGO_PROFILE_RELEASE_LTO=thin
            SCCACHE_LOCAL_MOUNT=1
            REQUIRE_SCCACHE=1
            GIT_SHA=${{ steps.source.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.source_date_epoch }}

      - name: Smoke-test native binary
        if: matrix.smoke
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: ${{ matrix.platform }}
          target: smoke
          outputs: type=cacheonly
          build-args: |
            CARGO_BUILD_JOBS=4
            CARGO_PROFILE_RELEASE_LTO=thin
            SCCACHE_LOCAL_MOUNT=1
            REQUIRE_SCCACHE=1
            GIT_SHA=${{ steps.source.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.source_date_epoch }}

      - name: Extract populated BuildKit cache mounts
        if: github.ref == 'refs/heads/master' && steps.cache-restore.outputs.cache-hit != 'true'
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
          HOST_ARCH: ${{ matrix.host }}
        run: |
          set -euo pipefail
          ctx="$RUNNER_TEMP/buildkit-cache-extract"
          rm -rf "$ctx" "$RUNNER_TEMP/docker-mounts.tar"
          mkdir -p "$ctx"
          cat > "$ctx/Dockerfile" <<EOF
          # syntax=docker/dockerfile:1
          FROM alpine:3.24 AS extract
          RUN --mount=type=cache,id=cargo-home,sharing=shared,target=/cargo-home \
              --mount=type=cache,id=bun-linux-${HOST_ARCH},target=/bun \
              --mount=type=cache,id=sccache,sharing=shared,target=/sccache \
              mkdir -p /out && \
              du -sk /cargo-home /bun /sccache > /out/extracted.txt && \
              tar -C / -cf /out/docker-mounts.tar cargo-home bun sccache
          FROM scratch
          COPY --from=extract /out/ /
          EOF
          docker buildx build --builder "$BUILDER" --progress=plain --output "type=local,dest=$ctx/out" "$ctx"
          cat "$ctx/out/extracted.txt"
          mv "$ctx/out/docker-mounts.tar" "$RUNNER_TEMP/docker-mounts.tar"
          test -s "$RUNNER_TEMP/docker-mounts.tar"
          rm -rf "$ctx"

      - name: Save BuildKit cache mounts
        if: github.ref == 'refs/heads/master' && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/docker-mounts.tar
          key: ${{ env.CACHE_KEY }}
