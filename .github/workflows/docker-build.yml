name: docker-build

# Build the production image whenever Docker build inputs change, so source
# linker configuration and Dockerfile/.dockerignore edits cannot silently break
# the image (hadolint in deploy.yml only lints; it never actually compiles).
# Other source-only changes are covered by ci.yml and do not trigger this build.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.cargo/config.toml'
      - '.github/workflows/docker-build.yml'
  push:
    branches:
      - master
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.cargo/config.toml'
      - '.github/workflows/docker-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The self-hosted pool may schedule either an x86_64 or arm64 runner.
    # Dockerfile isolates host-only Cargo linker configuration, cross-compiles
    # the static musl binary with both storage backends, builds the SPA, and
    # runs a smoke test. Runner pods carry the in-cluster sccache S3 credentials.
    runs-on: oracle4-cc-lb
    steps:
      - uses: actions/checkout@v7

      # network=host + the network.host entitlement let the in-Docker build
      # reach the in-cluster Garage S3 endpoint (garage.example-build.svc).
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement network.host

      # Builds the DEFAULT (distroless) target. secret-envs forwards the runner
      # pod's AWS_* OS env vars into the build as BuildKit secrets (the Dockerfile
      # reads them via --mount=type=secret); the non-secret sccache S3 config goes
      # in as build-args. Fail-open: without creds the Dockerfile compiles uncached.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: cc-lb:ci
          network: host
          allow: network.host
          build-args: |
            GIT_SHA=0000000
            SOURCE_DATE_EPOCH=0
            SCCACHE_BUCKET=sccache
            SCCACHE_ENDPOINT=http://buildkit.example.com:3900
            SCCACHE_REGION=garage
            SCCACHE_S3_USE_SSL=false
          secret-envs: |
            AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY

      # A successful build already proves both storage backends compile (default
      # FEATURES=sqlite,postgres); this just confirms the static binary runs.
      - name: Smoke test
        run: docker run --rm cc-lb:ci --version
