name: docker-build

# Build the production image whenever the Docker build inputs change, so a
# Dockerfile/.dockerignore edit can't silently break the image (hadolint in
# deploy.yml only lints; it never actually compiles). Source-only changes are
# covered by ci.yml and deliberately do NOT trigger this build.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
  push:
    branches:
      - master
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Self-hosted arm64 runner. A full uncached build (~50min) that proves the
    # real image cross-compiles the static musl binary, builds the SPA, and runs.
    runs-on: oracle4-cc-lb
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Builds the DEFAULT (distroless) target: cross-compiles the static musl
      # binary (both storage backends) and builds the dashboard SPA.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: cc-lb:ci
          build-args: |
            GIT_SHA=0000000
            SOURCE_DATE_EPOCH=0

      # A successful build already proves both storage backends compile (default
      # FEATURES=sqlite,postgres); this just confirms the static binary runs.
      - name: Smoke test
        run: docker run --rm cc-lb:ci --version
