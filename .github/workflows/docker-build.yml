name: docker-build

# Build the production image whenever the Docker build inputs change, so a
# Dockerfile/.dockerignore edit can't silently break the image (hadolint in
# deploy.yml only lints; it never actually compiles). Source-only changes are
# covered by ci.yml and deliberately do NOT trigger this build.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
  push:
    branches:
      - master
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Self-hosted arm64 runner. Cross-compiles the static musl binary (both
    # storage backends), builds the SPA, and runs a smoke test. The runner pod
    # already carries the in-cluster sccache S3 creds/config in its OS env
    # (SCCACHE_*, AWS_* from the sccache-s3-creds secret, per arc-cc-lb-values),
    # so the compile caches to the same Garage store the cargo jobs use.
    runs-on: oracle4-cc-lb
    steps:
      - uses: actions/checkout@v7

      # network=host + the network.host entitlement let the in-Docker build
      # reach the in-cluster Garage S3 endpoint (garage.arc-systems.svc).
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement network.host

      # Builds the DEFAULT (distroless) target. A raw `docker buildx build` (not
      # build-push-action) is used on purpose: the sccache S3 creds/config live
      # in the runner pod's OS env, which the ${{ env.* }} context can't read but
      # a shell step can -- creds via `--secret env=`, config via build-args.
      # Fail-open: if the env is empty the Dockerfile compiles uncached.
      - name: Build image
        run: |
          docker buildx build \
            --secret id=AWS_ACCESS_KEY_ID,env=AWS_ACCESS_KEY_ID \
            --secret id=AWS_SECRET_ACCESS_KEY,env=AWS_SECRET_ACCESS_KEY \
            --build-arg GIT_SHA=0000000 \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --build-arg SCCACHE_BUCKET="${SCCACHE_BUCKET:-}" \
            --build-arg SCCACHE_ENDPOINT="${SCCACHE_ENDPOINT:-}" \
            --build-arg SCCACHE_REGION="${SCCACHE_REGION:-}" \
            --build-arg SCCACHE_S3_USE_SSL="${SCCACHE_S3_USE_SSL:-}" \
            --network=host \
            --allow network.host \
            --load \
            --tag cc-lb:ci \
            .

      # A successful build already proves both storage backends compile (default
      # FEATURES=sqlite,postgres); this just confirms the static binary runs.
      - name: Smoke test
        run: docker run --rm cc-lb:ci --version
