name: docker-build

# Build the production image whenever the Docker build inputs change, so a
# Dockerfile/.dockerignore edit can't silently break the image (hadolint in
# deploy.yml only lints; it never actually compiles). Source-only changes are
# covered by ci.yml and deliberately do NOT trigger this heavy release build.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
  push:
    branches:
      - master
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Self-hosted arm64: xx cross-compiles every target arch from arm64 with no
    # QEMU, and only here can the build reach the in-cluster sccache/GHA cache
    # server (a GitHub-hosted runner can't see arc-systems.svc).
    runs-on: oracle4-cc-lb
    steps:
      - uses: actions/checkout@v7

      # sccache's GHA backend reads ACTIONS_RESULTS_URL + ACTIONS_RUNTIME_TOKEN,
      # which the runtime doesn't expose to plain steps. Re-export them (the ARC
      # runner names its in-cluster cache server CUSTOM_ACTIONS_RESULTS_URL) so
      # they can be handed to BuildKit as secrets below.
      - name: Expose GHA cache runtime for sccache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || process.env.CUSTOM_ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # network=host lets the compile reach the in-cluster cache server over the
      # pod network (.svc.cluster.local is in the dind's NO_PROXY); the RUN-step
      # host network needs the network.host entitlement, allowed on both the
      # builder (buildkitd-flags) and the build (allow: below).
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement network.host

      # GIT_SHA / SOURCE_DATE_EPOCH are pinned to stable values on purpose: this
      # never-published verification image doesn't need a real commit sha, and
      # stable build metadata maximises sccache reuse.
      - name: Build image (cross-compile, sccache GHA backend)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          network: host
          allow: network.host
          tags: cc-lb:ci
          build-args: |
            GIT_SHA=0000000
            SOURCE_DATE_EPOCH=0
          secrets: |
            ACTIONS_RUNTIME_TOKEN=${{ env.ACTIONS_RUNTIME_TOKEN }}
            ACTIONS_RESULTS_URL=${{ env.ACTIONS_RESULTS_URL }}

      # A successful build already proves both storage backends compile (default
      # FEATURES=sqlite,postgres); this just confirms the static binary runs.
      - name: Smoke test
        run: docker run --rm cc-lb:ci --version
