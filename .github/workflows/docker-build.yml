name: docker-build

# Build the production image whenever Docker build inputs change, so source
# linker configuration and Dockerfile/.dockerignore edits cannot silently break
# the image (hadolint in deploy.yml only lints; it never actually compiles).
# Other source-only changes are covered by ci.yml and do not trigger this build.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.cargo/config.toml'
      - '.github/workflows/docker-build.yml'
  push:
    branches:
      - master
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.cargo/config.toml'
      - '.github/workflows/docker-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The self-hosted pool may schedule either an x86_64 or arm64 runner.
    # Dockerfile isolates host-only Cargo linker configuration, cross-compiles
    # the static musl binary with both storage backends, builds the SPA, and
    # runs a smoke test. Runner pods carry the in-cluster sccache S3 credentials.
    runs-on: cc-lb-500m
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve source revision
        id: source
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      # Builds run on the in-cluster BuildKit daemon (same namespace as Garage).
      - uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkit.arc-systems.svc.cluster.local:1234

      # Build every release target on Dockerfile changes so cross-compilation
      # failures are caught before publication.
      - name: Build all release targets
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le
          target: builder
          outputs: type=cacheonly
          build-args: |
            GIT_SHA=${{ steps.source.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.source_date_epoch }}
          secret-envs: |
            AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY

      - name: Build image and smoke-test binary
        uses: docker/build-push-action@v7
        with:
          context: .
          target: smoke
          outputs: type=cacheonly
          build-args: |
            GIT_SHA=${{ steps.source.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.source_date_epoch }}
          secret-envs: |
            AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY
