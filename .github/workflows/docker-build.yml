name: docker-build

# Build the production image whenever the Docker build inputs change, so a
# Dockerfile/.dockerignore/build-script edit can't silently break the image
# (hadolint in deploy.yml only lints; it never actually compiles). Source-only
# changes are covered by ci.yml and deliberately do NOT trigger this build.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/build-cc-lb.sh'
      - '.github/workflows/docker-build.yml'
  push:
    branches:
      - master
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/build-cc-lb.sh'
      - '.github/workflows/docker-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Self-hosted arm64: the compile is cached on the node's local-disk sccache
    # store (/opt/sccache hostPath), reachable only from this runner. The image
    # is assembled in three steps because a BuildKit RUN can't bind a writable
    # host dir, so the cached compile has to run outside BuildKit via `docker run`.
    runs-on: oracle4-cc-lb
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # 1) Build the real Dockerfile toolchain stage (validates the builder setup
      #    and gives us an image to compile in). load: into the dind's docker.
      - name: Build builder image (cross toolchain)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: builder
          load: true
          tags: cc-lb-builder:ci

      # 2) Compile via the SAME script the Dockerfile uses, with sccache bound to
      #    the node's local-disk cache. Runs in the dind, which mounts the
      #    /opt/sccache hostPath (see .deploy/arc-cc-lb-values.yaml); the runner
      #    workspace is the shared `work` emptyDir, visible to the dind at the same
      #    path. SKIP_SPA=1 mirrors the cargo CI jobs (no Bun/network dependency;
      #    the real SPA build is covered by cd + web.yml). Fail-open: if the store
      #    is absent the compile just runs uncached.
      - name: Compile (host-bind sccache on the node's local disk)
        run: |
          rm -rf "${GITHUB_WORKSPACE}/ci-out"
          mkdir -p "${GITHUB_WORKSPACE}/ci-out"
          docker run --rm \
            -v /opt/sccache:/sccache \
            -v "${GITHUB_WORKSPACE}:/src" \
            -v "${GITHUB_WORKSPACE}/ci-out:/out" \
            -w /src \
            -e SCCACHE_DIR=/sccache \
            -e OUT_DIR=/out \
            -e GIT_SHA=0000000 \
            -e SOURCE_DATE_EPOCH=0 \
            -e FEATURES=sqlite,postgres \
            -e SKIP_SPA=1 \
            -e TARGETPLATFORM=linux/arm64 \
            cc-lb-builder:ci \
            sh /src/scripts/build-cc-lb.sh

      # 3) Package the prebuilt binary into the real distroless runtime stage,
      #    reusing the Dockerfile's runtime-base so the runtime config isn't
      #    duplicated here.
      - name: Package image from the prebuilt binary
        uses: docker/build-push-action@v7
        with:
          context: .
          target: package
          load: true
          tags: cc-lb:ci
          build-contexts: |
            bin=${{ github.workspace }}/ci-out

      # A successful compile already proves both storage backends build (default
      # FEATURES=sqlite,postgres); this just confirms the static binary runs.
      - name: Smoke test
        run: docker run --rm cc-lb:ci --version
