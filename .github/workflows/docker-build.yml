name: docker-build

# Build the production image whenever Docker build inputs change, so source
# linker configuration and Dockerfile/.dockerignore edits cannot silently break
# the image (hadolint in deploy.yml only lints; it never actually compiles).
# Other source-only changes are covered by ci.yml and do not trigger this build.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.cargo/config.toml'
      - '.github/workflows/docker-build.yml'
  push:
    branches:
      - master
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.cargo/config.toml'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:
    inputs:
      cache_namespace:
        description: Stable isolated namespace for a two-run all-target S3 cache lifecycle probe.
        required: false
        default: ''
        type: string
      verify_cache_reuse:
        description: Require at least 99% Rust and C/C++ cache hits. Requires cache_namespace from a completed cold-write run.
        required: false
        default: false
        type: boolean


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The self-hosted pool may schedule either an x86_64 or arm64 runner.
    # Dockerfile isolates host-only Cargo linker configuration, cross-compiles
    # the static musl binary with both storage backends, builds the SPA, and
    # runs a smoke test. Runner pods carry the in-cluster sccache S3 credentials.
    runs-on: oracle4-cc-lb
    steps:
      - uses: actions/checkout@v7
      - name: Resolve source revision
        id: source
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Select sccache namespace
        id: sccache
        env:
          CACHE_NAMESPACE: ${{ inputs.cache_namespace }}
          VERIFY_CACHE_REUSE: ${{ inputs.verify_cache_reuse }}
        run: |
          set -euo pipefail
          if [ -n "$CACHE_NAMESPACE" ]; then
            case "$CACHE_NAMESPACE" in
              *[!A-Za-z0-9._-]*)
                echo "::error::cache_namespace may contain only letters, numbers, dots, underscores, and hyphens"
                exit 1
                ;;
            esac
            prefix="cc-lb/verify/$CACHE_NAMESPACE"
          else
            prefix="cc-lb"
          fi
          if [ "$VERIFY_CACHE_REUSE" = true ]; then
            if [ -z "$CACHE_NAMESPACE" ]; then
              echo "::error::verify_cache_reuse requires cache_namespace from a completed cold-write run"
              exit 1
            fi
            min_hit_rate=99
          else
            min_hit_rate=0
          fi
          {
            echo "prefix=$prefix"
            echo "min_hit_rate=$min_hit_rate"
          } >> "$GITHUB_OUTPUT"

      # network=host + the network.host entitlement let the in-Docker build
      # reach the in-cluster Garage S3 endpoint (garage.arc-systems.svc).
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement network.host

      # Build every release target on Dockerfile changes. A separate manual
      # probe optionally rebuilds with the builder cache bypassed, avoiding a
      # second full target graph on every pull request.
      - name: Build all release targets
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le
          target: builder
          outputs: type=cacheonly
          network: host
          allow: network.host
          build-args: |
            GIT_SHA=${{ steps.source.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.source_date_epoch }}
            SCCACHE_BUCKET=sccache
            SCCACHE_ENDPOINT=http://garage.arc-systems.svc.cluster.local:3900
            SCCACHE_REGION=garage
            SCCACHE_S3_USE_SSL=false
            REQUIRE_SCCACHE=1
            SCCACHE_S3_KEY_PREFIX=${{ steps.sccache.outputs.prefix }}
            SCCACHE_MIN_HIT_RATE=${{ steps.sccache.outputs.min_hit_rate }}
          secret-envs: |
            AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY

      - name: Rebuild all release targets from sccache
        if: inputs.verify_cache_reuse
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le
          target: builder
          outputs: type=cacheonly
          no-cache-filters: builder
          network: host
          allow: network.host
          build-args: |
            GIT_SHA=${{ steps.source.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.source_date_epoch }}
            SCCACHE_BUCKET=sccache
            SCCACHE_ENDPOINT=http://garage.arc-systems.svc.cluster.local:3900
            SCCACHE_REGION=garage
            SCCACHE_S3_USE_SSL=false
            REQUIRE_SCCACHE=1
            SCCACHE_S3_KEY_PREFIX=${{ steps.sccache.outputs.prefix }}
            SCCACHE_MIN_HIT_RATE=${{ steps.sccache.outputs.min_hit_rate }}
          secret-envs: |
            AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: cc-lb:ci
          network: host
          allow: network.host
          build-args: |
            GIT_SHA=${{ steps.source.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.source_date_epoch }}
            SCCACHE_BUCKET=sccache
            SCCACHE_ENDPOINT=http://garage.arc-systems.svc.cluster.local:3900
            SCCACHE_REGION=garage
            SCCACHE_S3_USE_SSL=false
            REQUIRE_SCCACHE=1
            SCCACHE_S3_KEY_PREFIX=${{ steps.sccache.outputs.prefix }}
          secret-envs: |
            AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY

      # A successful build already proves both storage backends compile (default
      # FEATURES=sqlite,postgres); this just confirms the static binary runs.
      - name: Smoke test
        run: docker run --rm cc-lb:ci --version
