name: docker-build

# Build the production image whenever the Docker build inputs change, so a
# Dockerfile/.dockerignore edit can't silently break the image (hadolint in
# deploy.yml only lints; it never actually compiles). Source-only changes are
# covered by ci.yml and deliberately do NOT trigger this heavy release build.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
  push:
    branches:
      - master
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Self-hosted: sccache's /sccache BuildKit cache mount lives in the builder
    # (dind), so warm rebuilds reuse it as long as that builder survives between
    # jobs. A GitHub-hosted runner gets a fresh builder every run and could never
    # warm it.
    runs-on: oracle4-cc-lb
    steps:
      - uses: actions/checkout@v7

      # GIT_SHA / SOURCE_DATE_EPOCH are pinned to stable values on purpose: this
      # never-published verification image doesn't need a real commit sha, and
      # stable build metadata maximises sccache reuse (same trick the host cargo
      # jobs use via setup-rust-cache's stable-build-metadata).
      - name: Build image (cross-compile, sccache)
        run: |
          # Retry to ride out transient registry/network blips (e.g. a gcr.io
          # 5xx while pulling the distroless base). BuildKit keeps completed
          # layers in the dind builder, so a retry reuses the compile and only
          # re-attempts whatever actually failed.
          for attempt in 1 2 3; do
            echo "::group::docker build (attempt ${attempt}/3)"
            if docker buildx build \
                --load \
                --build-arg USE_SCCACHE=1 \
                --build-arg GIT_SHA=0000000 \
                --build-arg SOURCE_DATE_EPOCH=0 \
                -t cc-lb:ci \
                .; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::docker build attempt ${attempt}/3 failed"
            sleep $((attempt * 20))
          done
          echo "::error::docker build failed after 3 attempts"
          exit 1

      # A successful build already proves both storage backends compile (default
      # FEATURES=sqlite,postgres); this just confirms the static binary runs.
      - name: Smoke test
        run: docker run --rm cc-lb:ci --version
