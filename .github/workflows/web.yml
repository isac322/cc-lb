name: web

on:
  pull_request:
    paths:
      - 'crates/cc-lb-admin/web/**'
      - '.github/workflows/web.yml'
  push:
    branches:
      - master
    paths:
      - 'crates/cc-lb-admin/web/**'
      - '.github/workflows/web.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun-checks:
    runs-on: oracle4-cc-lb
    defaults:
      run:
        working-directory: crates/cc-lb-admin/web
    steps:
      - uses: actions/checkout@v7
      - name: Install unzip for setup-bun
        working-directory: .
        run: |
          if command -v unzip >/dev/null 2>&1; then
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y unzip
          elif command -v dnf >/dev/null 2>&1; then
            sudo dnf install -y unzip
          else
            echo "::error::unzip is required by oven-sh/setup-bun and was not found"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun install store
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('crates/cc-lb-admin/web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run web validations
        run: |
          status=0
          fail() {
            echo "::error::web validation failed: $1"
            status=1
          }

          # Vite's TanStack Router plugin updates routeTree.gen.ts. Settle that
          # generated input before concurrent lint/typecheck/test readers start.
          bun run --shell=bun build || fail build
          git diff --exit-code -- src/routeTree.gen.ts ||
            fail "generated route tree is stale"

          bun run --shell=bun lint &
          lint_pid=$!
          bun run --shell=bun typecheck &
          typecheck_pid=$!
          bunx --bun vitest run --passWithNoTests &
          test_pid=$!

          wait "$lint_pid" || fail lint
          wait "$typecheck_pid" || fail typecheck
          wait "$test_pid" || fail "unit tests"

          exit "$status"
