name: web

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
      - '.github/actions/setup-web/**'
  push:
    branches:
      - master
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
      - '.github/actions/setup-web/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-unit:
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - name: Build bundle and check CSP / routeTree / preview guards
        run: |
          set -euo pipefail

          # Vite's TanStack Router plugin updates routeTree.gen.ts. Settle that
          # generated input before lint, typecheck, and test readers start.
          bun run --shell=bun build
          git diff --exit-code -- src/routeTree.gen.ts
          # BUNDLE-01: the packaged SPA keeps the strict-CSP bootstrap and
          # font files external instead of inlining either into the bundle.
          if [[ ! -s dist/theme-init.js ]]; then
            echo '::error::dist/theme-init.js is missing or empty (BUNDLE-01)'
            exit 1
          fi
          font_file="$(find dist -type f \( -iname '*.woff' -o -iname '*.woff2' -o -iname '*.ttf' -o -iname '*.otf' \) -print -quit)"
          if [[ -z "$font_file" ]]; then
            echo '::error::no packaged font files found in dist/ (BUNDLE-01)'
            exit 1
          fi
          if grep -RniE --include='*.css' 'url\([[:space:]]*["'"'"']?data:(font/|application/(font-|x-font|vnd\.ms-fontobject)|application/octet-stream)' dist/; then
            echo '::error::font data URL found in generated CSS (BUNDLE-01)'
            exit 1
          fi
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class InlineScriptChecker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inline_executable = False

              def handle_starttag(self, tag, attrs):
                  if tag != "script":
                      return
                  attributes = dict(attrs)
                  script_type = (attributes.get("type") or "").lower()
                  executable_type = not script_type or script_type in {
                      "text/javascript",
                      "application/javascript",
                      "text/ecmascript",
                      "application/ecmascript",
                      "module",
                  }
                  self.inline_executable = "src" not in attributes and executable_type

              def handle_data(self, data):
                  if self.inline_executable and data.strip():
                      raise SystemExit(
                          "inline executable script body found in dist/index.html (BUNDLE-01)"
                      )

              def handle_endtag(self, tag):
                  if tag == "script":
                      self.inline_executable = False

          InlineScriptChecker().feed(Path("dist/index.html").read_text())
          PY

          # PRE-01: the production bundle carries no preview transport or
          # scenario fixtures (src/preview/ was removed; nothing may return).
          if grep -rnE 'preview-scenario-key|apiKeyScenarios|registerPreviewTransport|wrkspc_01Preview' dist/; then
            echo '::error::preview code found in dist/ (PRE-01)'
            exit 1
          fi
      - name: Run lint and typecheck in parallel
        run: |
          set -euo pipefail
          bun run --shell=bun lint &
          pid_lint=$!
          bun run --shell=bun typecheck &
          pid_tc=$!
          rc=0
          wait "$pid_lint" || rc=1
          wait "$pid_tc" || rc=1
          exit "$rc"
      - name: Run Vitest suite
        run: bunx --bun vitest run --passWithNoTests --maxWorkers=3

  web-visuals-a:
    runs-on: ubuntu-26.04
    # Keep this version aligned with playwright in bun.lock. Browsers, fonts,
    # and shared libraries are baked in; CI must not depend on apt mirrors.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: Configure container workspace
        id: container-setup
        working-directory: .
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          {
            echo "visual-root=$RUNNER_TEMP/codex-credit-visuals"
            echo "issue-1282-visual-root=$RUNNER_TEMP/issue-1282-visuals"
          } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-web
      - name: Verify Playwright image version
        run: |
          bun -e 'import { strict as assert } from "node:assert"; assert.equal(require("playwright/package.json").version, "1.64.1", "Update the Playwright container image with bun.lock");'
      - name: Build static web bundle
        run: bun run --shell=bun build
      - name: Verify and capture Codex credit views
        env:
          PW_USE_PREVIEW: "1"
        run: |
          set -euo pipefail
          bun run e2e \
            e2e/codex-credits.spec.ts \
            --retries=0 \
            --output="$RUNNER_TEMP/codex-credit-visuals/after"
          git rev-parse HEAD > "$RUNNER_TEMP/codex-credit-visuals/after-source.txt"
      - name: Run keepalive and plugin catalog Playwright E2E
        env:
          PW_USE_PREVIEW: "1"
        run: |
          set -euo pipefail
          bun run e2e e2e/issue-1282-keepalive-plugins.spec.ts --retries=0 \
            --output="$RUNNER_TEMP/issue-1282-visuals/after"
          git rev-parse HEAD > "$RUNNER_TEMP/issue-1282-visuals/after-source.txt"
      - name: Capture matching base-branch credit and plugin views
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base_root="$RUNNER_TEMP/codex-credit-base"
          trap 'git worktree remove --force "$base_root" >/dev/null 2>&1 || true' EXIT
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$base_root" "$BASE_SHA"
          git config --global --add safe.directory "$base_root"
          if [ -d "$base_root/web" ]; then
            base_web_dir="$base_root/web"
          else
            base_web_dir="$base_root/crates/cc-lb-admin/web"
          fi
          if cmp -s bun.lock "$base_web_dir/bun.lock" && \
             cmp -s package.json "$base_web_dir/package.json"; then
            ln -s "$PWD/node_modules" "$base_web_dir/node_modules"
          else
            bun install --frozen-lockfile --cwd "$base_web_dir"
          fi
          (cd "$base_web_dir" && bun run --shell=bun build)
          test -s "$base_web_dir/dist/index.html"

          bun qa/capture-codex-credit-baseline.ts \
            "$base_web_dir" \
            "$RUNNER_TEMP/codex-credit-visuals/before" "$BASE_SHA" 5174 &
          pid_1=$!
          bun qa/capture-issue-1282-baseline.ts \
            "$base_web_dir" \
            "$RUNNER_TEMP/issue-1282-visuals/before" "$BASE_SHA" 5175 &
          pid_2=$!
          rc=0
          wait "$pid_1" || rc=1
          wait "$pid_2" || rc=1
          exit "$rc"
      - name: Publish Codex credit visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codex-credit-visuals-${{ github.sha }}
          path: |
            ${{ steps.container-setup.outputs.visual-root }}/after/**/overview.png
            ${{ steps.container-setup.outputs.visual-root }}/after/**/detail.png
            ${{ steps.container-setup.outputs.visual-root }}/after-source.txt
            ${{ steps.container-setup.outputs.visual-root }}/before/*.png
            ${{ steps.container-setup.outputs.visual-root }}/before/capture.json
          retention-days: 14
          if-no-files-found: error
      - name: Publish keepalive and plugin visual evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: keepalive-plugin-visuals-${{ github.sha }}
          path: |
            ${{ steps.container-setup.outputs.issue-1282-visual-root }}/after/**/*.png
            ${{ steps.container-setup.outputs.issue-1282-visual-root }}/after-source.txt
            ${{ steps.container-setup.outputs.issue-1282-visual-root }}/before/*.png
            ${{ steps.container-setup.outputs.issue-1282-visual-root }}/before/capture.json
          retention-days: 14
          if-no-files-found: error

  web-visuals-b:
    runs-on: ubuntu-26.04
    # Keep this version aligned with playwright in bun.lock. Browsers, fonts,
    # and shared libraries are baked in; CI must not depend on apt mirrors.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: Configure container workspace
        id: container-setup
        working-directory: .
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "visual-root=$RUNNER_TEMP/codex-credit-visuals" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-web
      - name: Verify Playwright image version
        run: |
          bun -e 'import { strict as assert } from "node:assert"; assert.equal(require("playwright/package.json").version, "1.64.1", "Update the Playwright container image with bun.lock");'
      - name: Build static web bundle
        run: bun run --shell=bun build
      - name: Verify and capture provider pool and settled quota views
        env:
          PW_USE_PREVIEW: "1"
        run: |
          set -euo pipefail
          bun run e2e \
            e2e/provider-pool-freshness.spec.ts \
            e2e/upstream-quota-settled-states.spec.ts \
            e2e/overview-shared-quota-columns.spec.ts \
            --retries=0 \
            --output="$RUNNER_TEMP/codex-credit-visuals/after"
          git rev-parse HEAD > "$RUNNER_TEMP/codex-credit-visuals/after-source.txt"
      - name: Publish provider pool visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: provider-pool-visuals-${{ github.sha }}
          path: |
            ${{ steps.container-setup.outputs.visual-root }}/after/**/provider-pool.png
            ${{ steps.container-setup.outputs.visual-root }}/after-source.txt
          retention-days: 14
          if-no-files-found: error
      - name: Publish settled quota visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: settled-quota-visuals-${{ github.sha }}
          path: |
            ${{ steps.container-setup.outputs.visual-root }}/after/**/settled-quota.png
            ${{ steps.container-setup.outputs.visual-root }}/after/**/gemini-placeholder.png
            ${{ steps.container-setup.outputs.visual-root }}/after/**/gemini-pool-placeholder.png
            ${{ steps.container-setup.outputs.visual-root }}/after/**/gemini-retained.png
            ${{ steps.container-setup.outputs.visual-root }}/after/**/provider-gemini-placeholders-1440.png
            ${{ steps.container-setup.outputs.visual-root }}/after/**/overview-shared-*.png
            ${{ steps.container-setup.outputs.visual-root }}/after/**/overview-stale-absent-*.png
            ${{ steps.container-setup.outputs.visual-root }}/after/**/overview-weekly-only-*.png
            ${{ steps.container-setup.outputs.visual-root }}/after/**/retained-*.png
            ${{ steps.container-setup.outputs.visual-root }}/after-source.txt
          retention-days: 14
          if-no-files-found: error

  web-pricing-after:
    runs-on: ubuntu-26.04
    # Keep this version aligned with playwright in bun.lock. Browsers, fonts,
    # and shared libraries are baked in; CI must not depend on apt mirrors.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: Configure container workspace
        id: container-setup
        working-directory: .
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "issue-1280-visual-root=$RUNNER_TEMP/issue-1280-visuals" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-web
      - name: Verify Playwright image version
        run: |
          bun -e 'import { strict as assert } from "node:assert"; assert.equal(require("playwright/package.json").version, "1.64.1", "Update the Playwright container image with bun.lock");'
      - name: Build static web bundle
        run: bun run --shell=bun build
      - name: Verify and capture pricing completeness views
        env:
          PW_USE_PREVIEW: "1"
          CAPTURE_CONCURRENCY: "6"
          CI_MERGE_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          bun run e2e e2e/overview-cost-completeness.spec.ts --retries=0 \
            --output="$RUNNER_TEMP/issue-1280-visuals/after"
          served_sha="$(git rev-parse HEAD)"
          bun qa/capture-issue-1280-baseline.ts \
            . "$RUNNER_TEMP/issue-1280-visuals/after" "$served_sha" 5176 "$CI_MERGE_SHA" "$PR_HEAD_SHA"
          printf '%s\n' "$served_sha" > "$RUNNER_TEMP/issue-1280-visuals/after-source.txt"
      - name: Stage pricing after visuals for bun-checks bundle
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pricing-visuals-after-tmp-${{ github.sha }}
          path: |
            ${{ steps.container-setup.outputs.issue-1280-visual-root }}/after/**/*.png
            ${{ steps.container-setup.outputs.issue-1280-visual-root }}/after/capture.json
            ${{ steps.container-setup.outputs.issue-1280-visual-root }}/after/provenance.json
            ${{ steps.container-setup.outputs.issue-1280-visual-root }}/after/source-sha.txt
            ${{ steps.container-setup.outputs.issue-1280-visual-root }}/after-source.txt
          retention-days: 1
          if-no-files-found: error

  web-pricing-before:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    # Keep this version aligned with playwright in bun.lock. Browsers, fonts,
    # and shared libraries are baked in; CI must not depend on apt mirrors.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: Configure container workspace
        id: container-setup
        working-directory: .
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "issue-1280-visual-root=$RUNNER_TEMP/issue-1280-visuals" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-web
      - name: Verify Playwright image version
        run: |
          bun -e 'import { strict as assert } from "node:assert"; assert.equal(require("playwright/package.json").version, "1.64.1", "Update the Playwright container image with bun.lock");'
      - name: Capture matching base-branch pricing views
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CAPTURE_CONCURRENCY: "6"
          CI_MERGE_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base_root="$RUNNER_TEMP/issue-1280-base"
          trap 'git worktree remove --force "$base_root" >/dev/null 2>&1 || true' EXIT
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$base_root" "$BASE_SHA"
          git config --global --add safe.directory "$base_root"
          if [ -d "$base_root/web" ]; then
            base_web_dir="$base_root/web"
          else
            base_web_dir="$base_root/crates/cc-lb-admin/web"
          fi
          if cmp -s bun.lock "$base_web_dir/bun.lock" && \
             cmp -s package.json "$base_web_dir/package.json"; then
            ln -s "$PWD/node_modules" "$base_web_dir/node_modules"
          else
            bun install --frozen-lockfile --cwd "$base_web_dir"
          fi
          (cd "$base_web_dir" && bun run --shell=bun build)
          test -s "$base_web_dir/dist/index.html"
          bun qa/capture-issue-1280-baseline.ts \
            "$base_web_dir" \
            "$RUNNER_TEMP/issue-1280-visuals/before" "$BASE_SHA" 5176 "$CI_MERGE_SHA" "$PR_HEAD_SHA"
      - name: Stage pricing before visuals for bun-checks bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pricing-visuals-before-tmp-${{ github.sha }}
          path: |
            ${{ steps.container-setup.outputs.issue-1280-visual-root }}/before/*.png
            ${{ steps.container-setup.outputs.issue-1280-visual-root }}/before/capture.json
            ${{ steps.container-setup.outputs.issue-1280-visual-root }}/before/provenance.json
            ${{ steps.container-setup.outputs.issue-1280-visual-root }}/before/source-sha.txt
          retention-days: 1
          if-no-files-found: error

  bun-checks:
    name: bun-checks
    needs:
      - web-unit
      - web-visuals-a
      - web-visuals-b
      - web-pricing-after
      - web-pricing-before
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Download staged pricing after visuals
        if: ${{ always() && github.event_name == 'pull_request' && needs.web-pricing-after.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: pricing-visuals-after-tmp-${{ github.sha }}
          path: ${{ runner.temp }}/pricing-bundle
      - name: Download staged pricing before visuals
        if: ${{ always() && github.event_name == 'pull_request' && needs.web-pricing-before.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: pricing-visuals-before-tmp-${{ github.sha }}
          path: ${{ runner.temp }}/pricing-bundle/before
      - name: Publish pricing completeness visual evidence
        if: ${{ always() && github.event_name == 'pull_request' && (needs.web-pricing-after.result == 'success' || needs.web-pricing-before.result == 'success') }}
        uses: actions/upload-artifact@v7
        with:
          name: pricing-completeness-visuals-${{ github.sha }}
          path: ${{ runner.temp }}/pricing-bundle/**
          retention-days: 14
          if-no-files-found: error
      - name: Check web jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          for job in web-unit web-visuals-a web-visuals-b web-pricing-after; do
            result=$(jq -er --arg job "$job" '.[$job].result // "missing"' <<<"$RESULTS")
            echo "$job: $result"
            if [[ "$result" != "success" ]]; then
              echo "::error::$job finished with result '$result'"
              exit 1
            fi
          done
          before_result=$(jq -er '.["web-pricing-before"].result // "missing"' <<<"$RESULTS")
          echo "web-pricing-before: $before_result"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$before_result" != "success" ]]; then
              echo "::error::web-pricing-before finished with result '$before_result'"
              exit 1
            fi
          elif [[ "$before_result" != "skipped" ]]; then
            echo "::error::web-pricing-before finished with unexpected result '$before_result'"
            exit 1
          fi
