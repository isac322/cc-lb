name: web

on:
  pull_request:
    paths:
      - 'crates/cc-lb-admin/web/**'
      - '.github/workflows/web.yml'
  push:
    branches:
      - master
    paths:
      - 'crates/cc-lb-admin/web/**'
      - '.github/workflows/web.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun-checks:
    # vitest runs one worker, but the bun runtime, GC, and jsdom timers still
    # want more than a single core.
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: crates/cc-lb-admin/web
    steps:
      - uses: actions/checkout@v7
      - name: Install bun 1.4.4
        working-directory: .
        run: |
          set -euo pipefail
          arch=$(uname -m)
          os=$(uname -s)
          case "$os-$arch" in
            Linux-aarch64|Linux-arm64) asset=bun-linux-aarch64.zip ;;
            Linux-x86_64) asset=bun-linux-x64.zip ;;
            Darwin-arm64) asset=bun-darwin-aarch64.zip ;;
            Darwin-x86_64) asset=bun-darwin-x64.zip ;;
            *)
              echo "::error::unsupported $os $arch for bun"
              exit 1
              ;;
          esac
          dest="$HOME/.local/bin"
          mkdir -p "$dest"
          python3 - "$asset" "$dest" <<'PY'
          import io, os, stat, sys, tarfile, urllib.error, urllib.request, zipfile
          asset, dest = sys.argv[1], sys.argv[2]
          pkg = asset.removesuffix(".zip")
          gh_url = f"https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/{asset}"
          npm_url = f"https://registry.npmjs.org/@oven/{pkg}/-/{pkg}-1.4.4.tgz"
          target = os.path.join(dest, "bun")
          try:
              req = urllib.request.Request(gh_url, headers={"User-Agent": "cc-lb-ci"})
              data = urllib.request.urlopen(req, timeout=15).read()
              zf = zipfile.ZipFile(io.BytesIO(data))
              for info in zf.infolist():
                  name = info.filename.rsplit("/", 1)[-1]
                  if name == "bun" and not info.is_dir():
                      with zf.open(info) as src, open(target, "wb") as out:
                          out.write(src.read())
                      print(f"installed {target} from {info.filename}")
                      break
              else:
                  raise SystemExit(f"bun binary not in {asset}: {zf.namelist()}")
          except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as exc:
              print(f"GitHub release download failed ({exc}); falling back to {npm_url}")
              req = urllib.request.Request(npm_url, headers={"User-Agent": "cc-lb-ci"})
              data = urllib.request.urlopen(req, timeout=30).read()
              with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as tf:
                  for member in tf.getmembers():
                      if member.name.endswith("/bin/bun") and member.isfile():
                          src = tf.extractfile(member)
                          assert src is not None
                          with src, open(target, "wb") as out:
                              out.write(src.read())
                          print(f"installed {target} from {member.name}")
                          break
                  else:
                      raise SystemExit(f"bun binary not in {pkg}.tgz: {[m.name for m in tf.getmembers()]}")
          os.chmod(target, os.stat(target).st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
          PY
          ln -sfn "$dest/bun" "$dest/bunx"
          echo "$dest" >> "$GITHUB_PATH"
          "$dest/bun" --version
          "$dest/bunx" --version
      - name: Cache Bun install store
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('crates/cc-lb-admin/web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run web validations
        run: |
          set -euo pipefail

          # Vite's TanStack Router plugin updates routeTree.gen.ts. Settle that
          # generated input before lint, typecheck, and test readers start.
          bun run --shell=bun build
          git diff --exit-code -- src/routeTree.gen.ts
          # BUNDLE-01: the packaged SPA keeps the strict-CSP bootstrap and
          # font files external instead of inlining either into the bundle.
          if [[ ! -s dist/theme-init.js ]]; then
            echo '::error::dist/theme-init.js is missing or empty (BUNDLE-01)'
            exit 1
          fi
          font_file="$(find dist -type f \( -iname '*.woff' -o -iname '*.woff2' -o -iname '*.ttf' -o -iname '*.otf' \) -print -quit)"
          if [[ -z "$font_file" ]]; then
            echo '::error::no packaged font files found in dist/ (BUNDLE-01)'
            exit 1
          fi
          if grep -RniE --include='*.css' 'url\([[:space:]]*["'"'"']?data:(font/|application/(font-|x-font|vnd\.ms-fontobject)|application/octet-stream)' dist/; then
            echo '::error::font data URL found in generated CSS (BUNDLE-01)'
            exit 1
          fi
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class InlineScriptChecker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inline_executable = False

              def handle_starttag(self, tag, attrs):
                  if tag != "script":
                      return
                  attributes = dict(attrs)
                  script_type = (attributes.get("type") or "").lower()
                  executable_type = not script_type or script_type in {
                      "text/javascript",
                      "application/javascript",
                      "text/ecmascript",
                      "application/ecmascript",
                      "module",
                  }
                  self.inline_executable = "src" not in attributes and executable_type

              def handle_data(self, data):
                  if self.inline_executable and data.strip():
                      raise SystemExit(
                          "inline executable script body found in dist/index.html (BUNDLE-01)"
                      )

              def handle_endtag(self, tag):
                  if tag == "script":
                      self.inline_executable = False

          InlineScriptChecker().feed(Path("dist/index.html").read_text())
          PY

          # PRE-01: the production bundle carries no preview transport or
          # scenario fixtures (src/preview/ was removed; nothing may return).
          # `if` rather than `! grep`: `set -e` ignores an inverted status.
          if grep -rnE 'preview-scenario-key|apiKeyScenarios|registerPreviewTransport|wrkspc_01Preview' dist/; then
            echo '::error::preview code found in dist/ (PRE-01)'
            exit 1
          fi

          bun run --shell=bun lint
          bun run --shell=bun typecheck
          bunx --bun vitest run --passWithNoTests --maxWorkers=1 --no-file-parallelism
      - name: Install browser for credit visual regression
        run: bunx playwright install --with-deps chromium
      - name: Verify and capture Codex credit views
        run: |
          bun run e2e e2e/codex-credits.spec.ts --retries=0 \
            --output="$RUNNER_TEMP/codex-credit-visuals/after"
          git rev-parse HEAD > "$RUNNER_TEMP/codex-credit-visuals/after-source.txt"
      - name: Capture matching base-branch credit views
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base_root="$RUNNER_TEMP/codex-credit-base"
          cleanup() {
            git worktree remove --force "$base_root"
          }
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$base_root" "$BASE_SHA"
          trap cleanup EXIT
          bun install --frozen-lockfile --cwd "$base_root/crates/cc-lb-admin/web"
          bun qa/capture-codex-credit-baseline.ts \
            "$base_root/crates/cc-lb-admin/web" \
            "$RUNNER_TEMP/codex-credit-visuals/before" "$BASE_SHA"
      - name: Publish Codex credit visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codex-credit-visuals-${{ github.sha }}
          path: |
            ${{ runner.temp }}/codex-credit-visuals/after/**/overview.png
            ${{ runner.temp }}/codex-credit-visuals/after/**/detail.png
            ${{ runner.temp }}/codex-credit-visuals/after-source.txt
            ${{ runner.temp }}/codex-credit-visuals/before/*.png
            ${{ runner.temp }}/codex-credit-visuals/before/capture.json
          retention-days: 14
          if-no-files-found: error
