name: musl-static

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CC_LB_ADMIN_SKIP_SPA: "1"

jobs:
  verify:
    runs-on: oracle4-cc-lb
    container:
      image: messense/rust-musl-cross:aarch64-musl
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
    steps:
      - uses: actions/checkout@v7
      # The messense/rust-musl-cross image ships rustc 1.94.0 but the workspace
      # pins channel = "1.96.0" via rust-toolchain.toml. We cannot simply call
      # `rustup update stable` because the image's preinstalled clippy package
      # manifest is corrupt - it claims to own
      # share/doc/clippy/{README.md,LICENSE-MIT} which do not exist on disk, so
      # any rustup operation that removes the old clippy component fails. We
      # install the pinned 1.96.0 toolchain as a fresh, separate directory and
      # promote it to default, leaving the broken stable untouched.
      - name: Install pinned Rust toolchain from rust-toolchain.toml
        shell: bash
        run: |
          set -euo pipefail
          channel=$(grep -E '^channel = ' rust-toolchain.toml | sed 's/.*"\(.*\)".*/\1/')
          target=aarch64-unknown-linux-musl
          rustup toolchain install "$channel" --no-self-update \
            --component rustc,cargo,clippy,rustfmt \
            --profile minimal \
            --target "$target"
          rustup default "$channel"
          rustc --version
      - uses: ./.github/actions/setup-rust-cache
        with:
          rust-cache-key: musl-aarch64
      - name: Verify musl static binary
        run: bash tests/musl-static/verify.sh
      - name: Show sccache stats
        if: always()
        run: |
          if [ -n "${SCCACHE_PATH:-}" ] && [ -x "$SCCACHE_PATH" ]; then
            "$SCCACHE_PATH" --show-stats
          elif command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          fi
