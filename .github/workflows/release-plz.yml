name: release-plz

# Single source of truth for crates.io package releases. The server has a
# separate git-only release-plz config and artifact workflow. Runs only on
# master pushes (post-merge), never on PRs.
#
# Flow:
#   1. `preflight` job re-runs the publish-check gate (cargo semver-checks
#      on every publish=true crate that has a crates.io baseline, plus a
#      `cargo publish --dry-run` on the foundation crate cc-lb-plugin-wire).
#      This is defense-in-depth against the class of failure where a PR
#      slips through with a public API break that has no matching version
#      bump — path deps hide the mismatch until `cargo publish --verify`
#      resolves the workspace dep constraint against crates.io. If this
#      job fails no publish is attempted, so partial crates.io publishes
#      cannot happen.
#   2. `release` job runs after preflight succeeds. It detects new versions,
#      creates package git tags + GitHub Releases, and publishes the five crates
#      managed in release-plz.toml to crates.io via trusted publishing (OIDC).
#      Server tags and draft Releases are created by release-plz through
#      release-plz-server.toml in release-server.yml.
#   3. `release-pr` job runs in parallel with preflight/release. It opens
#      or updates a "chore: release" PR with version bumps and CHANGELOG
#      entries for any crate touched since the last release.

on:
  push:
    branches: [master]

permissions: {}

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight publish-check
    runs-on: oracle4-cc-lb
    permissions:
      contents: read
    env:
      # cc-lb-plugin-conformance's semver check transitively pulls
      # cc-lb-runtime-wasmtime, whose build.rs pre-builds wasm32 test
      # fixtures. That pre-build has no bearing on the rustdoc surface
      # semver-checks inspects, and it fails because release jobs do not install
      # the wasm32-unknown-unknown target. Skip via the same escape hatch that
      # gates the release step below.
      CC_LB_SKIP_WASM_FIXTURE_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.97.0

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853
        with:
          tool: cargo-semver-checks@0.48

      - name: cargo semver-checks (published baselines)
        run: |
          set -euo pipefail
          cargo semver-checks --package cc-lb-plugin-wire
          cargo semver-checks --package cc-lb-plugin-conformance

      - name: cargo publish --dry-run cc-lb-plugin-wire
        run: cargo publish --dry-run -p cc-lb-plugin-wire

  release:
    name: release-plz release
    needs: preflight
    runs-on: oracle4-cc-lb
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-gh

      - uses: dtolnay/rust-toolchain@1.97.0

      - name: Authenticate to crates.io (trusted publishing)
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Run release-plz release
        id: release-plz
        uses: MarcoIeni/release-plz-action@v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          # cc-lb-runtime-wasmtime/build.rs pre-builds wasm32 test fixtures
          # so `cargo test -p cc-lb-runtime-wasmtime` never silently skips
          # integration tests. During `cargo publish --verify`, the runner
          # has no wasm32-unknown-unknown target installed and the fixture
          # crates are not part of the published tarball, so that pre-build
          # is both impossible and unnecessary. The build.rs exposes this
          # exact escape hatch (see crates/cc-lb-runtime-wasmtime/build.rs).
          CC_LB_SKIP_WASM_FIXTURE_BUILD: "1"


  release-pr:
    name: release-plz release-pr
    runs-on: oracle4-cc-lb
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-gh

      - uses: dtolnay/rust-toolchain@1.97.0

      - name: Run release-plz release-pr
        uses: MarcoIeni/release-plz-action@v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
