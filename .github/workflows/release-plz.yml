name: release-plz

# Single source of truth for releases. Runs only on master pushes (post-merge),
# never on PRs. Local execution of release-plz is prohibited — see
# release-plz.toml policy header.
#
# Flow:
#   1. `release-pr` job opens/updates a "chore: release" PR with version bumps
#      and CHANGELOG entries for any crate touched since the last release.
#   2. On merge of that PR, the `release` job runs again, detects new versions
#      in Cargo.toml, creates git tags + GitHub releases, and publishes the
#      crates managed in release-plz.toml (currently 6: cc-lb-plugin-api,
#      cc-lb-plugin-wire, cc-lb-pdk-wasmtime, cc-lb-pdk-wasmtime-macros,
#      cc-lb-plugin-conformance, cc-lb-runtime-wasmtime) to crates.io via
#      trusted publishing (OIDC). Host / storage / internal crates carry
#      `publish = false` and are skipped.

on:
  push:
    branches: [master]

permissions: {}

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Authenticate to crates.io (trusted publishing)
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Run release-plz release
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          # cc-lb-runtime-wasmtime/build.rs pre-builds wasm32 test fixtures
          # so `cargo test -p cc-lb-runtime-wasmtime` never silently skips
          # integration tests. During `cargo publish --verify`, the runner
          # has no wasm32-unknown-unknown target installed and the fixture
          # crates are not part of the published tarball, so that pre-build
          # is both impossible and unnecessary. The build.rs exposes this
          # exact escape hatch (see crates/cc-lb-runtime-wasmtime/build.rs).
          CC_LB_SKIP_WASM_FIXTURE_BUILD: "1"

  release-pr:
    name: release-plz release-pr
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz release-pr
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
