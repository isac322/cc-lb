# Dependabot configuration for cc-lb.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-options-reference
#
# Scope:
#   - GitHub Actions used in .github/workflows/*
#   - Root Cargo workspace (covers crates/*, benches/*, tests/* members listed
#     in the root Cargo.toml [workspace] block)
#   - Fuzz workspace (excluded from the root workspace, so registered separately)
#   - Bun-based admin web app (uses bun.lock; officially supported by Dependabot
#     as of 2025-02-13 via package-ecosystem: "bun")
#   - ARC runner image at .github/runner-image/Dockerfile

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/.github/runner-image"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    groups:
      cargo-workspace:
        patterns:
          - "*"
    ignore:
      # bincode 3.0.0 is an xkcd-2347 joke release containing `compile_error!`;
      # 2.0.1 is the real latest stable. See deny.toml RUSTSEC-2025-0141.
      - dependency-name: "bincode"
        update-types: ["version-update:semver-major"]
      # opentelemetry 0.33 needs tracing-opentelemetry 0.34; 0.33.0 (latest)
      # still requires opentelemetry ^0.32.0. Drop these once it ships.
      - dependency-name: "opentelemetry"
        versions: ["0.33.0"]
      - dependency-name: "opentelemetry-otlp"
        versions: ["0.33.0"]
      - dependency-name: "opentelemetry_sdk"
        versions: ["0.33.0"]
      # The apalis 1.0.0-rc family only moves in lockstep, and apalis-sqlite
      # 1.0.0-rc.9 does not compile: persist.rs passes `&mut tx` where sqlx 0.9
      # requires `&mut *tx`. apalis-sql 1.0.0-rc.9 also fails against
      # apalis-core 1.0.0-rc.10 (removed `backend::poll_strategy`, `task_fn`).
      # Drop these once a fixed apalis-sqlite release lands.
      - dependency-name: "apalis"
        versions: ["1.0.0-rc.10"]
      - dependency-name: "apalis-core"
        versions: ["1.0.0-rc.10"]
      - dependency-name: "apalis-codec"
        versions: ["0.1.0-rc.10"]
      - dependency-name: "apalis-cron"
        versions: ["1.0.0-rc.9"]
      - dependency-name: "apalis-postgres"
        versions: ["1.0.0-rc.9"]
      - dependency-name: "apalis-sqlite"
        versions: ["1.0.0-rc.9"]
      # cc-lb-scheduler's ulid is type-coupled to apalis-sqlite/apalis-postgres
      # 1.0.0-rc.8, which pin ulid ^1. Unblocks with the apalis family above.
      - dependency-name: "ulid"
        versions: ["3.0.0"]
      # The `scheduler-sqlx`/`sqlx` copies in cc-lb-admin, cc-lb-server and
      # cc-lb-scheduler are exact-pinned to 0.8.6 by apalis-sqlite/-postgres
      # 1.0.0-rc.8. The workspace `sqlx` is already on 0.9. Unblocks with the
      # apalis family above.
      - dependency-name: "sqlx"
        versions: ["0.9.x"]
      # reqwest 0.13 dropped its ring provider feature: `rustls` forces the
      # aws-lc-rs backend and `rustls-no-provider` panics unless a process
      # default CryptoProvider is installed. Needs an explicit TLS-backend
      # decision, not a version bump.
      - dependency-name: "reqwest"
        versions: ["0.13.x"]

  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    groups:
      cargo-fuzz:
        patterns:
          - "*"
    ignore:
      # bincode 3.0.0 is an xkcd-2347 joke release containing `compile_error!`;
      # 2.0.1 is the real latest stable. See deny.toml RUSTSEC-2025-0141.
      - dependency-name: "bincode"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "bun"
    directory: "/crates/cc-lb-admin/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    groups:
      admin-web:
        patterns:
          - "*"
    ignore:
      # jsdom 30.1.0 breaks vitest's catchWindowErrors: the worker bootstrap
      # calls addEventListener on a window that jsdom's EventTarget IDL wrapper
      # then rejects ("not a valid instance of EventTarget"), so every forked
      # test worker fails to start. Reproduced with vitest 5.0.1 under
      # `vitest run --maxWorkers=1 --no-file-parallelism`; 30.0.1 is clean.
      - dependency-name: "jsdom"
        versions: ["30.1.0"]
