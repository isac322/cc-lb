# Dependabot configuration for cc-lb.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-options-reference
#
# Scope:
#   - GitHub Actions used in .github/workflows/*
#   - Root Cargo workspace (covers crates/*, benches/*, tests/* members listed
#     in the root Cargo.toml [workspace] block)
#   - Fuzz workspace (excluded from the root workspace, so registered separately)
#   - Bun-based admin web app and documentation site (uses bun.lock; officially
#     supported by Dependabot as of 2025-02-13 via package-ecosystem: "bun")

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    groups:
      cargo-workspace:
        patterns:
          - "*"
    ignore:
      # bincode 3.0.0 is an xkcd-2347 joke release containing `compile_error!`;
      # 2.0.1 is the real latest stable. See deny.toml RUSTSEC-2025-0141.
      - dependency-name: "bincode"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    groups:
      cargo-fuzz:
        patterns:
          - "*"
    ignore:
      # bincode 3.0.0 is an xkcd-2347 joke release containing `compile_error!`;
      # 2.0.1 is the real latest stable. See deny.toml RUSTSEC-2025-0141.
      - dependency-name: "bincode"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "bun"
    directory: "/crates/cc-lb-admin/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    groups:
      admin-web:
        patterns:
          - "*"
    ignore:
      # jsdom 30.1.0 breaks vitest's catchWindowErrors: the worker bootstrap
      # calls addEventListener on a window that jsdom's EventTarget IDL wrapper
      # then rejects ("not a valid instance of EventTarget"), so every forked
      # test worker fails to start. Reproduced with vitest 5.0.1 under
      # `vitest run --maxWorkers=1 --no-file-parallelism`; 30.0.1 is clean.
      - dependency-name: "jsdom"
        versions: ["30.1.0"]

  - package-ecosystem: "bun"
    directory: "/site"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    groups:
      site:
        patterns:
          - "*"
