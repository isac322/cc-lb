name: Check published crates
description: Set up Rust and validate published crate API and packaging compatibility.

inputs:
  stable-build-metadata:
    description: Whether to stabilize build metadata for better compiler cache reuse.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-rust-tools
      with:
        profile: semver

    - uses: ./.github/actions/setup-rust-target-cache
      id: rust-cache
      with:
        cache-job-key: publish-check
        sccache-scope: semver
        extra-cache-paths: target/semver-checks
        stable-build-metadata: ${{ inputs.stable-build-metadata }}

    - name: Check published crates
      shell: bash
      run: |
        set -uo pipefail
        status=0

        run_check() {
          local name="$1"
          shift

          echo "::group::$name"
          if "$@"; then
            echo "::endgroup::"
          else
            result=$?
            echo "::error::$name failed with exit code $result"
            echo "::endgroup::"
            status=1
          fi
        }

        # This package-only release gate checks only the approved runtime and
        # conformance crates. Crate versions are owned by release-plz, so a PR
        # cannot bump them. A breaking change declared with a
        # conventional-commit marker (`type(scope)!:` subject or
        # `BREAKING CHANGE:` footer) on a commit that touched the crate since
        # its last release tag is checked as a major release, which is the bump
        # release-plz will apply. Undeclared breaks are still rejected.
        # Requires full history and tags.
        #
        # cc-lb-plugin-wire is intentionally excluded: its release is pending
        # separately and must not block this approved package-only release.
        # The release-plz trusted publish job validates the final package.
        #
        # Runtime/conformance publish dry-runs stay out of this preflight
        # because unpublished workspace dependencies make them invalid here.
        semver_check() {
          local crate="$1" pkgid version tag log
          local args=(--package "$crate")
          pkgid="$(cargo pkgid -p "$crate")" || return 1
          version="${pkgid##*[@#]}"
          tag="$crate-v$version"
          # Read the whole log before matching: `git log | grep -q` under
          # pipefail fails with SIGPIPE once grep exits on an early match.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null &&
            log="$(git log --format='%s%n%b' "$tag..HEAD" -- "crates/$crate")" &&
            grep -Eq '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE:' <<<"$log"; then
            echo "Declared breaking change to $crate since $tag; checking as a major release."
            args+=(--release-type major)
          fi
          env CC_LB_SKIP_WASM_FIXTURE_BUILD=1 cargo semver-checks "${args[@]}"
        }

        run_check "cargo semver-checks cc-lb-runtime-wasmtime" \
          semver_check cc-lb-runtime-wasmtime
        run_check "cargo semver-checks cc-lb-plugin-conformance" \
          semver_check cc-lb-plugin-conformance

        exit "$status"

    - name: Show sccache stats and save caches
      if: ${{ !cancelled() }}
      uses: ./.github/actions/save-rust-target-cache
      with:
        extra-cache-paths: target/semver-checks
        target-cache-hit: ${{ steps.rust-cache.outputs.target-cache-hit }}
        target-cache-key: ${{ steps.rust-cache.outputs.target-cache-key }}
        save-sccache: "true"
        sccache-exact-hit: ${{ steps.rust-cache.outputs.sccache-exact-hit }}
        sccache-key: ${{ steps.rust-cache.outputs.sccache-key }}
