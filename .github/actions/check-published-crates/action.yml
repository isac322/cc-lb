name: Check published crates
description: Set up Rust and validate published crate API and packaging compatibility.

inputs:
  stable-build-metadata:
    description: Whether to stabilize build metadata for better compiler cache reuse.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-rustup-home

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.98.1

    - uses: ./.github/actions/setup-rust-cache
      with:
        stable-build-metadata: ${{ inputs.stable-build-metadata }}

    - name: Install cargo-semver-checks
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-semver-checks@0.50

    - name: Check published crates
      shell: bash
      run: |
        set -uo pipefail
        status=0

        run_check() {
          local name="$1"
          shift

          echo "::group::$name"
          if "$@"; then
            echo "::endgroup::"
          else
            result=$?
            echo "::error::$name failed with exit code $result"
            echo "::endgroup::"
            status=1
          fi
        }

        # Crate versions are owned by release-plz, so a PR cannot bump them.
        # A breaking change declared with a conventional-commit marker
        # (`type(scope)!:` subject or `BREAKING CHANGE:` footer) on a commit
        # that touched the crate since its last release tag is checked as a
        # major release, which is the bump release-plz will apply. Undeclared
        # breaks are still rejected. Requires full history and tags.
        semver_check() {
          local crate="$1" pkgid version tag log
          local args=(--package "$crate")
          pkgid="$(cargo pkgid -p "$crate")" || return 1
          version="${pkgid##*[@#]}"
          tag="$crate-v$version"
          # Read the whole log before matching: `git log | grep -q` under
          # pipefail fails with SIGPIPE once grep exits on an early match.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null &&
            log="$(git log --format='%s%n%b' "$tag..HEAD" -- "crates/$crate")" &&
            grep -Eq '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE:' <<<"$log"; then
            echo "Declared breaking change to $crate since $tag; checking as a major release."
            args+=(--release-type major)
          fi
          env CC_LB_SKIP_WASM_FIXTURE_BUILD=1 cargo semver-checks "${args[@]}"
        }

        run_check "cargo semver-checks cc-lb-plugin-wire" \
          semver_check cc-lb-plugin-wire
        run_check "cargo semver-checks cc-lb-plugin-conformance" \
          semver_check cc-lb-plugin-conformance
        run_check "cargo publish --dry-run cc-lb-plugin-wire" \
          cargo publish --dry-run -p cc-lb-plugin-wire

        exit "$status"
