name: Setup Rust cache
description: Restore Cargo caches and enable shared sccache compiler artifacts.

inputs:
  rust-cache-key:
    description: Extra key segment for Swatinem/rust-cache.
    required: false
    default: ""
  cache-targets:
    description: Whether Swatinem/rust-cache should restore/save target directories.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Run sccache-cache
      id: sccache-setup
      uses: mozilla-actions/sccache-action@v0.0.10
      continue-on-error: true

    - name: Configure sccache GitHub backend
      if: steps.sccache-setup.outcome == 'success'
      uses: actions/github-script@v8
      with:
        script: |
          core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Export Rust compiler cache env
      if: steps.sccache-setup.outcome == 'success'
      shell: bash
      run: |
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        cache-targets: ${{ inputs.cache-targets }}
        key: ${{ inputs.rust-cache-key }}
