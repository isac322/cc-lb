name: Setup Rust cache
description: Enable the node-shared sccache compiler cache and restore the Cargo registry cache.

inputs:
  rust-cache-key:
    description: Extra key segment for Swatinem/rust-cache.
    required: false
    default: ""
  cache-targets:
    description: >-
      Whether Swatinem/rust-cache should restore/save target directories.
      Default off: the shared sccache (node hostPath) is the cross-job
      compiler cache, and the per-job target tarballs (~tens of GB) do not
      fit the single node's disk.
    required: false
    default: "false"
  stable-build-metadata:
    description: Whether to stabilize build metadata for better compiler cache reuse.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Run sccache-cache
      id: sccache-setup
      uses: mozilla-actions/sccache-action@v0.0.10
      continue-on-error: true

    # No actions/cache round-trip: sccache stores into a node-shared hostPath
    # (SCCACHE_DIR=/opt/sccache, set on the runner) so every job on the node
    # shares one content-addressed compiler cache. SCCACHE_DIR / SCCACHE_CACHE_SIZE
    # come from the runner env (.deploy/arc-cc-lb-values.yaml).
    - name: Export Rust compiler cache env
      if: steps.sccache-setup.outcome == 'success'
      shell: bash
      run: |
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        echo "SCCACHE_BASEDIRS=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        if [ "${{ inputs.stable-build-metadata }}" = "true" ]; then
          echo "GIT_SHA=0000000" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=0" >> "$GITHUB_ENV"
        else
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
        fi

    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        cache-targets: ${{ inputs.cache-targets }}
        key: ${{ inputs.rust-cache-key }}
