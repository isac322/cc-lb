name: Setup promtool
description: Install a selected Prometheus promtool binary in the hosted runner tool cache.

inputs:
  version:
    description: Prometheus version to install, or latest.
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Resolve promtool version
      id: resolve
      shell: bash
      env:
        REQUESTED_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        case "$REQUESTED_VERSION" in
          latest)
            release_url="$(curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 60 \
              --output /dev/null --write-out '%{url_effective}' \
              https://github.com/prometheus/prometheus/releases/latest)"
            version="${release_url##*/}"
            version="${version#v}"
            ;;
          *)
            version="${REQUESTED_VERSION#v}"
            ;;
        esac

        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::invalid Prometheus version '$version'"
          exit 1
        fi

        case "${RUNNER_ARCH:-}" in
          X64)
            archive_arch=amd64
            tool_arch=x64
            ;;
          ARM64)
            archive_arch=arm64
            tool_arch=arm64
            ;;
          *)
            echo "::error::unsupported runner architecture '${RUNNER_ARCH:-}'"
            exit 1
            ;;
        esac

        archive="prometheus-${version}.linux-${archive_arch}.tar.gz"
        checksum="$(
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 60 \
            "https://github.com/prometheus/prometheus/releases/download/v${version}/sha256sums.txt" \
            | awk -v archive="$archive" '$2 == archive { print $1; exit }'
        )"
        if [[ ! "$checksum" =~ ^[[:xdigit:]]{64}$ ]]; then
          echo "::error::checksum for $archive was not found"
          exit 1
        fi

        {
          echo "version=$version"
          echo "archive=$archive"
          echo "archive_arch=$archive_arch"
          echo "tool_arch=$tool_arch"
          echo "checksum=$checksum"
        } >> "$GITHUB_OUTPUT"

    - name: Restore promtool tool cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.tool_cache }}/promtool
        key: promtool-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.version }}

    - name: Install promtool
      shell: bash
      env:
        PROMTOOL_VERSION: ${{ steps.resolve.outputs.version }}
        PROMTOOL_ARCHIVE: ${{ steps.resolve.outputs.archive }}
        PROMTOOL_ARCHIVE_ARCH: ${{ steps.resolve.outputs.archive_arch }}
        PROMTOOL_TOOL_ARCH: ${{ steps.resolve.outputs.tool_arch }}
        PROMTOOL_CHECKSUM: ${{ steps.resolve.outputs.checksum }}
      run: |
        set -euo pipefail

        if [ "${RUNNER_OS:-}" != "Linux" ]; then
          echo "::error::promtool setup supports only Linux runners"
          exit 1
        fi

        tool_root="${RUNNER_TOOL_CACHE:?RUNNER_TOOL_CACHE is not set}/promtool/${PROMTOOL_VERSION}/${PROMTOOL_TOOL_ARCH}"
        binary="$tool_root/promtool"
        complete="${RUNNER_TOOL_CACHE}/promtool/${PROMTOOL_VERSION}/${PROMTOOL_TOOL_ARCH}.complete"
        if [ -x "$binary" ] && [ -f "$complete" ]; then
          echo "Using cached promtool at $binary"
          echo "$tool_root" >> "$GITHUB_PATH"
          "$binary" --version
          exit 0
        fi

        archive_path="$RUNNER_TEMP/$PROMTOOL_ARCHIVE"
        extract_root="$RUNNER_TEMP/prometheus-${PROMTOOL_VERSION}.linux-${PROMTOOL_ARCHIVE_ARCH}"
        rm -rf "$extract_root" "$archive_path" "$tool_root" "$complete"
        mkdir -p "$extract_root" "$tool_root"
        curl --fail --silent --show-error --location \
          --connect-timeout 10 --max-time 300 \
          "https://github.com/prometheus/prometheus/releases/download/v${PROMTOOL_VERSION}/${PROMTOOL_ARCHIVE}" \
          --output "$archive_path"
        printf '%s  %s\n' "$PROMTOOL_CHECKSUM" "$archive_path" | sha256sum --check -
        tar -xzf "$archive_path" -C "$RUNNER_TEMP"
        install -m 0755 "$extract_root/promtool" "$binary"

        echo "$tool_root" >> "$GITHUB_PATH"
        "$binary" --version
        : > "$complete"
