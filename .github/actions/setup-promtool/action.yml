name: Setup promtool
description: Install a selected Prometheus promtool binary in the hosted runner tool cache.

inputs:
  version:
    description: Prometheus version to install, or latest.
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Restore latest promtool fallback cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.tool_cache }}/promtool
        key: promtool-latest-${{ runner.os }}-${{ runner.arch }}

    - name: Resolve promtool version
      id: resolve
      shell: bash
      env:
        REQUESTED_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        fallback_version=""
        allow_fallback=0
        case "$REQUESTED_VERSION" in
          latest)
            allow_fallback=1
            fallback_file="${RUNNER_TOOL_CACHE:?RUNNER_TOOL_CACHE is not set}/promtool/latest"
            if [ -s "$fallback_file" ]; then
              fallback_version="$(cat "$fallback_file")"
            fi
            if release_url="$(curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 60 \
              --output /dev/null --write-out '%{url_effective}' \
              https://github.com/prometheus/prometheus/releases/latest)"; then
              version="${release_url##*/}"
              version="${version#v}"
            elif [ -n "$fallback_version" ]; then
              version="$fallback_version"
              echo "::warning::Prometheus latest metadata was unavailable; using cached version $version"
            else
              echo "::error::Prometheus latest metadata was unavailable and no cached version exists"
              exit 1
            fi
            ;;
          *)
            version="${REQUESTED_VERSION#v}"
            ;;
        esac

        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::invalid Prometheus version '$version'"
          exit 1
        fi

        case "${RUNNER_ARCH:-}" in
          X64)
            archive_arch=amd64
            tool_arch=x64
            ;;
          ARM64)
            archive_arch=arm64
            tool_arch=arm64
            ;;
          *)
            echo "::error::unsupported runner architecture '${RUNNER_ARCH:-}'"
            exit 1
            ;;
        esac

        archive="prometheus-${version}.linux-${archive_arch}.tar.gz"
        {
          echo "version=$version"
          echo "archive=$archive"
          echo "archive_arch=$archive_arch"
          echo "tool_arch=$tool_arch"
          echo "fallback_version=$fallback_version"
          echo "allow_fallback=$allow_fallback"
        } >> "$GITHUB_OUTPUT"

    - name: Restore promtool tool cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.tool_cache }}/promtool
        key: promtool-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.version }}

    - name: Install promtool
      shell: bash
      env:
        PROMTOOL_VERSION: ${{ steps.resolve.outputs.version }}
        PROMTOOL_ARCHIVE: ${{ steps.resolve.outputs.archive }}
        PROMTOOL_ARCHIVE_ARCH: ${{ steps.resolve.outputs.archive_arch }}
        PROMTOOL_TOOL_ARCH: ${{ steps.resolve.outputs.tool_arch }}
        PROMTOOL_FALLBACK_VERSION: ${{ steps.resolve.outputs.fallback_version }}
        PROMTOOL_ALLOW_FALLBACK: ${{ steps.resolve.outputs.allow_fallback }}
      run: |
        set -euo pipefail

        if [ "${RUNNER_OS:-}" != "Linux" ]; then
          echo "::error::promtool setup supports only Linux runners"
          exit 1
        fi

        tool_cache="${RUNNER_TOOL_CACHE:?RUNNER_TOOL_CACHE is not set}/promtool"
        tool_root="$tool_cache/${PROMTOOL_VERSION}/${PROMTOOL_TOOL_ARCH}"
        binary="$tool_root/promtool"
        complete="$tool_cache/${PROMTOOL_VERSION}/${PROMTOOL_TOOL_ARCH}.complete"

        use_fallback() {
          if [ "$PROMTOOL_ALLOW_FALLBACK" != "1" ] || [ -z "$PROMTOOL_FALLBACK_VERSION" ]; then
            echo "::error::Prometheus release data was unavailable and no fallback is allowed"
            exit 1
          fi

          fallback_root="$tool_cache/${PROMTOOL_FALLBACK_VERSION}/${PROMTOOL_TOOL_ARCH}"
          fallback_binary="$fallback_root/promtool"
          fallback_complete="$tool_cache/${PROMTOOL_FALLBACK_VERSION}/${PROMTOOL_TOOL_ARCH}.complete"
          if [ ! -x "$fallback_binary" ] || [ ! -f "$fallback_complete" ]; then
            echo "::error::cached promtool fallback is incomplete"
            exit 1
          fi

          echo "::warning::Prometheus release data was unavailable; using cached version $PROMTOOL_FALLBACK_VERSION"
          echo "$fallback_root" >> "$GITHUB_PATH"
          "$fallback_binary" --version
          exit 0
        }

        if [ -x "$binary" ] && [ -f "$complete" ]; then
          echo "Using cached promtool at $binary"
          echo "$tool_root" >> "$GITHUB_PATH"
          "$binary" --version
          exit 0
        fi

        checksum_file="$RUNNER_TEMP/prometheus-${PROMTOOL_VERSION}.sha256sums.txt"
        if ! curl --fail --silent --show-error --location \
          --connect-timeout 10 --max-time 60 \
          "https://github.com/prometheus/prometheus/releases/download/v${PROMTOOL_VERSION}/sha256sums.txt" \
          --output "$checksum_file"; then
          use_fallback
        fi
        PROMTOOL_CHECKSUM="$(awk -v archive="$PROMTOOL_ARCHIVE" '$2 == archive { print $1; exit }' "$checksum_file")"
        if [[ ! "$PROMTOOL_CHECKSUM" =~ ^[[:xdigit:]]{64}$ ]]; then
          use_fallback
        fi

        archive_path="$RUNNER_TEMP/$PROMTOOL_ARCHIVE"
        extract_root="$RUNNER_TEMP/prometheus-${PROMTOOL_VERSION}.linux-${PROMTOOL_ARCHIVE_ARCH}"
        rm -rf "$extract_root" "$archive_path" "$tool_root" "$complete"
        mkdir -p "$extract_root" "$tool_root"
        if ! curl --fail --silent --show-error --location \
          --connect-timeout 10 --max-time 300 \
          "https://github.com/prometheus/prometheus/releases/download/v${PROMTOOL_VERSION}/${PROMTOOL_ARCHIVE}" \
          --output "$archive_path"; then
          use_fallback
        fi
        if ! printf '%s  %s\n' "$PROMTOOL_CHECKSUM" "$archive_path" | sha256sum --check -; then
          use_fallback
        fi
        tar -xzf "$archive_path" -C "$RUNNER_TEMP"
        install -m 0755 "$extract_root/promtool" "$binary"

        echo "$tool_root" >> "$GITHUB_PATH"
        "$binary" --version
        : > "$complete"
        printf '%s\n' "$PROMTOOL_VERSION" > "$tool_cache/latest"
