name: Setup GitHub CLI
description: Install a pinned GitHub CLI binary without modifying the runner image

runs:
  using: composite
  steps:
    - name: Install GitHub CLI
      shell: bash
      env:
        GH_VERSION: "2.97.0"
        GH_SHA256_X64: a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112
        GH_SHA256_ARM64: 73ea440ecad9c9e284429997ee6f93577bc6f7bc6fba357ef62c53ad8fb641a5
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" != "Linux" ]; then
          echo "::error::GitHub CLI setup supports only Linux runners"
          exit 1
        fi

        case "$RUNNER_ARCH" in
          X64)
            arch=amd64
            checksum="$GH_SHA256_X64"
            ;;
          ARM64)
            arch=arm64
            checksum="$GH_SHA256_ARM64"
            ;;
          *)
            echo "::error::unsupported runner architecture '$RUNNER_ARCH'"
            exit 1
            ;;
        esac

        archive="gh_${GH_VERSION}_linux_${arch}.tar.gz"
        install_root="$RUNNER_TEMP/gh-${GH_VERSION}-${arch}"
        archive_path="$RUNNER_TEMP/$archive"
        command rm -rf "$install_root" "$archive_path"
        mkdir -p "$install_root"
        curl --fail --silent --show-error --location \
          "https://github.com/cli/cli/releases/download/v${GH_VERSION}/${archive}" \
          --output "$archive_path"
        printf '%s  %s\n' "$checksum" "$archive_path" | sha256sum --check -
        tar -xzf "$archive_path" -C "$install_root"

        bin_dir="$install_root/gh_${GH_VERSION}_linux_${arch}/bin"
        echo "$bin_dir" >> "$GITHUB_PATH"
        "$bin_dir/gh" --version
