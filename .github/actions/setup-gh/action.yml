name: Setup GitHub CLI
description: Use a preinstalled GitHub CLI or install a pinned fallback

runs:
  using: composite
  steps:
    - name: Install GitHub CLI
      shell: bash
      env:
        GH_VERSION: "2.100.0"
        GH_SHA256_X64: e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be
        GH_SHA256_ARM64: ea4e7a581a32ccad6cc7923cb1576ac5859ba4b9a16ab22eb8f8a96e78e2e961
      run: |
        set -euo pipefail
        if command -v gh >/dev/null 2>&1 && gh --version; then
          exit 0
        fi

        if [ "$RUNNER_OS" != "Linux" ]; then
          echo "::error::GitHub CLI setup supports only Linux runners"
          exit 1
        fi

        case "$RUNNER_ARCH" in
          X64)
            arch=amd64
            checksum="$GH_SHA256_X64"
            ;;
          ARM64)
            arch=arm64
            checksum="$GH_SHA256_ARM64"
            ;;
          *)
            echo "::error::unsupported runner architecture '$RUNNER_ARCH'"
            exit 1
            ;;
        esac

        archive="gh_${GH_VERSION}_linux_${arch}.tar.gz"
        install_root="$RUNNER_TEMP/gh-${GH_VERSION}-${arch}"
        archive_path="$RUNNER_TEMP/$archive"
        command rm -rf "$install_root" "$archive_path"
        mkdir -p "$install_root"
        curl --fail --silent --show-error --location \
          "https://github.com/cli/cli/releases/download/v${GH_VERSION}/${archive}" \
          --output "$archive_path"
        printf '%s  %s\n' "$checksum" "$archive_path" | sha256sum --check -
        tar -xzf "$archive_path" -C "$install_root"

        bin_dir="$install_root/gh_${GH_VERSION}_linux_${arch}/bin"
        echo "$bin_dir" >> "$GITHUB_PATH"
        "$bin_dir/gh" --version
