[workspace]
members = [
    "crates/cc-lb-pricing",
    "crates/cc-lb-storage-sqlite",
    "crates/cc-lb-control",
    "crates/cc-lb-*",
    "plugins/router/cache-aware-wasmtime",
    "plugins/test-fixtures/wasmtime-shape-passthrough",
    "plugins/test-fixtures/wasmtime-observe-noop",
    "plugins/test-fixtures/wasmtime-filter-service-tier",
    "tests/fixtures/fake-anthropic",
    "tests/fixtures/mock-anthropic-oauth-server",
    "tests/load",
    "tests/loom",
    "tests/property",
    "tests/stress-suite",
    "tests/tls",
    "tests/integration",
    "tests/multi-replica",
]
exclude = [
    "fuzz",
]
resolver = "2"

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98.1"

[workspace.dependencies]
cc-lb-domain = { path = "crates/cc-lb-domain", version = "0.7.0" }
cc-lb-lifecycle = { path = "crates/cc-lb-lifecycle", version = "0.7.0" }
cc-lb-quota = { path = "crates/cc-lb-quota", version = "0.7.0" }
cc-lb-request-log = { path = "crates/cc-lb-request-log", version = "0.7.0" }
cc-lb-routing = { path = "crates/cc-lb-routing", version = "0.7.0" }
cc-lb-upstream = { path = "crates/cc-lb-upstream", version = "0.7.0" }

# Internal, unpublished — RFC-0002 lifecycle transport.
cc-lb-control = { path = "crates/cc-lb-control", version = "0.7.0" }
cc-lb-runtime-wasmtime    = { path = "crates/cc-lb-runtime-wasmtime", version = "0.1.4" }
cc-lb-plugin-wire = { version = "0.8", path = "crates/cc-lb-plugin-wire" }
cc-lb-pdk-wasmtime = { version = "0.1", path = "crates/cc-lb-pdk-wasmtime" }
cc-lb-pdk-wasmtime-macros = { version = "0.1", path = "crates/cc-lb-pdk-wasmtime-macros" }
cc-lb-plugin-conformance = { version = "0.2", path = "crates/cc-lb-plugin-conformance" }

# External wasmtime/rkyv ecosystem — wired up by cc-lb-runtime-wasmtime in Phase 1+.
# Phase 0 declares them here so member crates can opt in via `<name>.workspace = true`
# without churning the manifest.
wasmtime  = "48"
rkyv      = { version = "0.8", default-features = false }
bytecheck = { version = "0.8", default-features = false }
blake3    = { version = "1", default-features = false }
wasmparser = "0.259"

anyhow = "1"
arc-swap = "1"
async-stream = "0.3"
base64 = "0.23"
axum = "0.8"
bincode = { version = "2.0.1", features = ["serde"] }
bytes = "1"
async-trait = "0.1"
chacha20poly1305 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = "4"
criterion = "0.8"
crc32fast = "1"
dashmap = "6"
eventsource-stream = "0.2"
figment = "0.10"
flate2 = "1"
brotli = "9"
zstd = "0.14"
globset = "0.4"
h2 = "0.4.19"
hickory-resolver = "0.26"
hex = "0.4"
hyper = "1.11.1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-roots"] }
hyper-util = "0.1"
insta = { version = "1", features = ["json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
metrics-util = "0.20"
oauth2 = { version = "5", default-features = false }
once_cell = "1"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["trace"] }
proptest = "1"
rand = "0.10"
regex = "1"
# Held at 0.12: reqwest 0.13 dropped its ring provider feature. `rustls` now
# forces the aws-lc-rs backend (a second crypto stack, plus a C/asm build
# dependency in the musl cross build) and `rustls-no-provider` panics at
# Client construction unless a process-default CryptoProvider is installed
# first. Both are architecture decisions, not a version bump. See PR body.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
rust-embed = { version = "8", features = ["deterministic-timestamps"] }
secrecy = "0.10"
schemars = { version = "1", features = ["url2"] }
serde = "1"
serde_json = "1"
# sonic-rs: SIMD-accelerated JSON parser used for hot-path parse operations
# (from_slice / from_str). Serialization stays on serde_json to preserve
# byte-parity for hashes and shaped bodies (see docs/rfc/0003-json-strategy.md).
sonic-rs = "0.5"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["chrono", "json", "migrate", "postgres", "runtime-tokio", "sqlite", "tls-rustls-ring", "uuid"] }
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-util = "0.7"
toml = "1.1.6"
tower = "0.5"
tower-service = "0.3"
tower-http = "0.7"
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
url = "2"
zeroize = "1"
wat = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
strip = true
