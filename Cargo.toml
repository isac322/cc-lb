[workspace]
members = [
    "crates/aws-eventstream-codec",
    "crates/cc-lb-pricing",
    "crates/cc-lb-*",
    "benches/extism_sse_overhead",
    "examples/plugin-api-key",
    "examples/plugin-oauth-anthropic-pro",
    "examples/plugin-internal-key-mapping",
    "examples/plugin-api-key/extism-pdk",
    "examples/plugin-api-key/extism-pdk-macros",
    "tests/fixtures/fake-anthropic",
    "tests/fixtures/mock-anthropic-oauth-server",
    "tests/fixtures/fake-bedrock-runtime",
    "tests/fixtures/fake-bedrock-mantle",
    "tests/fixtures/fake-vertex",
    "tests/load",
    "tests/loom",
    "tests/plugin-lifecycle",
    "tests/property",
    "tests/tls",
    "tests/crash-recovery",
]
exclude = ["third_party/gcp_auth", "fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95.0"

[workspace.dependencies]
anyhow = "1"
arc-swap = "1"
async-stream = "0.3"
aws-sigv4 = "1"
base64 = "0.22"
axum = "0.8"
bytes = "1"
async-trait = "0.1"
cargo-audit = "0.22"
cargo-deny = "0.19"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = "4"
criterion = "0.8"
crc32fast = "1"
dashmap = "6"
eventsource-stream = "0.2"
extism = { version = "1", default-features = false, features = ["wasmtime-default-features"] }
figment = "0.10"
gcp_auth = "0.13"
globset = "0.4"
hickory-resolver = "0.26"
hyper = "1"
http = "1"
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-roots"] }
hyper-util = "0.1"
insta = "1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
notify = "8"
oauth2 = { version = "5", default-features = false }
once_cell = "1"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["trace"] }
proptest = "1"
redb = "4"
regex = "1"
ring = "0.17"
rust-embed = "8"
secrecy = "0.10"
schemars = { version = "1", features = ["url2"] }
serde = "1"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
tempfile = "3"
thiserror = "2"
tokio = "1"
tower = "0.5"
tower-service = "0.3"
tower-http = "0.6"
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["serde", "v4"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
url = "2"
wat = "1"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
strip = true
