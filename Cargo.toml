[workspace]
members = [
    "crates/cc-lb-pricing",
    "crates/cc-lb-storage-sqlite",
    "crates/cc-lb-control",
    "crates/cc-lb-*",
    "plugins/router/cache-aware-wasmtime",
    "plugins/test-fixtures/wasmtime-shape-passthrough",
    "plugins/test-fixtures/wasmtime-filter-service-tier",
    "plugins/test-fixtures/wasmtime-dual-slot",
    "tests/fixtures/fake-anthropic",
    "tests/fixtures/mock-anthropic-oauth-server",
    "tests/load",
    "tests/loom",
    "tests/property",
    "tests/stress-suite",
    "tests/tls",
    "tests/integration",
    "tests/multi-replica",
    "tools/workspace-hack",
]
exclude = [
    "fuzz",
]
resolver = "2"

[workspace.package]
version = "2.2.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99.1"

[workspace.dependencies]
cc-lb-domain = { path = "crates/cc-lb-domain", version = "2.2.1" }
cc-lb-provider-spi = { path = "crates/cc-lb-provider-spi", version = "2.2.1" }
cc-lb-provider-anthropic = { path = "crates/cc-lb-provider-anthropic", version = "2.2.1" }
cc-lb-provider-openai = { path = "crates/cc-lb-provider-openai", version = "2.2.1" }
cc-lb-provider-gemini = { path = "crates/cc-lb-provider-gemini", version = "2.2.1" }
cc-lb-provider-vertex = { path = "crates/cc-lb-provider-vertex", version = "2.2.1" }
cc-lb-providers = { path = "crates/cc-lb-providers", version = "2.2.1" }
cc-lb-routing-trace = { path = "crates/cc-lb-routing-trace", version = "2.2.1" }
cc-lb-runtime-sync = { path = "crates/cc-lb-runtime-sync", version = "2.2.1" }
cc-lb-vertex-auth = { path = "crates/cc-lb-vertex-auth", version = "2.2.1" }
cc-lb-signer-vertex = { path = "crates/cc-lb-signer-vertex", version = "2.2.1" }
cc-lb-lifecycle = { path = "crates/cc-lb-lifecycle", version = "2.2.1" }
cc-lb-quota = { path = "crates/cc-lb-quota", version = "2.2.1" }
cc-lb-request-log = { path = "crates/cc-lb-request-log", version = "2.2.1" }
cc-lb-routing = { path = "crates/cc-lb-routing", version = "2.2.1" }
cc-lb-upstream = { path = "crates/cc-lb-upstream", version = "2.2.1" }

# Internal, unpublished — RFC-0002 lifecycle transport.
cc-lb-control = { path = "crates/cc-lb-control", version = "2.2.1" }
cc-lb-proxy-telemetry = { path = "crates/cc-lb-proxy-telemetry", version = "2.2.1" }
cc-lb-routing-eval = { path = "crates/cc-lb-routing-eval", version = "2.2.1" }
cc-lb-event-pipeline = { path = "crates/cc-lb-event-pipeline", version = "2.2.1" }
cc-lb-runtime-wasmtime    = { path = "crates/cc-lb-runtime-wasmtime", version = "0.3.0" }
cc-lb-plugin-wire = { version = "0.9", path = "crates/cc-lb-plugin-wire" }
cc-lb-pdk-wasmtime = { version = "0.2", path = "crates/cc-lb-pdk-wasmtime" }
cc-lb-pdk-wasmtime-macros = { version = "0.2", path = "crates/cc-lb-pdk-wasmtime-macros" }
cc-lb-workspace-hack = { path = "tools/workspace-hack" }

wasmtime = { version = "50.0.2", default-features = false, features = [
    "anyhow",
    "cranelift",
    "pooling-allocator",
    "gc",
    "gc-null",
    "reexport-wasmparser",
]}
rkyv      = { version = "0.8", default-features = false }
blake3    = { version = "1", default-features = false }

anyhow = "1"
arc-swap = "1"
async-stream = "0.3"
base64 = "0.23"
axum = "0.8"
backon = "1.6"
bytes = "1"
async-trait = "0.1"
chacha20poly1305 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = "4"
dashmap = "6"
figment = "0.10"
flate2 = "1"
brotli = "9"
zstd = { version = "0.14.3", default-features = false }
globset = "0.4"
h2 = "0.4.20"
hickory-resolver = "0.26"
hex = "0.4"
hyper = "1.12.0"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-roots"] }
hyper-util = "0.1"
insta = { version = "1", features = ["json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
metrics-util = "0.20"
oauth2 = { version = "5", default-features = false }
once_cell = "1"
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "internal-logs"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "internal-logs"] }
proptest = "1"
rand = "0.10"
regex = "1"
# reqwest 0.13 uses `rustls-no-provider` so we stay on the workspace's single
# `ring` crypto stack without pulling in `aws-lc-rs`. HTTP client constructors
# install `rustls::crypto::ring::default_provider()` before building a client.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
ring = "0.17"
rust-embed = { version = "8", features = ["deterministic-timestamps"] }
secrecy = "0.10"
schemars = { version = "1", features = ["url2"] }
serde = "1"
serde_json = "1"
# sonic-rs: SIMD-accelerated JSON parser used for hot-path parse operations
# (from_slice / from_str). Serialization stays on serde_json to preserve
# byte-parity for hashes and shaped bodies (see docs/rfc/0003-json-strategy.md).
sonic-rs = "0.5"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["chrono", "json", "migrate", "postgres", "runtime-tokio", "sqlite", "tls-rustls-ring", "uuid"] }
tempfile = "3"
thiserror = "2"
tokio = "1.54.1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = "0.7"
toml = "1.1.8"
tower = "0.5"
tower-service = "0.3"
tower-http = "0.7"
tracing = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false, features = ["tracing-log"] }
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
url = "2"
zeroize = "1"
wat = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.libsqlite3-sys]
opt-level = 2

[profile.dev.package.ring]
opt-level = 2

[profile.dev.package.zstd]
opt-level = 2

[profile.dev.package.zstd-sys]
opt-level = 2

[profile.dev.package.flate2]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2

[profile.dev.package.brotli]
opt-level = 2

[profile.dev.package.chacha20poly1305]
opt-level = 2

[profile.dev.package.blake3]
opt-level = 2

[profile.dev.package."sha2:0.11.1"]
opt-level = 2

[profile.dev.package."sha2:0.10.9"]
opt-level = 2

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
strip = true
