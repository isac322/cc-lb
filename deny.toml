[graph]
exclude = []

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "CC0-1.0", "CDLA-Permissive-2.0", "MPL-2.0", "Unicode-3.0", "ISC", "Zlib"]
confidence-threshold = 0.8

[advisories]
# cargo audit gates warnings as failures in CI via `cargo audit --deny warnings`.
# `rustls-pemfile` remains reachable through `rustls 0.23`; removing it requires
# a broader TLS stack migration than this quality-gate task.
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2025-0134", reason = "rustls 0.23 still depends on rustls-pemfile 2.2.0; removing it requires a broader TLS stack migration." },
    { id = "RUSTSEC-2025-0141", reason = "cc-lb-engine still uses bincode 2.x `serde` integration for persisted internal records; replacing it requires a storage-format migration." },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained but required by tikv-jemalloc-ctl for memory bound testing." },
    { id = "RUSTSEC-2026-0459", reason = "SQLx 0.9.0 caps libsqlite3-sys below 0.38, while the patched SQLite binding requires >=0.39.0; the official SQLx upper-bound fix is not released yet. The bundled SQLite remains exposed to the advisory's local crafted database/WAL condition until that upstream patch is released and the lockfile can move." },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = ["native-tls", "openssl", "openssl-sys"]
skip = []
skip-tree = []
allow-wildcard-paths = true
