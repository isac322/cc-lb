# release-plz config — https://release-plz.dev/docs/config
#
# Policy:
#   * Only cc-lb-plugin-api is published to crates.io. The historical
#     plugin trio + companion crates were deleted in the wasmtime
#     cutover, so this file degenerated from "trio publish" to solo.
#   * All other workspace crates are excluded from release-plz entirely
#     (`release = false` default). Their versions are bumped manually
#     by editing workspace.package.version in the root Cargo.toml.
#
# CI-only: releases run exclusively via .github/workflows/release-plz.yml.
# Do NOT run `release-plz release` or `release-plz release-pr` locally.

[workspace]
release = false

[[package]]
name = "cc-lb-plugin-api"
release = true
semver_check = true
