# release-plz config — https://release-plz.dev/docs/config
#
# CI-only: public crate releases run via .github/workflows/release-plz.yml.
# Server tags and draft Releases use release-plz-server.toml from
# .github/workflows/release-server.yml. Do not run either release command
# locally.
#
# Published contract crates (crates.io): cc-lb-plugin-conformance
# and cc-lb-runtime-wasmtime. Wire and PDK crates are intentionally
# excluded from this release track until their approved release.

[workspace]
release = false

[[package]]
name = "cc-lb-plugin-wire"
release = false
semver_check = true

[[package]]
name = "cc-lb-pdk-wasmtime-macros"
release = false
semver_check = true

[[package]]
name = "cc-lb-pdk-wasmtime"
release = false
semver_check = true

[[package]]
name = "cc-lb-plugin-conformance"
release = true
semver_check = true

[[package]]
name = "cc-lb-runtime-wasmtime"
release = true
semver_check = true
