# release-plz config — https://release-plz.dev/docs/config
#
# CI-only: releases run exclusively via .github/workflows/release-plz.yml.
# Do NOT run `release-plz release` or `release-plz release-pr` locally.
# Published contract crates (crates.io): cc-lb-plugin-wire,
# cc-lb-pdk-wasmtime-macros, cc-lb-pdk-wasmtime, cc-lb-plugin-conformance,
# cc-lb-runtime-wasmtime. Plus cc-lb-server as the publish=false app/image
# release anchor (see its package block below).

[workspace]
release = false

[[package]]
name = "cc-lb-plugin-wire"
release = true
semver_check = true

[[package]]
name = "cc-lb-pdk-wasmtime-macros"
release = true
semver_check = true

[[package]]
name = "cc-lb-pdk-wasmtime"
release = true
semver_check = true

[[package]]
name = "cc-lb-plugin-conformance"
release = true
semver_check = true

[[package]]
name = "cc-lb-runtime-wasmtime"
release = true
semver_check = true

# App/image release anchor. publish = false (Cargo.toml) means no crates.io; this
# only cuts the git tag + GitHub release. cc-lb-server shares version.workspace
# with the other 26 internal crates, so its bump moves that one shared version —
# the deployment unit's version. git_tag_name drops the crate prefix to `v{X}`,
# which is exactly the tag cd.yml publishes the image from. semver_check is off:
# a binary has no crates.io API contract to diff.
[[package]]
name = "cc-lb-server"
release = true
semver_check = false
git_tag_name = "v{{ version }}"
