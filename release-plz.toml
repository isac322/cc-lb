# release-plz config — https://release-plz.dev/docs/config
#
# CI-only: releases run exclusively via .github/workflows/release-plz.yml.
# Do NOT run `release-plz release` or `release-plz release-pr` locally.
# Published contract crates (crates.io): cc-lb-plugin-wire,
# cc-lb-pdk-wasmtime-macros, cc-lb-pdk-wasmtime, cc-lb-plugin-conformance,
# and cc-lb-runtime-wasmtime. Server releases are owned separately by
# .github/workflows/release-server.yml.

[workspace]
release = false

[[package]]
name = "cc-lb-plugin-wire"
release = true
semver_check = true

[[package]]
name = "cc-lb-pdk-wasmtime-macros"
release = true
semver_check = true

[[package]]
name = "cc-lb-pdk-wasmtime"
release = true
semver_check = true

[[package]]
name = "cc-lb-plugin-conformance"
release = true
semver_check = true

[[package]]
name = "cc-lb-runtime-wasmtime"
release = true
semver_check = true
